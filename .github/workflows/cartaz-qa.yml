name: Cartaz pieces
on:
  push:
    paths: ['tests/browser_menus_lab.cjs', 'tests/test_menus_163.py', 'tools/menu_casca.py', 'tools/lab_nav.py', 'assets/licoes/menu.*', 'cidadania/m1/**', 'cidadania/m2/**', 'cidadania/25-de-abril/**', 'tests/browser_cabecalhos_compactos.cjs', 'tests/browser_lupa_compacta.cjs', 'assets/cabecalho-compacto.css', 'index.html', 'narrativas/**', 'tools/laboratorio.py', 'assets/laboratorio/cartaz.*', 'assets/cartaz-*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/browser_lente_projecao_entrada.cjs', 'tests/browser_projecao_palavras.cjs', 'projetar/**', 'assets/projection*', 'assets/fundo-lente.css', 'assets/cartaz-entrada.css', 'tests/*cartaz*', 'tests/browser_creditos_i.cjs', 'assets/info-i.*', 'tools/ideias_piloto.py', 'tools/trocas/creditos-i-lente1-20261107.json', 'tests/browser_cidade_cartaz.cjs', 'assets/site-portals.css', 'tools/trocas/cidade-cartaz-lente-20261108.json', '.github/workflows/cartaz-qa.yml']
  pull_request:
    paths: ['tests/browser_menus_lab.cjs', 'tests/test_menus_163.py', 'tools/menu_casca.py', 'tools/lab_nav.py', 'assets/licoes/menu.*', 'cidadania/m1/**', 'cidadania/m2/**', 'cidadania/25-de-abril/**', 'tests/browser_cabecalhos_compactos.cjs', 'tests/browser_lupa_compacta.cjs', 'assets/cabecalho-compacto.css', 'index.html', 'narrativas/**', 'tools/laboratorio.py', 'assets/laboratorio/cartaz.*', 'assets/cartaz-*', 'assets/appearance.css', 'demonstracoes/cartaz-animacoes/**', 'tests/browser_lente_projecao_entrada.cjs', 'tests/browser_projecao_palavras.cjs', 'projetar/**', 'assets/projection*', 'assets/fundo-lente.css', 'assets/cartaz-entrada.css', 'tests/*cartaz*', 'tests/browser_creditos_i.cjs', 'assets/info-i.*', 'tools/ideias_piloto.py', 'tools/trocas/creditos-i-lente1-20261107.json', 'tests/browser_cidade_cartaz.cjs', 'assets/site-portals.css', 'tools/trocas/cidade-cartaz-lente-20261108.json', '.github/workflows/cartaz-qa.yml']
jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: contratos comparam a base publicada, sem reduzir os testes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 01/11/2026: bateria inteira antes de instalar dependências que contêm HTML alheio ao sítio.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*cartaz*.test.cjs tests/appearance.test.cjs
      # 03/11/2026: cabeçalhos compactos, contraste real, projeção e zoom nativo.
      - run: node tests/browser_cabecalhos_compactos.cjs
        env:
          HEADER_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos
      # 03/11/2026: oito ciclos completos da lupa e dezoito estados parados.
      - run: node tests/browser_lupa_compacta.cjs
        env:
          LUPA_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos/ciclos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabecalhos-compactos
          path: ${{ runner.temp }}/cabecalhos-compactos
          retention-days: 30
      - run: node tests/browser_cartaz.cjs
      - run: node tests/browser_cartaz_familia.cjs
      # 07/11/2026: decisões 153, 176 e 177, cada «i» novo das entradas abre por teclado e por toque, sem tapar texto, e imprime o crédito.
      - run: node tests/browser_creditos_i.cjs
      # 08/11/2026: pedido cidade-cartaz-lente, o cartão «Ler a cidade.» da entrada de 320 a 1280 px e no modo escuro: sem deslize, sem
      # transbordo, fotografia carregada, «i» a abrir e a fechar e alvos de 44 px.
      - run: node tests/browser_cidade_cartaz.cjs
      - run: node tests/browser_lente_projecao_entrada.cjs
      # 05/11/2026: revisão de 5/11 (lente-cabecalho-2), nenhuma palavra partida a meio na moldura de projeção.
      - run: node tests/browser_projecao_palavras.cjs
      # 01/11/2026: movimento, estado final, primeira ação e contrato do visor.
      - run: node tests/browser_cartaz_animacoes.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs

  # 01/11/2026: bateria integral, incluindo os moldes que não acionam workflows por caminhos.
  regressao-completa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - node tests/browser_formas.cjs
          - node tests/browser_lab_percursos.cjs
          # 05/11/2026: decisão 163, menus do Laboratório e menu ≡ das lições (as quatro famílias).
          - node tests/browser_menus_lab.cjs
          - node tests/browser_tres_cartas.cjs
          - node tests/browser_licoes_lente.cjs
          - node tests/browser_ideias.cjs
          - node tests/browser_cidadania_m1_sessoes.cjs
          - node tests/browser_cidadania_m2_sessoes.cjs
          - node tests/browser_opcoes.cjs
          - node tests/browser_resultados_turma.cjs
          - python tests/browser_reciclagem_lente.py
          - python tests/browser_texto_justificado.py
          - python tests/browser_hierarquia_titulos.py
          - python tests/browser_cidadania_percurso.py
          - python tests/browser_cidadania_butler_singer.py
          - python tests/browser_cidadania_anomalias.py
          - python tests/browser_lab_treinos.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          pip install playwright
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          python -m playwright install --with-deps chromium
      - name: Verificar molde completo
        run: ${{ matrix.command }}
