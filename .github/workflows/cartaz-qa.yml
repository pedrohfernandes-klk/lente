jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: contratos comparam a base publicada, sem reduzir os testes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 01/11/2026: bateria inteira antes de instalar dependências que contêm HTML alheio ao sítio.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      # 08/11/2026: decisões 153, 162 e 176 (pedido lente-3), a camada dos créditos atrás do «i» das famílias L14 a L19 está aplicada
      # com as contagens exatas e volta atrás sem perdas (tools/creditos_i.py trata o escape do HTML dentro dos JSON dos cartões).
      - run: python tools/creditos_i.py --verificar
      # 08/11/2026: decisões 153 e 176 (pedido lente-4), a camada do «i» na projeção e dos créditos das missões de «Ler a cidade» está
      # aplicada por cima da do pedido lente-3, com as contagens exatas, e volta atrás sem perdas.
      - run: python tools/creditos_i.py --verificar --manifesto tools/trocas/creditos-i-lente4-20261108.json
      # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*cartaz*.test.cjs tests/appearance.test.cjs
      # 03/11/2026: cabeçalhos compactos, contraste real, projeção e zoom nativo.
      - run: node tests/browser_cabecalhos_compactos.cjs
        env:
          HEADER_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos
      # 03/11/2026: oito ciclos completos da lupa e dezoito estados parados.
      - run: node tests/browser_lupa_compacta.cjs
        env:
          LUPA_OUTPUT: ${{ runner.temp }}/cabecalhos-compactos/ciclos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabecalhos-compactos
          path: ${{ runner.temp }}/cabecalhos-compactos
          retention-days: 30
      - run: node tests/browser_cartaz.cjs
      - run: node tests/browser_cartaz_familia.cjs
      # 07/11/2026: decisões 153, 176 e 177, cada «i» novo das entradas abre por teclado e por toque, sem tapar texto, e imprime o crédito.
      - run: node tests/browser_creditos_i.cjs
      # 08/11/2026: decisões 153, 162 e 176 (pedido lente-2), os «i» novos da Justiça, da Ética e da Estética, das lições do piloto e
      # do «Ideias» (imagem e vídeo) e das sessões do M2 e páginas do M1, a 320, 390, 768 e 1280 px, em claro e escuro: sem deslize,
      # abrem e fecham por clique, Enter e Escape, o crédito aberto cabe no ecrã sem tapar texto, e a impressão leva o crédito.
      - run: node tests/browser_creditos_i_lente2.cjs
      # 08/11/2026: decisões 153, 162 e 176 (pedido lente-3), os «i» novos do portal e dos passos da Cidadania (com as portas dos
      # módulos), dos cartões com fr-cred (narrativas, «Como se investiga», Ética, gigantes), das vozes, dos retratos de Butler e Singer
      # e de «Ler a cidade» (num cartão e na gaveta de um lugar), a 320, 390, 768 e 1280 px, em claro e escuro: sem deslize, abrem e
      # fecham por clique, Enter e Escape, o crédito aberto cabe no ecrã sem tapar texto, e a impressão leva o crédito.
      - run: node tests/browser_creditos_i_lente3.cjs
      # 08/11/2026: decisões 153 e 176 (pedido lente-4), o «i» das missões de «Ler a cidade», na página e na gaveta de um lugar, a 320,
      # 390, 768 e 1280 px, em claro e escuro (abre e fecha por clique, Enter e Escape, sem deslize, o crédito aberto dentro do ecrã), e
      # o «i» na projeção (os três modos): o círculo fechado e aberto e o foco com contraste de 3:1 ou mais, medido no navegador.
      - run: node tests/browser_creditos_i_lente4.cjs
      # 08/11/2026: pedido cidade-cartaz-lente, o cartão «Ler a cidade.» da entrada de 320 a 1280 px e no modo escuro: sem deslize, sem
      # transbordo, fotografia carregada, «i» a abrir e a fechar e alvos de 44 px.
      - run: node tests/browser_cidade_cartaz.cjs
      # 12/11/2026: pedido entrada-temas, a entrada em quatro temas e a página do tema 02 (informacao/), a 390 e a 1280 px, em claro e
      # escuro, com ?projetar=1 e dentro da moldura de projeção (três tamanhos de letra): sem deslize nem transbordo, a entrada abaixo de
      # 3000 px a 390 px, foco de teclado por todas as ligações, cada «i» a abrir e a fechar, alvos de 44 px, o tema 02 a abrir e a sua
      # dobra «Ver tudo neste tema» a abrir e a fechar por clique e por teclado. Os testes sem navegador (tests/test_entrada_temas.py:
      # ligações, ordem dos temas, regras de texto, créditos e manifesto fechado) correm com os outros test_*.py, acima.
      # 13/11/2026: pedido temas-01-03-04. O mesmo teste percorre agora as páginas dos quatro temas (justica-e-vida-em-comum/, informacao/,
      # historias-e-criacao/ e imagem-som-e-cidade/), a 320, 390, 768 e 1280 px, em claro, em escuro e na moldura de projeção: cada cartão
      # da entrada abre a sua página, e em cada página medem-se o transbordo, o foco (3:1), o contraste do bloco «Para aplicar» (4,5:1), os
      # alvos de 44 px, o «i», a dobra «Ver tudo neste tema» por clique e por teclado e a resposta de todas as ligações.
      - run: node tests/browser_entrada_temas.cjs
      # 08/11/2026: decisão 152 («cuidado em todas as lições», pedido cuidado-lente), as tabelas novas (Justiça, Aplicar, oficinas
      # e sessões do M2) a 360 e a 900 px, no claro e no escuro, sem transbordo, e as referências com espaço sem quebra numa só linha.
      - run: node tests/browser_cuidado_lente.cjs
      - run: node tests/browser_lente_projecao_entrada.cjs
      # 05/11/2026: revisão de 5/11 (lente-cabecalho-2), nenhuma palavra partida a meio na moldura de projeção.
      - run: node tests/browser_projecao_palavras.cjs
      # 01/11/2026: movimento, estado final, primeira ação e contrato do visor.
      - run: node tests/browser_cartaz_animacoes.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs

  # 01/11/2026: bateria integral, incluindo os moldes que não acionam workflows por caminhos.
  regressao-completa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - node tests/browser_formas.cjs
          - node tests/browser_lab_percursos.cjs
          # 05/11/2026: decisão 163, menus do Laboratório e menu ≡ das lições (as quatro famílias).
          - node tests/browser_menus_lab.cjs
          - node tests/browser_tres_cartas.cjs
          - node tests/browser_licoes_lente.cjs
          - node tests/browser_ideias.cjs
          - node tests/browser_cidadania_m1_sessoes.cjs
          - node tests/browser_cidadania_m2_sessoes.cjs
          - node tests/browser_opcoes.cjs
          - node tests/browser_resultados_turma.cjs
          - python tests/browser_reciclagem_lente.py
          - python tests/browser_texto_justificado.py
          - python tests/browser_hierarquia_titulos.py
          - python tests/browser_cidadania_percurso.py
          - python tests/browser_cidadania_butler_singer.py
          - python tests/browser_cidadania_anomalias.py
          - python tests/browser_lab_treinos.py
          - python tests/browser_justica_novas.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          pip install playwright
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          # Cada cliente instala a versão de Chromium que os seus testes usam.
          if [[ "${{ matrix.command }}" == node* ]]; then
            npx playwright install --with-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verificar molde completo
        run: ${{ matrix.command }}
