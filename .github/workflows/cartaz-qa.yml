name: Cartaz pieces
on:
  push:
    paths: ['index.html', 'narrativas/**', 'tools/laboratorio.py', 'assets/laboratorio/cartaz.*', 'assets/cartaz-*', 'assets/appearance.css', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
  pull_request:
    paths: ['index.html', 'narrativas/**', 'tools/laboratorio.py', 'assets/laboratorio/cartaz.*', 'assets/cartaz-*', 'assets/appearance.css', 'tests/*cartaz*', '.github/workflows/cartaz-qa.yml']
jobs:
  pieces:
    runs-on: ubuntu-latest
    steps:
      # 01/11/2026: contratos comparam a base publicada, sem reduzir os testes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 01/11/2026: bateria inteira antes de instalar dependências que contêm HTML alheio ao sítio.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*cartaz*.test.cjs tests/appearance.test.cjs
      - run: node tests/browser_cartaz.cjs
      - run: node tests/browser_cartaz_familia.cjs
      # 01/11/2026: decisão 61, hierarquia e escala nas páginas migradas.
      - run: node tests/hierarquia-cartaz.cjs
