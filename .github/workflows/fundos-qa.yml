name: Desenhos de fundo
on:
  pull_request:
    paths: ['assets/fundo*', 'assets/carris-eletrico.svg', 'assets/justica/rossio-eletrico-260.webp', 'tools/gerar_carris.py', 'olhar-e-decidir/justica/index.html', 'tests/*fundo*', '.github/workflows/fundos-qa.yml']
  push:
    paths: ['assets/fundo*', 'assets/carris-eletrico.svg', 'assets/justica/rossio-eletrico-260.webp', 'tools/gerar_carris.py', 'olhar-e-decidir/justica/index.html', 'tests/*fundo*', '.github/workflows/fundos-qa.yml']
permissions:
  contents: read
jobs:
  desenho:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 02/11/2026: bateria inteira antes de instalar dependências que contêm HTML alheio.
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/gerar_carris.py --verificar
      # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_fundo_carris.cjs
        env:
          FUNDO_PROVAS: provas-fundo-carris
      - uses: actions/upload-artifact@v4
        with:
          name: justica-fundo-provas
          path: provas-fundo-carris
