name: Lente — formas e montagem
on:
  pull_request:
    paths:
      - 'assets/formas/**'
      # 30/10/2026: percursos novos do Laboratório.
      - 'assets/laboratorio/**'
      - 'tools/laboratorio.py'
      - 'tests/*lab_percursos*'
      - 'assets/narrativas-core/**'
      - 'assets/appearance*'
      - 'assets/projection-launcher.js'
      - 'narrativas/**'
      - 'curadoria/**'
      - 'tests/*formas*'
      - 'tests/*justificado*'
      - '.github/workflows/formas-qa.yml'
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e contratos do laboratório
        run: |
          # 30/10/2026: navegação e progresso dos percursos novos.
          node --check assets/laboratorio/percursos.js
          node --check assets/laboratorio/ligacoes.js
          node --check assets/formas/corta.js
          node --check assets/formas/leituras.js
          node --check assets/formas/obras.js
          node --check assets/formas/entrada.js
          node --check assets/formas/progresso.js
          node --check assets/formas/cartoes.js
          node --check assets/formas/certa-manha.js
          node --check assets/formas/cena-que-falta.js
          python -m unittest discover -s tests -p 'test_formas.py' -v
          python -m unittest discover -s tests -p 'test_lab*.py' -v
          python -m unittest discover -s tests -p 'test_appearance_universal.py' -v
          python -m unittest discover -s tests -p 'test_texto_justificado.py' -v
      - name: Preparar navegador
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Percursos completos e conservação do existente
        run: |
          node tests/browser_formas.cjs
          # 30/10/2026: percursos e Três cartas no CI.
          node tests/browser_lab_percursos.cjs
          node tests/browser_tres_cartas.cjs
