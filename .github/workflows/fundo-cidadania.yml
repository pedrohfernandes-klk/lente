name: Cidadania, piloto de fundo
on:
  pull_request:
    paths: ['cidadania/m2/index.html', 'assets/fundo-algoritmos.css', 'assets/fundos.*', 'tools/fundo_cidadania_piloto.py', 'tests/browser_fundo_cidadania.cjs', '.github/workflows/fundo-cidadania.yml']
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_fundo_cidadania.cjs
