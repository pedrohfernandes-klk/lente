name: Lente — lições em cartões
on:
  pull_request:
    paths:
      - 'assets/licoes/**'
      - 'tools/licoes/**'
      - 'tools/licoes_lente.py'
      - 'cidadania/piloto/**'
      - 'tests/*licoes*'
      # 30/10/2026: coração do Laboratório («Ideias», piloto escondido de 31/10): lições, entrada, guião, guia do docente,
      # imagens, a página do Young na Biblioteca e a medida das opções da pasta nova.
      - 'narrativas/ideias/**'
      - 'assets/laboratorio/ideias/**'
      - 'tools/ideias_piloto.py'
      - 'tools/metodo.py'
      - 'tools/laboratorio*.py'
      - 'tests/*laboratorio*'
      - 'narrativas/**'
      - 'tools/ideias_publico.py'
      - 'tools/gerar_ideias_colagem.py'
      - 'biblioteca/index.html'
      - 'biblioteca/young-tecnica-1940/**'
      - 'tools/medir_opcoes.py'
      - 'tests/*ideias*'
      - 'tests/test_opcoes_equilibradas.py'
      - 'tests/test_lab_percursos.py'
      - 'tests/*progresso_laboratorio*'
      - 'tests/test_cidadania_base_motor.py'
      # 05/11/2026: plano do molde da Cidadania, pedido 1 (motor, casca e progresso): a peça «i», o gerador da página do
      # módulo, o manifesto fechado do pedido, o teste do contrato e a lição de ensaio.
      - 'assets/info-i.*'
      - 'tools/cidadania_piloto.py'
      - 'tools/trocas/molde-pedido1-*'
      - 'tests/test_molde_cidadania.py'
      - 'tests/test_cidadania_piloto.py'
      - 'tests/fixtures/molde_ensaio.py'
      # 05/11/2026: plano do molde da Cidadania, pedido 2 (s01 do M1 na versão final): o ajudante comum, o registo dos excertos,
      # a página e a versão para imprimir da s01, o manifesto fechado do pedido e a sua camada nos testes.
      - 'tools/cidadania_molde.py'
      - 'tools/cidadania_fontes.json'
      - 'tools/cidadania_m1_layout.py'
      - 'tools/trocas/molde-pedido2-*'
      - 'cidadania/m1/sessoes/01/**'
      - 'tests/molde_pedido2.py'
      - 'tests/test_cidadania_m1_molde.py'
      - '.github/workflows/licoes-qa.yml'
permissions:
  contents: read
jobs:
  licoes:
    runs-on: ubuntu-latest
    # 05/11/2026: no #119 a preparação demorou 8 minutos e o GitHub cancelou o percurso das lições ao fim de 10, com tudo a passar.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 02/11/2026: L104-01, inclui o contrato de modalidade e a comparação com a base.
      - name: Fontes, validação e páginas geradas
        run: |
          node --check assets/licoes/jogo.js
          node --check assets/licoes/casca.js
          # 05/11/2026: plano do molde da Cidadania, pedido 1
          node --check assets/licoes/aula-clara.js
          node --check assets/licoes/ampliar-documentos.js
          node --check assets/licoes/recolha.js
          node --check assets/info-i.js
          node --test tests/progresso_laboratorio.test.cjs
          python -m unittest discover -s tests -p 'test_cidadania_base_motor.py' -v
          python -m unittest discover -s tests -p 'test_laboratorio_contratos.py' -v
          python tools/licoes_lente.py --verificar
          python -m unittest discover -s tests -p 'test_licoes_lente.py' -v
          python -m unittest discover -s tests -p 'test_molde_cidadania.py' -v
          python tools/cidadania_piloto.py --verificar
          python -m unittest discover -s tests -p 'test_cidadania_piloto.py' -v
          # 05/11/2026: plano do molde da Cidadania, pedido 2
          python -m unittest discover -s tests -p 'test_cidadania_m1_molde.py' -v
          # 30/10/2026: coração do Laboratório (31/10)
          python tools/ideias_piloto.py --verificar
          python tools/gerar_ideias_colagem.py --verificar
          python tools/ideias_publico.py --verificar
          python tools/medir_opcoes.py --verificar
          python -m unittest discover -s tests -p 'test_ideias*.py' -v
          python -m unittest discover -s tests -p 'test_opcoes_equilibradas.py' -v
          python -m unittest discover -s tests -p 'test_lab_percursos.py' -v
      - name: Preparar navegador
        run: |
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Percurso completo de cada lição
        run: |
          node tests/browser_progresso_laboratorio.cjs
          node tests/browser_licoes_lente.cjs
  # 01/11/2026: o teste de navegador de «Ideias» passa para um trabalho próprio, em paralelo. No mesmo trabalho que o
  # percurso das lições, o tempo total passava os 10 minutos do limite e o GitHub cancelava a execução.
  ideias:
    runs-on: ubuntu-latest
    # 05/11/2026: o teste de navegador do «Ideias» voltou a ter as verificações que o #106 tirou; a preparação do
    # navegador chega a levar 10 minutos num executor lento.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      # 30/10/2026: as páginas de «Ideias» em cinco larguras, claro e escuro, e na projeção; as duas lições a 320 e 1440 px.
      - name: Coração do Laboratório no navegador
        run: node tests/browser_ideias.cjs

      # 02/11/2026: decisão 141. As duas entradas públicas, três larguras e três modos.
      - name: Entradas públicas de Ideias
        run: node tests/browser_ideias_publico.cjs
        env:
          IDEIAS_PROVAS: provas-ideias-publico
      - uses: actions/upload-artifact@v4
        with:
          name: ideias-publico-provas
          path: provas-ideias-publico

  # 02/11/2026: motores incorporados em separado para não consumir o tempo das lições completas.
  laboratorio-antigo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Pontos e progresso nos dois motores incorporados
        run: |
          node tests/browser_laboratorio_sem_pontos.cjs
          node tests/browser_laboratorio_contratos.cjs
