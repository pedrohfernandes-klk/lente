name: Justiça, bases e regressão
on:
  pull_request:
    paths:
      - 'tools/justica/**'
      - 'olhar-e-decidir/justica/**'
      - 'assets/resultados-turma.js'
      - 'tests/*justica*'
      - 'tests/resultados_turma.test.cjs'
      - '.github/workflows/justica-qa.yml'
permissions:
  contents: read
jobs:
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        # 02/11/2026: a bateria integral compara com origin/main e com commits históricos.
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regeneração e todos os testes Python
        run: |
          python tools/justica/build.py --verificar
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/resultados_turma.test.cjs
      - name: Preparar navegador
        run: |
          # 05/11/2026: playwright fixado em 1.64.1; a 1.65.0 saiu no npm sem o playwright-core 1.65.0 (ETARGET).
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Telemóvel, projeção e progresso antigo
        run: node tests/browser_justica.cjs
