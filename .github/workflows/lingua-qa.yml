name: Lente — língua das perguntas
on:
  pull_request:
permissions:
  contents: read
jobs:
  lingua:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Perguntas em português europeu
        run: python -m unittest discover -s tests -p 'test_lingua_perguntas.py' -v
