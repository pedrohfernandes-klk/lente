<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Olhar e registar · Como se investiga</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

.casca-video{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.casca-video .cx{background:#111;color:#f2f0ea;width:100%;max-width:420px;max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:8px;padding:12px;box-sizing:border-box}.casca-video .tt{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 .8rem Arial;letter-spacing:.1em;text-transform:uppercase;color:#d9a520}.casca-video video{width:100%;max-height:72vh;max-height:72dvh;background:#000;display:block}.casca-video .rodape-como{display:flex;justify-content:space-between;align-items:center;gap:10px}.casca-video button,.casca-video a{display:inline-flex;align-items:center;font:700 1rem Arial;color:#f2f0ea;background:none;border:0;min-height:44px;padding:0 4px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

QI8+y/StgbYjhzBRuyCm0p6WxbcWriLEHHokpZxQCoRT+SQn0XqmOYBwo6qPS230TIo5h4X1wQx141mTbhOwAo1TS/FCCobsUTLQC98jRBuIAizM4A3VREQiVPLhhm0AMhmaHGnbbZmKVlPvAjjC61hmg0qF7lbew9dud4w4AgfJym9P4Aw6MOAIyxkMJoaq5K28PWBtyPgNCpjsHh+UQX2yaIpxHHucUeCqx4EOJ9WbcEKByDbw+5IOPlXi/RNak3TKBjCs+mr1lhFwTjxABxgKqCOlaLXbmIWs+v3li72R/4ABw48UjEd9jIiWwkXyeEyw9Yfg9pm8hLsijAC9DDyg1S4ueSe0M6R8kSNSBFgBOx+TjNTjy7drnlo7Zn3whlyZupTmeR9rrhIPDVC5nF/duZm+2PC3mU0tfQM0/m1swgBlsAZpij83hlIgPY+we7X3oiu/x8G8ACYZgUoc5o5qQyZnakII4AcLLn+IWduvWjc71CuAA\" alt=\"Desenho a pena e tinta: um vale visto do alto, com um rio, colinas, um castelo sobre uma rocha à esquerda e uma planície ao fundo; traços rápidos e paralelos.\" loading=\"lazy\"><figcaption>Leonardo da Vinci, Paisagem do vale do Arno, desenho a pena, datado de 5 de agosto de 1473. Uffizi, Florença. Leonardo da Vinci, 1473. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Paisagem_do_Arno_-_Leonardo_da_Vinci.jpg\">Wikimedia Commons</a>), consulta de 16/10/2026.</figcaption></figure><p>A 5 de agosto de 1473, Leonardo da Vinci, com vinte e um anos, desenhou o vale do Arno e escreveu a data no canto: é o primeiro desenho datado que dele se conhece. Nos cadernos que encheu durante quarenta anos, o desenho vem sempre antes da explicação: a asa do pássaro, a água à volta de uma pedra, o músculo do braço. A nota na margem pergunta; o desenho responde.</p>"},{"t":"ler","rot":"Ler mais","titulo":"Galileu: a Lua com sombras","html":"<p>No inverno de 1609 para 1610, Galileu apontou a luneta à Lua e desenhou o que viu, com aguada clara e escura. As sombras tinham limites irregulares e mudavam de noite para noite: só montanhas e vales fazem sombras assim. Em março de 1610 publicou os desenhos em Veneza, no Sidereus Nuncius. Primeiro o registo; a conclusão veio da sombra.</p>"},{"t":"ler","rot":"Ler mais","titulo":"O diário em duas colunas","html":"<p>À esquerda, o que vês: formas, medidas, cores, o que falta. À direita, o que pensas que é: a função, a causa, a dúvida. A linha ao meio é a regra: nada passa da direita para a esquerda sem ser visto.</p>"},{"t":"escolha","rot":"Observação ou explicação?","p":"Qual destas frases pertence à coluna da esquerda, a do que se vê?","o":["A sombra na Lua tem um limite irregular e muda de uma noite para a outra","A Lua é imperfeita porque tem montanhas","A Lua é como a Terra","Os antigos estavam enganados"],"c":0,"f":"Limite irregular, muda de noite para noite: é o que se vê e se mede. As outras três já explicam, e podem estar certas, mas vêm depois.","g":0},{"t":"ordenar","rot":"A ordem do registo","p":"Põe por ordem o que Galileu fez.","passos":["Olhar várias noites seguidas","Desenhar as sombras tal como estavam","Comparar os desenhos entre si","Anotar a dúvida: porque mudam as sombras?","Só então explicar: montanhas e vales"],"f":"Ver, registar, comparar, duvidar, explicar. A explicação é o último passo, não o primeiro.","g":1},{"t":"ler","rot":"Lê devagar","titulo":"The Pencil of Nature: Introductory Remarks e a estampa VI","html":"<p class=\"abre\">Lê Talbot a apresentar, em 1844, o primeiro livro com imagens feitas só pela luz: um registo sem a mão de quem desenha.</p><p class=\"etq-m\">No original, em inglês</p><div class=\"ap-texto\" lang=\"en\"><p>The little work now presented to the Public is the first attempt to publish a series of plates or pictures wholly executed by the new art of Photogenic Drawing, without any aid whatever from the artist’s pencil.</p><p>The term “Photography” is now so well known, that an explanation of it is perhaps superfluous; yet, as some persons may still be unacquainted with the art, even by name, its discovery being still of very recent date, a few words may be looked for of general explanation.</p><p>It may suffice, then, to say, that the plates of this work have been obtained by the mere action of Light upon sensitive paper.  They have been formed or depicted by optical and chemical means alone, and without the aid of any one acquainted with the art of drawing.  It is needless, therefore, to say that they differ in all respects, and as widely us possible, in their origin, from plates of the ordinary kind, which owe their existence to the united skill of the Artist and the Engraver.</p></div><p class=\"ap-fonte\">Continua no cartão seguinte.</p>"},{"t":"ler","rot":"Lê mais","titulo":"The Pencil of Nature: Introductory Remarks e a estampa VI (2)","html":"<div class=\"ap-texto\" lang=\"en\"><p>They are impressed by Nature’s hand; and what they want as yet of delicacy and finish of execution arises chiefly from our want of sufficient knowledge of her laws.  When we have learnt more, by experience, respecting the formation of such pictures, they will doubtless be brought much nearer to perfection; and though we may not be able to conjecture with any certainty what rank they may hereafter attain to as pictorial productions, they will surely find their own sphere of utility, both for completeness of detail and correctness of perspective.</p><p>The Author of the present work having been so fortunate as to discover, about ten years ago, the principles and practice of Photogenic Drawing, is desirous that the first specimen of an Art, likely in all probability to be much employed in future, should be published in the country where it was first discovered.  And he makes no doubt that his countrymen will deem such an intention sufficiently laudable to induce them to excuse the imperfections necessarily incident to a first attempt to exhibit an Art of so great singularity, which employs processes entirely new, and having no analogy to any thing in use before.  That such imperfections will occur in a first essay, must indeed be expected.  At present the Art can hardly be said to have advanced beyond its infancy—at any rate, it is yet in a very early stage—and its practice is often impeded by doubts and difficulties, which, with increasing knowledge, will diminish and disappear.</p></div><p class=\"etq-m\">O que o texto diz, em português</p><div class=\"ap-relato\"><p>Talbot começa por dizer que o pequeno livro é a primeira tentativa de publicar uma série de estampas feitas inteiramente pela nova arte do «desenho fotogénico», sem ajuda nenhuma do lápis do artista. Como a palavra «fotografia» ainda é recente, explica-a em poucas palavras: as estampas obtiveram-se pela simples ação da luz sobre papel sensível, por meios óticos e químicos, sem ninguém que soubesse desenhar.</p><p>Por isso, diz, diferem em tudo das estampas comuns, que devem a existência ao artista e ao gravador juntos. Estas são «impressas pela mão da Natureza»; o que lhes falta de delicadeza e acabamento vem de ainda se saber pouco das leis dela. Quando se souber mais, pela experiência, hão de aproximar-se da perfeição; e, mesmo sem se poder adivinhar o lugar que terão como arte, hão de ter o seu lugar útil pela completude do pormenor e pela correção da perspetiva.</p><p>Talbot conta que descobriu os princípios do processo há cerca de dez anos e quer que a primeira amostra desta arte se publique no país onde foi descoberta. Pede desculpa pelas imperfeições de uma primeira tentativa: a arte ainda está na infância, cheia de dúvidas e dificuldades que, com mais conhecimento, hão de diminuir e desaparecer.</p></div><p class=\"ap-fonte\">Henry Fox Talbot, <i>The Pencil of Nature: Introductory Remarks e a estampa VI</i>. Project Gutenberg n.º 33447. <a href=\"https://pedrohfernandes-klk.github.io/lente/biblioteca/talbot-introducao/\">O texto inteiro está na Biblioteca</a>.</p>"},{"t":"escolha","rot":"Relê","p":"Segundo Talbot, a que se deve o que ainda falta às estampas em delicadeza e acabamento?","o":["À má qualidade do papel","À falta de um gravador que as retocasse","A saber-se ainda pouco das leis da Natureza","À pressa com que o livro foi publicado"],"c":2,"f":"Relê a frase que começa por «They are impressed by Nature's hand»: a falta vem «chiefly from our want of sufficient knowledge of her laws». Talbot recusa justamente o retoque do artista e do gravador: a imperfeição é do registo, não da mão.","g":"ap-0"},{"t":"escolha","rot":"Relê ainda","p":"Que duas qualidades diz Talbot que as imagens feitas pela luz hão de ter com certeza, mesmo sem se saber o lugar que terão como arte?","o":["Completude do pormenor e correção da perspetiva","Cor fiel e tamanho natural","Rapidez de execução e baixo preço","Beleza e originalidade"],"c":0,"f":"Relê o fim do quarto parágrafo: «completeness of detail and correctness of perspective». É a promessa do registo: tudo o que lá estava, no sítio certo. O valor como arte fica em aberto, de propósito.","g":"ap-1"},{"t":"ler","rot":"Um caso","titulo":"Dez segundos ou vinte minutos","html":"<div class=\"ap-caso\"><p>Imagina que tens de registar uma fachada para um trabalho. Podes fotografá-la em dez segundos ou desenhá-la em vinte minutos. A fotografia tem o pormenor completo e a perspetiva certa, como Talbot promete; mas quando chegas a casa não sabes dizer quantas janelas tem, porque não olhaste. O desenho está torto, mas contaste as janelas, viste que a porta não está ao meio e que uma varanda é diferente das outras.</p><p>Os dois são registos. Um guarda tudo e não te obriga a ver; o outro guarda menos e obriga-te a ver tudo.</p></div><p class=\"insight\">No cartão seguinte decides tu.</p>"},{"t":"escolha","rot":"Decide","p":"O que levas para a coluna da esquerda do teu diário, a do que se vê?","o":["Só a fotografia, porque o desenho está torto e pode enganar","Só o desenho, porque a fotografia não é um registo teu","O desenho e as contagens que fizeste enquanto desenhavas, e a fotografia para conferir"],"c":2,"f":"O desenho fez-te olhar e contar: é o registo do olhar. A fotografia, como diz Talbot, guarda o pormenor completo: serve para conferir o que o desenho simplificou. Deitar fora qualquer um deles é perder metade do que viste.","g":"ap-caso"},{"t":"ler","rot":"O que aprendeste","titulo":"Antes de fechares","html":"<div class=\"ap-fecho\"><p>Leste Talbot a apresentar o primeiro livro de imagens feitas só pela luz, sem o lápis do artista, e a prometer-lhes o pormenor completo e a perspetiva certa. Aprendeste que há duas maneiras de registar: a que guarda tudo sem te obrigar a ver, e a que, como os desenhos de Leonardo e de Galileu, te obriga a ver devagar. Sabes agora encher a coluna da esquerda com as duas, e guardar a explicação para a direita.</p></div>"},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Ver antes de explicar: a coluna da esquerda enche-se primeiro.</p><div class=\"caderno\"><b>No caderno</b>Uma página em duas colunas. Durante cinco minutos desenha um objeto da sala, sem levantar os olhos mais do que o necessário. À direita, duas hipóteses sobre a função de uma parte dele.</div>"}],chave:"epi-investigar-passo-02",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/lente/investigar/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/lente/investigar/passo-03/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Leste</p><p>Ver antes de explicar: a coluna da esquerda enche-se primeiro.</p><p class=\"sub\">Passo seguinte: <a href=\"https://pedrohfernandes-klk.github.io/lente/investigar/passo-03/\">As fontes</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-02"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
