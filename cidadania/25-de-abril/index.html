/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}

.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Cidadania",titulo:"O 25 de Abril de 1974",itens:[{"t": "ler", "rot": "Abre", "titulo": "Que data funda uma democracia?", "html": "<p class=\"vz-gancho\">Às 22h55 de 24 de abril de 1974, uma canção na rádio mandou os quartéis preparar a saída. No dia seguinte, uma lei destituía o Presidente e o Governo.<\/p><p class=\"vz-perg\">Ouve os documentos. Distingue o que aconteceu de quem lhe dá sentido.<\/p><details class=\"lado\"><summary>O programa e as eleições<\/summary><div class=\"lado-c\"><p>O Programa do MFA reconhecia que «a solução das guerras no ultramar é política e não militar» e prometia uma Assembleia Constituinte eleita em doze meses: as eleições fizeram-se a 25 de abril de 1975, com 91% de votantes (Centro de Documentação 25 de Abril). A própria operação usou a rádio como sistema de sinais, com duas canções como senhas.<\/p><\/div><\/details><details class=\"lado\"><summary>Questões em debate<\/summary><div class=\"lado-c\"><p>A Comissão Comemorativa dos 50 anos chama ao 25 de Novembro de 1975 «um dos momentos mais decisivos e controversos do processo revolucionário português». A descolonização também se discute: estima-se que no verão e no outono de 1975 tenham chegado a Portugal cerca de meio milhão de pessoas, os chamados «retornados» (Comissão 50 anos).<\/p><\/div><\/details><details class=\"mais\"><summary>Ver o documento de 25 de abril de 1974<\/summary><div class=\"mais-c\"><figure class=\"vz-fig largo\"><img src=\"../../img/narrativas/vz-25-de-abril-diario-governo-25abril1974-p1-topo.webp\" alt=\"Metade de cima da primeira página de um jornal oficial, a preto sobre branco. No topo, «Quinta-feira 25 de Abril de 1974» e «I Série, Número 97» e, em letras grossas, «DIÁRIO DO GOVERNO», com um brasão à esquerda. Ao centro, em letras grandes, «SUPLEMENTO». Em baixo, os títulos «Sumário» e «Junta de Salvação Nacional», com o início da Lei n.º 1/74, de 25 de Abril.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 0%\"><figcaption>Suplemento do <i>Diário do Governo<\/i>, 25 de abril de 1974. Imprensa Nacional-Casa da Moeda. <a href=\"https://commons.wikimedia.org/wiki/File:Supplement_to_the_Diary_of_the_Government_(Portugal)_of_April_25,_1974.pdf\" target=\"_blank\" rel=\"noopener\">Domínio público<\/a><\/figcaption><\/figure><\/div><\/details>"}, {"t": "ler", "rot": "Lisboa, 25 de abril de 1974", "titulo": "Vinte e quatro horas e duas canções", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-25-de-abril-anefo-praca-comercio-1975.webp\" alt=\"Fotografia a preto e branco de uma praça grande, quase sem pessoas: ao centro, a estátua de um rei a cavalo sobre um pedestal alto; à volta, edifícios com arcadas; carros da época estacionados e um candeeiro em primeiro plano; ao fundo, o castelo numa colina.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 60%\"><figcaption>O Terreiro do Paço, Lisboa, fevereiro de 1975. Rob Mieremet, Anefo. <a href=\"https://commons.wikimedia.org/wiki/File:Portugal,_politiek,_straatbeelden_etc_straatbeelden_in_Lissabon_Pra%C3%A7a_do_Come,_Bestanddeelnr_927-7466.jpg\" target=\"_blank\" rel=\"noopener\">CC0<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Segue a cadeia: que sinais passam na rádio antes de a coluna chegar aqui?<\/p><p>Às 22h55, «E depois do Adeus» passou na rádio: ordem de preparar a saída. Pouco depois da meia-noite, «Grândola, Vila Morena» confirmou as operações. Às 4h20, o MFA falou ao país. Cerca das 6h, a coluna de Santarém ocupou esta praça. Ao fim da tarde, Caetano saiu do Carmo numa chaimite.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A 22 de abril de 1974, Otelo Saraiva de Carvalho combinou com João Paulo Diniz, locutor dos Emissores Associados de Lisboa, a primeira senha: «E depois do Adeus», de Paulo de Carvalho, marcada para as 23h55 e antecipada sessenta minutos. Às 22h55 de 24 de abril, o locutor anunciou: «Faltam cinco minutos para as vinte e três horas. Convosco Paulo de Carvalho com o Eurofestival 74: E depois do Adeus» (transcrição do Centro de Documentação 25 de Abril).<\/p><p>Para a segunda senha, o MFA propôs «Venham mais cinco», de José Afonso, mas o jornalista Carlos Albino sabia que a canção estava censurada internamente na Rádio Renascença e sugeriu alternativas. Ficou «Grândola, Vila Morena», que passou no programa «Limite» com a voz gravada do locutor Leite de Vasconcelos a ler a primeira quadra. A hora exata não é a mesma em todas as fontes: o Centro de Documentação 25 de Abril regista a hora combinada, entre as 0h20 e as 0h22; a Renascença escreveu em 2024 «aos 25 minutos».<\/p><p>Às 4h20, o Rádio Clube Português transmitiu, pela voz de Joaquim Furtado, o primeiro comunicado do MFA: pedia calma à população e chamava os médicos aos hospitais. Por volta das 6h, a coluna da Escola Prática de Cavalaria de Santarém, comandada pelo capitão Fernando Salgueiro Maia, ocupou o Terreiro do Paço. Na Ribeira das Naus e na Rua do Arsenal, as tropas fiéis ao regime não obedeceram às ordens de abrir fogo, e a maioria passou para o lado do MFA.<\/p><p>No Largo do Carmo, Salgueiro Maia cercou o quartel da GNR onde Marcelo Caetano se refugiara. Ao início da tarde viam-se cravos vermelhos nos canos das espingardas, oferecidos por populares. Celeste Caeiro contou que deu um cravo a um soldado que lhe pedira um cigarro: «Se quiser tome, um cravo oferece-se a qualquer pessoa» (<i>Observador<\/i>, 2024). Por volta das 18h, Spínola entrou no quartel; mais tarde, Caetano saiu numa chaimite, a caminho da Pontinha, onde estava o posto de comando do MFA.<\/p><p>À noite, na Rua António Maria Cardoso, atiradores da DGS dispararam sobre manifestantes: houve quatro mortos. Um agente da DGS foi também morto. Os presos políticos saíram de Caxias a 26 de abril e de Peniche a 27.<\/p><p>Para ouvir, no Centro de Documentação 25 de Abril, da Universidade de Coimbra: <a href=\"https://www.cd25a.uc.pt/storage/media/Sons/S10638.mp3\" target=\"_blank\" rel=\"noopener\">a senha «Grândola»<\/a>, <a href=\"https://www.cd25a.uc.pt/storage/media/Sons/S10639.mp3\" target=\"_blank\" rel=\"noopener\">o primeiro comunicado do MFA<\/a> e <a href=\"https://www.cd25a.uc.pt/storage/media/Sons/S10662.mp3\" target=\"_blank\" rel=\"noopener\">o ultimato de Salgueiro Maia à GNR<\/a>.<\/p><p>A fotografia é de fevereiro de 1975, dez meses depois, e não do próprio dia.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "O que diz uma senha", "p": "Para quem ouvia em casa, «E depois do Adeus» era só uma canção. Para os quartéis, era o quê?", "o": ["Uma ordem já combinada: preparar a saída.", "Um apelo à população: sair para a rua.", "Uma notícia: a coluna já ocupou a praça.", "Um anúncio: terminou a censura no país."], "c": 0, "f": "Era uma senha: um sinal combinado antes, que só entendia quem conhecia o código. Às 22h55, «E depois do Adeus» mandava preparar a saída; pouco depois da meia-noite, a «Grândola» confirmava as operações.", "fe": ["", "A população não foi chamada à rua: o comunicado do MFA das 4h20 até pedia calma. A canção falava a quem conhecia a senha.", "A coluna só ocupou o Terreiro do Paço cerca das 6h. A canção passou na véspera, às 22h55: vinha antes, para mandar preparar a saída.", "A censura só foi abolida em junho de 1974. Naquela noite, a canção era um sinal para os quartéis, não um anúncio ao público."]}, {"t": "ler", "rot": "Conceito", "titulo": "Golpe ou revolução?", "html": "<div class=\"cc\" data-cc><div class=\"cc-passo cc-caso\"><p class=\"cc-r\">O caso<\/p><p>Às 4h20, o MFA pediu calma à população. À tarde, viam-se nas espingardas cravos oferecidos por populares.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">Mais perto<\/p><p>O golpe era militar, mas as ruas encheram-se: aí, diz a Comissão 50 anos, <mark>«se transforma em revolução»<\/mark>.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O nome<\/p><p class=\"cc-termo\">Revolução<\/p><p class=\"cc-def\">Mudança profunda de regime em que a população entra em cena.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O que não é<\/p><p>Não é um golpe de Estado: aí, um grupo toma o poder pela força, e o resto pode ficar igual.<\/p><\/div><button type=\"button\" class=\"cc-mais\" data-cc-mais>Mais perto <span aria-hidden=\"true\">→<\/span><\/button><\/div><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A Comissão Comemorativa dos 50 anos chama ao 25 de Abril um «Golpe de Estado do Movimento das Forças Armadas» que «se transforma em revolução» quando as ruas se enchem. O primeiro comunicado do MFA, às 4h20, pedia calma e chamava os médicos aos hospitais; no 1.º de Maio, juntaram-se em Lisboa entre 500 000 e 600 000 pessoas (Centro de Documentação 25 de Abril).<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Golpe ou revolução, num caso novo", "p": "Num país imaginário, oficiais ocupam a rádio e o palácio, e as ruas ficam vazias. O que é?", "o": ["Um golpe: ainda não há mudança profunda.", "Uma revolução: basta mudar o governante.", "Uma revolução: basta a ação dos militares.", "Uma revolução: basta controlar uma rádio."], "c": 0, "f": "Ocupar a rádio e o palácio é o gesto de um golpe. Sem a população em cena, nada mostra ainda uma mudança profunda do regime: por enquanto, é um golpe de Estado.", "fe": ["", "Mudar quem manda é o que faz um golpe. Para a Comissão, a revolução vem quando as ruas se enchem, e aqui ficaram vazias.", "Militares na rua mostram um golpe, não uma revolução. O 25 de Abril tornou-se revolução quando a população entrou em cena.", "O MFA também ocupou uma rádio e falou ao país às 4h20, e isso ainda era o golpe. A revolução veio quando as ruas se encheram; aqui ficaram vazias."]}, {"t": "vf", "rot": "O que não é", "p": "Uma revolução tem de começar na rua, sem militares.", "v": false, "f": "Falso. O 25 de Abril começou como golpe militar e tornou-se revolução quando a população entrou em cena. O que conta é a mudança profunda e quem participa nela, não quem deu o primeiro passo.", "fe": "Parece lógico, porque se imagina a revolução como uma multidão. Mas a Comissão 50 anos descreve um golpe militar que «se transforma em revolução»."}, {"t": "ler", "rot": "Seis datas", "titulo": "De 1926 a 2022, em seis datas", "html": "<figure class=\"desenho lt\"><svg viewBox=\"0 0 342 168\" role=\"img\" aria-label=\"Linha do tempo\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M14 84H328\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"14.0\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M14.0 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"14.0\" y=\"62\" text-anchor=\"start\" class=\"lt-ano\">1926<\/text><circle cx=\"76.8\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M76.8 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"76.8\" y=\"114\" text-anchor=\"middle\" class=\"lt-ano\">1933<\/text><circle cx=\"139.6\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M139.6 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"139.6\" y=\"62\" text-anchor=\"middle\" class=\"lt-ano\">1961<\/text><circle cx=\"202.4\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M202.4 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"202.4\" y=\"114\" text-anchor=\"middle\" class=\"lt-ano\">1974<\/text><circle cx=\"265.2\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M265.2 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"265.2\" y=\"62\" text-anchor=\"middle\" class=\"lt-ano\">1976<\/text><circle cx=\"328.0\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M328.0 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"328.0\" y=\"114\" text-anchor=\"end\" class=\"lt-ano\">2022<\/text><\/svg><\/figure><ol class=\"lt-lista\"><li><b>1926<\/b> golpe militar de 28 de maio: começa a ditadura<\/li><li><b>1933<\/b> a Constituição de 1933 institucionaliza o Estado Novo<\/li><li><b>1961<\/b> começa a guerra colonial, em Angola<\/li><li><b>1974<\/b> 25 de abril: o MFA derruba a ditadura<\/li><li><b>1976<\/b> é aprovada a Constituição da República<\/li><li><b>2022<\/b> a democracia já durou mais do que a ditadura<\/li><\/ol>", "linha": true}, {"t": "ler", "rot": "Belém, 10 de junho de 1974", "titulo": "Quarenta e oito retângulos", "html": "<p class=\"ex-antes\"><b>Antes de ler.<\/b> Conta os retângulos do desenho, um por artista. Depois procura o que esse número queria dizer em 1974.<\/p><figure class='desenho'><svg viewBox='0 0 342 104' role='img' aria-label='Desenho: uma grelha de 48 retângulos, em quatro filas de doze' xmlns='http://www.w3.org/2000/svg'><path d='M10 4h24v17h-24zM37 4h24v17h-24zM64 4h24v17h-24zM91 4h24v17h-24zM118 4h24v17h-24zM145 4h24v17h-24zM172 4h24v17h-24zM199 4h24v17h-24zM226 4h24v17h-24zM253 4h24v17h-24zM280 4h24v17h-24zM307 4h24v17h-24zM10 25h24v17h-24zM37 25h24v17h-24zM64 25h24v17h-24zM91 25h24v17h-24zM118 25h24v17h-24zM145 25h24v17h-24zM172 25h24v17h-24zM199 25h24v17h-24zM226 25h24v17h-24zM253 25h24v17h-24zM280 25h24v17h-24zM307 25h24v17h-24zM10 46h24v17h-24zM37 46h24v17h-24zM64 46h24v17h-24zM91 46h24v17h-24zM118 46h24v17h-24zM145 46h24v17h-24zM172 46h24v17h-24zM199 46h24v17h-24zM226 46h24v17h-24zM253 46h24v17h-24zM280 46h24v17h-24zM307 46h24v17h-24zM10 67h24v17h-24zM37 67h24v17h-24zM64 67h24v17h-24zM91 67h24v17h-24zM118 67h24v17h-24zM145 67h24v17h-24zM172 67h24v17h-24zM199 67h24v17h-24zM226 67h24v17h-24zM253 67h24v17h-24zM280 67h24v17h-24zM307 67h24v17h-24z' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><text x='171' y='100' text-anchor='middle' font-size='13' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>um retângulo, um artista<\/text><\/svg><\/figure><p>A 10 de junho de 1974, 48 artistas pintaram em Belém um mural coletivo, um retângulo cada um. O catálogo da época explica o número: 48 artistas, símbolo de 48 anos de «fascismo», palavra do próprio catálogo. Em 1981, o mural ardeu; em 2022, 47 artistas recriaram-no no maat.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A 28 de maio de 1974, o Movimento Democrático de Artistas Plásticos cobriu com pano preto as estátuas de Salazar e de António Ferro no Palácio Foz, em Lisboa; o lema «A arte fascista faz mal à vista» é atribuído ao pintor Marcelino Vespeira. A 10 de junho, depois de um desfile de apoio ao MFA, o mesmo movimento pintou o mural na Galeria de Arte Moderna, no Mercado da Primavera, em Belém. Nas fotografias da época veem-se alguns dos 48 retângulos: Jorge Vieira juntou um cravo e «Viva o 25 de Abril»; Querubim Lapa escreveu «Sou a Liberdade que renasceu das cinzas»; Alice Jorge, «Fim da Guerra Colonial» (Filipa Lowndes Vicente, maat). Em 1981, a galeria e o mural arderam. A 10 de junho de 2022, 47 artistas recriaram o painel nos jardins do maat, numa ideia de João Pinharanda; Emília Nadal, que pintara em 1974, voltou a pintar.<\/p><p>As duas senhas eram canções de antes do golpe. «Grândola, Vila Morena» foi gravada em outubro de 1971 no Strawberry Studio, em Hérouville, a cerca de 30 km de Paris, para o álbum <i>Cantigas do Maio<\/i>, com produção de José Mário Branco; segundo Francisco Fanhais, que participou, os passos foram gravados às 3 da manhã, sobre gravilha. «E depois do Adeus», com letra de José Niza e música de José Calvário, ganhou o Festival da Canção a 7 de março de 1974 e seguiu para a Eurovisão, em Brighton.<\/p><p>Em maio de 1974, já sem censura, os cinemas estrearam filmes antes proibidos, como <i>O Couraçado Potemkine<\/i>, de Eisenstein, e <i>O Ditador<\/i>, de Chaplin. Sophia de Mello Breyner Andresen contou que sugeriu a frase «A poesia está na rua» numa reunião da Associação de Escritores, antes do desfile do 1.º de Maio (exposição da Biblioteca Nacional).<\/p><p>Para quem fotografa: entre o 25 de Abril e o 25 de Novembro de 1975, fotógrafos estrangeiros fotografaram o país quase todos os dias. A exposição <i>Venham Mais Cinco<\/i>, com curadoria de Sérgio Tréfaut, mostra 200 imagens de 30 fotógrafos; uma fotografia de Henri Bureau da detenção de agentes da PIDE ganhou o World Press Photo de 1974 (Comissão 50 anos).<\/p><p>O desenho é nosso: mostra o número de retângulos, não a disposição do mural, que só conhecemos por fotografias.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Ler um símbolo", "p": "Porque foram 48 os artistas do mural?", "o": ["Um por cada ano da ditadura, como explica o catálogo.", "Um por cada espaço disponível no painel da galeria.", "Um por cada sócio do movimento de artistas plásticos.", "Um por cada dia entre o 25 de Abril e o dia do mural."], "c": 0, "f": "O catálogo de diapositivos da época explica: 48 artistas, símbolo de 48 anos de «fascismo», palavra do próprio catálogo. De 28 de maio de 1926 a 25 de abril de 1974 vão quase 48 anos: o número é a própria mensagem.", "fe": ["", "O número não vem do tamanho do painel. O catálogo diz que 48 artistas eram o símbolo de 48 anos.", "O texto não diz quantos sócios tinha o movimento. O catálogo dá outra razão: os 48 anos da ditadura.", "Do 25 de Abril ao 10 de junho vão 46 dias, não 48. E o catálogo diz o que o número quer dizer: os anos da ditadura."]}, {"t": "vf", "rot": "Original ou recriação", "p": "O painel pintado em 2022 nos jardins do maat é o mural de 1974, restaurado.", "v": false, "f": "Falso. O mural de 1974 ardeu em 1981, com a galeria. Em 2022, 47 artistas pintaram uma recriação. Do original ficam as fotografias e o catálogo de diapositivos da época.", "fe": "Engana porque uma pintora de 1974, Emília Nadal, voltou a pintar em 2022. Mas restaurar é tratar a obra original, e essa ardeu em 1981."}, {"t": "ler", "rot": "Lisboa, 25 de junho de 1974", "titulo": "Só existe o que se sabe", "html": "<p class=\"ex-antes\"><b>Antes de ler.<\/b> Procura o lema: o que acontecia a um facto que o público não sabia?<\/p><p>A censura vinha de 1926, com um lema: «politicamente só existe o que o público sabe que existe». Foi abolida a 25 de junho de 1974.<\/p><div class=\"ju-video\" data-yt=\"KJJG962x5As\" data-titulo=\"Excertos rádio (LGP), Museu do Aljube Resistência e Liberdade\" data-t=\"Excertos rádio (LGP)\" data-m=\"Museu do Aljube Resistência e Liberdade\" data-dur=\"3 min 21 s\"><p class=\"ju-t\">Excertos rádio (LGP)<\/p><p class=\"ju-m\">Museu do Aljube Resistência e Liberdade<\/p><button type=\"button\">Ver o vídeo <span>(3 min 21 s)<\/span><\/button><\/div><p class=\"ju-yt\"><a href=\"https://www.youtube.com/watch?v=KJJG962x5As\" target=\"_blank\" rel=\"noopener\">Ver no YouTube<\/a><\/p><p class=\"ex-depois\"><b>Depois de ver.<\/b> Se só existe o que se sabe, que poder tinha quem falava na rádio?<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A censura foi criada pela Ditadura Militar, pelos decretos n.º 11 838 e n.º 12 008, de julho e agosto de 1926, e o Estado Novo manteve-a depois da Constituição de 1933 (Comissão 50 anos). A polícia política teve três nomes: PVDE, PIDE e, desde 1969, Direção-Geral de Segurança; a sua atividade intensificou-se com a guerra. O edifício do Aljube, em Lisboa, foi prisão política de 1928 a 1965; o museu que ali funciona desde 2015 fala de interrogatórios violentos, tortura e isolamento nas celas mínimas, os «curros».<\/p><p>No próprio dia 25, o suplemento do <i>Diário do Governo<\/i> publicou a Lei n.º 1/74, que destituiu o Presidente da República, Américo Tomás, e o Governo de Marcelo Caetano e passou os poderes para a Junta de Salvação Nacional, presidida por António de Spínola; o Decreto-Lei n.º 171/74 extinguiu a DGS, a Legião Portuguesa e a Mocidade Portuguesa. Na manhã de 26, Vítor Alves leu aos jornalistas o Programa do MFA, que previa como medidas imediatas «A abolição da censura e exame prévio», a amnistia dos presos políticos e uma Assembleia Constituinte eleita no prazo de doze meses. A Comissão 50 anos resume-o em três palavras: Descolonização, Democratização e Desenvolvimento.<\/p><p>A 1 de maio, a manifestação em Lisboa juntou entre 500 000 e 600 000 pessoas, segundo o Centro de Documentação 25 de Abril. A 12 de junho, o Decreto-Lei n.º 251/74 abriu a carreira judiciária às mulheres; a 25 de junho, o Decreto-Lei n.º 281/74 aboliu a censura, manteve alguns delitos de imprensa e criou a Comissão Ad Hoc para a comunicação social; em julho, Maria de Lourdes Pintasilgo foi a primeira mulher ministra em Portugal.<\/p><p>O vídeo, «Excertos rádio», é do canal oficial do Museu do Aljube Resistência e Liberdade, em versão com Língua Gestual Portuguesa (LGP). Segundo a descrição do próprio museu no YouTube, junta excertos de notas oficiosas do Governo e sons de outras rádios.<\/p><\/div><\/details><p class=\"fonte\"><a href=\"https://cd25a.uc.pt/pt/page/768\">Centro de Documentação 25 de Abril: Decreto-Lei n.º 171/74<\/a>. Identifica a criação da DGS em 24 de novembro de 1969.<\/p>"}, {"t": "escolha", "rot": "O efeito do lema", "p": "Com este lema, o que fazia a censura a uma notícia incómoda para o regime?", "o": ["Cortava a notícia incómoda antes de chegar ao público.", "Levava o jornal a tribunal depois de ela ser publicada.", "Publicava a notícia junto de um desmentido do Governo.", "Atrasava a notícia até deixar de interessar ao público."], "c": 0, "f": "O lema diz que, politicamente, «só existe o que o público sabe que existe». Por isso a censura cortava antes de publicar: o que não chegava ao público era, para ele, como se não tivesse acontecido.", "fe": ["", "Isso é responder depois de publicar. A censura agia antes: a notícia nem chegava a sair.", "O lema não fala de duas versões. Se o público não sabe, o facto, para ele, não existe: a notícia era cortada.", "O lema não fala de atrasar. O que o público não sabe não existe, para ele: a notícia cortada não saía mais tarde."]}, {"t": "ler", "rot": "Conceito", "titulo": "Cortar antes ou responder depois?", "html": "<div class=\"cc\" data-cc><div class=\"cc-passo cc-caso\"><p class=\"cc-r\">O caso<\/p><p>Para a segunda senha, o MFA propôs «Venham mais cinco». Na Rádio Renascença, a canção estava censurada internamente.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">Mais perto<\/p><p>Ficou outra canção: aquela <mark>nem chegava ao ar<\/mark>, porque era cortada antes de alguém a ouvir.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O nome<\/p><p class=\"cc-termo\">Censura prévia<\/p><p class=\"cc-def\">Controlo do que se publica ou transmite, feito antes de chegar ao público.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O que não é<\/p><p>Não é responder depois: sem censura, publica-se e, se houver delito de imprensa, responde-se perante a lei.<\/p><\/div><button type=\"button\" class=\"cc-mais\" data-cc-mais>Mais perto <span aria-hidden=\"true\">→<\/span><\/button><\/div><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>O jornalista Carlos Albino sabia que «Venham mais cinco» estava censurada internamente na Rádio Renascença e sugeriu alternativas; ficou «Grândola, Vila Morena», escolhida a 24 de abril (Centro de Documentação 25 de Abril). O Programa do MFA prometia «A abolição da censura e exame prévio». Quando a censura foi abolida, a 25 de junho de 1974, o Decreto-Lei n.º 281/74 manteve alguns delitos de imprensa e criou a Comissão Ad Hoc para a comunicação social.<\/p><\/div><\/details>"}, {"t": "emparelhar", "rot": "Cortar antes ou responder depois", "p": "Na escola, classifica cada caso: censura prévia ou responder depois?", "pares": [["A direção lê o jornal e corta o que não quer antes de imprimir.", "Censura prévia"], ["O jornal acusa um aluno sem provas; ele queixa-se e o jornal responde.", "Responder depois"], ["A rádio da escola só passa canções de uma lista aprovada.", "Censura prévia"], ["Um cartaz insulta um colega; é retirado e o autor é chamado.", "Responder depois"]], "f": "Na censura prévia, alguém corta antes de o público ver ou ouvir, como a canção que nem chegou ao ar em 1974. Responder depois é outra coisa: publica-se primeiro e, se houver abuso, quem publicou responde por ele.", "fe": "Pergunta a cada caso: alguém cortou antes de o público ver, ou publicou-se primeiro e houve resposta depois?"}, {"t": "ler", "rot": "Lourenço Marques, 25 de junho de 1975", "titulo": "Treze anos de guerra, cinco independências", "html": "<p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara na Guiné-Bissau, que aparece duas vezes. Procura também quem conta o número de mortos.<\/p><figure class='desenho'><svg viewBox='0 0 342 122' role='img' aria-label='Desenho: linha de 1973 a 1975. A Guiné-Bissau declara a independência em 1973 e Portugal reconhece-a em 1974; em 1975, Moçambique, Cabo Verde, São Tomé e Príncipe e Angola' xmlns='http://www.w3.org/2000/svg'><path d='M12 78H330' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><path d='M12.0 73V83' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><text x='12.0' y='97' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>1973<\/text><path d='M118.0 73V83' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><text x='118.0' y='97' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>1974<\/text><path d='M224.0 73V83' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><text x='224.0' y='97' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>1975<\/text><path d='M89.4 70Q140.4 22 191.3 70' fill='none' stroke='var(--mostarda,#d9a520)' stroke-width='2.2' stroke-dasharray='5 4'/><text x='140.4' y='38' text-anchor='middle' font-size='13' font-weight='700' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>Guiné-Bissau<\/text><circle cx='89.4' cy='78' r='4' fill='currentColor'/><circle cx='191.3' cy='78' r='4' fill='currentColor'/><circle cx='275.2' cy='78' r='3' fill='currentColor'/><circle cx='278.2' cy='78' r='3' fill='currentColor'/><circle cx='280.2' cy='78' r='3' fill='currentColor'/><circle cx='315.3' cy='78' r='4' fill='currentColor'/><path d='M278.2 71V60' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/><text x='330' y='22' text-anchor='end' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>Moçambique<\/text><text x='330' y='37' text-anchor='end' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>Cabo Verde<\/text><text x='330' y='52' text-anchor='end' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>São Tomé e Príncipe<\/text><text x='89.4' y='114' text-anchor='middle' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>declara<\/text><text x='191.3' y='114' text-anchor='middle' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>Portugal reconhece<\/text><text x='330' y='114' text-anchor='end' font-size='12' font-family='Arial, Helvetica, sans-serif' fill='currentColor'>Angola<\/text><\/svg><\/figure><p>A guerra começou em Angola em 1961. O Programa do MFA reconhecia que a solução era «política e não militar». Segundo o <i>Diário de Notícias<\/i>, morreram em África cerca de nove mil militares portugueses; para as vítimas africanas não temos número confirmado.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A guerra colonial começou em Angola em 1961, na Guiné em 1963 e em Moçambique em 1964. O Programa do MFA abre com «ao fim de treze anos de luta em terras do ultramar» e reconhece que «a solução das guerras no ultramar é política e não militar». O número de cerca de nove mil militares portugueses mortos em África, entre 1961 e 1974, foi citado pelo <i>Diário de Notícias<\/i> a propósito da Liga dos Combatentes. É o número de um só lado da guerra.<\/p><p>A Lei n.º 7/74, de 27 de julho, aceitou a independência dos territórios ultramarinos. A Guiné-Bissau, que declarara unilateralmente a independência a 24 de setembro de 1973, foi reconhecida por Portugal a 10 de setembro de 1974. Em 1975 vieram Moçambique, a 25 de junho, com cerimónias em Lourenço Marques, Cabo Verde, a 5 de julho, São Tomé e Príncipe, a 12 de julho, e Angola, a 11 de novembro. Para Angola, o Acordo do Alvor fora assinado a 15 de janeiro; em novembro, a independência foi proclamada pelo MPLA, e o Governo português manteve a neutralidade e não a reconheceu de imediato.<\/p><p>Estima-se que no verão e no outono de 1975 tenham chegado a Portugal, sobretudo de Angola e Moçambique, cerca de meio milhão de pessoas, os chamados «retornados», cerca de 5% da população residente; cerca de 65% tinham nascido em Portugal, segundo Morgane Delaunay, num texto para a Comissão 50 anos. Para Pedro Pezarat Correia, militar de Abril e académico, «as independências são sempre conquistas dos povos colonizados, e nunca dádivas das potências coloniais».<\/p><p>O desenho é nosso, com as datas do Centro de Documentação 25 de Abril e da Comissão 50 anos.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Duas datas", "p": "Porque tem a independência da Guiné-Bissau duas datas, uma em 1973 e outra em 1974?", "o": ["Em 1973 declarou-a; em 1974, Portugal reconheceu-a.", "Em 1973 foi Bissau; em 1974, foi o resto do território.", "Em 1973 proclamou-a; em 1974, a população votou-a.", "Em 1973 acabou a guerra; em 1974, foi assinada a paz."], "c": 0, "f": "A Guiné-Bissau declarou unilateralmente a independência a 24 de setembro de 1973; Portugal reconheceu-a a 10 de setembro de 1974. Uma independência pode ter duas datas: a de quem a declara e a de quem a reconhece.", "fe": ["", "Não há duas partes do território com datas diferentes: a mesma independência tem a data de quem a declara e a de quem a reconhece.", "Nenhuma das datas é de uma votação. A de 1973 é a declaração da Guiné-Bissau; a de 1974, o reconhecimento por Portugal.", "A guerra não acabou em 1973: em 1974, o Programa do MFA ainda falava de «treze anos de luta». 1973 é a data da declaração."]}, {"t": "escolha", "rot": "Ler um número", "p": "Morreram em África cerca de nove mil militares portugueses. O que permite este número afirmar?", "o": ["O total de militares portugueses mortos na guerra.", "O total de todas as vítimas mortais daquela guerra.", "O território africano onde morreram mais militares.", "O motivo político que levou ao fim daquela guerra."], "c": 0, "f": "Um número diz exatamente o que conta e mais nada: aqui, militares portugueses, segundo o <i>Diário de Notícias<\/i>. Usá-lo para a guerra inteira apagaria um dos lados. Antes de citares um número, pergunta quem ficou de fora.", "fe": ["", "O número conta só os militares portugueses. As vítimas africanas não estão nele, e para elas não temos um número confirmado.", "É um total de 1961 a 1974, sem divisão por território. Não permite comparar Angola com a Guiné.", "Um total de mortos não explica porque acaba uma guerra. O Programa do MFA dizia que a solução era «política e não militar»."]}, {"t": "ler", "rot": "Lisboa, 25 de novembro de 1975", "titulo": "Até os nomes se discutem", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-25-de-abril-anefo-militares-praca-comercio-1975.webp\" alt=\"Fotografia a preto e branco num pátio de calçada, diante de um edifício com varandas: militares de boina e farda conversam com um homem à civil; um deles tem no braço uma braçadeira com as letras PM. Ao fundo, um jipe.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:40% 55%\"><figcaption>Militares em Lisboa, fevereiro de 1975. Rob Mieremet, Anefo. <a href=\"https://commons.wikimedia.org/wiki/File:Portugal,_politiek,_straatbeelden_etc_straatbeelden_in_Lissabon_Militairen_op,_Bestanddeelnr_927-7467.jpg\" target=\"_blank\" rel=\"noopener\">CC0<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara na data da fotografia: mostra o 25 de Novembro? Separa depois o facto do nome que lhe dão.<\/p><p>«PREC» e «Verão Quente», nomes deste período, têm por vezes uma carga depreciativa. A 25 de novembro, decretou-se o estado de sítio na região de Lisboa; a 26, no ataque ao Regimento da Polícia Militar, morreram três militares. A Comissão 50 anos chama-lhe «um primeiro desfecho».<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>Até os nomes se discutem: «PREC» (Processo Revolucionário em Curso) e «Verão Quente» têm por vezes uma carga depreciativa, e os historiadores não concordam sobre quando começa e acaba esse período, escreve Francisco Bairrão Ruivo para a Comissão 50 anos.<\/p><p>A manifestação da «Maioria Silenciosa», de apoio a Spínola, foi marcada para 28 de setembro de 1974; Spínola renunciou à Presidência a 30 de setembro. A 11 de março de 1975, uma tentativa de golpe ligada a Spínola falhou; nessa noite, a Assembleia do MFA decidiu criar o Conselho da Revolução, e a 14 de março a banca foi nacionalizada. Nas eleições para a Assembleia Constituinte, a 25 de abril de 1975, votaram 91% dos eleitores.<\/p><p>A 25 de novembro, paraquedistas ocuparam bases aéreas e o comando da 1.ª Região Aérea. O Presidente da República, Costa Gomes, decretou o estado de sítio na região de Lisboa, e os Comandos da Amadora, chefiados por Jaime Neves, avançaram contra as unidades sublevadas, numa operação do grupo militar chefiado por Ramalho Eanes. No dia 26, no ataque ao Regimento da Polícia Militar, morreram três militares (Centro de Documentação 25 de Abril). A Comissão 50 anos chama-lhe «um primeiro desfecho» de um período de confrontos.<\/p><p>A fotografia é de fevereiro de 1975, nove meses antes do 25 de Novembro: mostra militares e um civil num pátio de Lisboa, não os acontecimentos de novembro. Um dos militares tem uma braçadeira com as letras PM; a descrição do arquivo não diz o que significam nem de que unidade é o militar.<\/p><\/div><\/details>"}, {"t": "emparelhar", "rot": "Facto ou leitura", "p": "Separa o que aconteceu, com data, do nome ou juízo que alguém lhe dá.", "pares": [["A 25 de novembro, decretou-se o estado de sítio na região de Lisboa.", "Facto datado"], ["O 25 de Novembro foi «um primeiro desfecho».", "Leitura de alguém"], ["A 26 de novembro, houve um ataque ao Regimento da Polícia Militar.", "Facto datado"], ["Chamar «Verão Quente» ao verão de 1975.", "Leitura de alguém"]], "f": "Os factos têm data e confirmam-se numa cronologia, como a do Centro de Documentação 25 de Abril. «Um primeiro desfecho» é a leitura da Comissão 50 anos, e «Verão Quente» é um nome que por vezes já traz um juízo. Quem conta diz quem fala.", "fe": "Pergunta a cada frase: há uma data e uma fonte onde a confirmar, ou é alguém a dar nome e valor ao que aconteceu?"}, {"t": "ler", "rot": "Museu do Aljube, Lisboa", "titulo": "O dia inicial", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-25-de-abril-aljube-janela-2021.webp\" alt=\"Grades de ferro grossas em primeiro plano; por trás, desfocada, a fachada de pedra da Sé de Lisboa, com uma rosácea e torres.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 55%\"><figcaption>Janela da antiga prisão do Aljube, 2021. CrisLuiz. <a href=\"https://commons.wikimedia.org/wiki/File:View_from_a_window_-_old_prison_-_Aljube,_Lisbon.jpg\" target=\"_blank\" rel=\"noopener\">CC0<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara no que se vê da antiga prisão: o que fica à frente, o que fica lá fora? Depois procura o verso da polémica.<\/p><p>Em 1977, Sophia de Mello Breyner Andresen publicou «25 de Abril»: «Esta é a madrugada que eu esperava / o dia inicial inteiro e limpo». O segundo verso está na última sala do museu. Em 2024, Vasco Lourenço citou-o na polémica do 25 de Novembro.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>O poema saiu em <i>O Nome das Coisas<\/i> (Moraes Editores, 1977); a edição atual é da Assírio & Alvim (2015). Numa entrevista reproduzida na exposição da Biblioteca Nacional, Sophia cita o poema de cor com duas palavras diferentes («Em que emergimos», «E vivos habitamos»).<\/p><p>O edifício do Aljube foi prisão política de 1928 a 1965 e é, desde 2015, o Museu do Aljube Resistência e Liberdade. Fala da «ditadura que enfrentámos entre 1926 e 1974».<\/p><p>A 2 de abril de 1976, a Assembleia Constituinte, reunida em São Bento, aprovou a Constituição da República. O texto de 1976 consagrava a transição para o socialismo e mantinha os militares no poder político através do Conselho da Revolução; a revisão de 1982 extinguiu o Conselho da Revolução e criou o Tribunal Constitucional, e até 2016 houve sete revisões. A 25 de abril de 1976 fizeram-se as primeiras eleições legislativas, e a 27 de junho Ramalho Eanes foi eleito Presidente da República, com 61,5%.<\/p><p>A ditadura durou 17 499 dias, de 28 de maio de 1926 a 25 de abril de 1974. A 24 de março de 2022, a democracia passou a durar mais um dia do que a ditadura, e nesse dia começaram as comemorações oficiais dos 50 anos. A 25 de abril de 2024, Celeste Caeiro desceu a Avenida da Liberdade de cadeira de rodas, com cravos; morreu a 15 de novembro desse ano, aos 91 anos. Salgueiro Maia (1944-1992) recebeu a Grã-Cruz da Ordem da Liberdade em 1983 e, a título póstumo, a Ordem Militar da Torre e Espada.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Um verso no debate", "p": "Na leitura do verso feita por Vasco Lourenço, que imagem valoriza o 25 de Abril como origem?", "o": ["«Inicial»: a imagem de um começo que se desejava.", "«Madrugada»: a prova de que as ruas ficaram vazias.", "«Esperava»: a prova de que a poeta sabia o plano.", "«Limpo»: a prova de que nesse dia não houve mortos."], "c": 0, "f": "«Inicial» apresenta o dia como um começo. Vasco Lourenço usa essa imagem na sua posição sobre as comemorações. O poema não prova, por si, que outra data deva ou não ser assinalada.", "fe": ["", "A madrugada é a hora das senhas, mas a 25 de abril as ruas encheram-se. O verso não diz que tudo se passou longe delas.", "Esperar uma madrugada não é conhecer um plano. O verso fala de um desejo, não de uma informação.", "Houve mortos a 25 de abril de 1974, na Rua António Maria Cardoso. «Limpo» é uma imagem, não um balanço."]}, {"t": "ler", "rot": "Decide", "titulo": "Uma data ou duas?", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-25-de-abril-placa-salgueiro-maia-lisboa-2007.webp\" alt=\"Pedra clara e gasta, com letras gravadas: «A Salgueiro Maia, lembrando o 25 de Abril de 1974, homenagem da cidade de Lisboa» e, por baixo, «CML 1992».\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 50%\"><figcaption>Pedra de homenagem a Salgueiro Maia, Lisboa, 2007. Midir. <a href=\"https://commons.wikimedia.org/wiki/File:Placa_Salguiero_Maia.jpg\" target=\"_blank\" rel=\"noopener\">Domínio público<\/a><\/figcaption><\/figure><p>Em 1992, Lisboa gravou nesta pedra «lembrando o 25 de Abril de 1974». Na polémica documentada em 2024 e 2025, há posições diferentes sobre o lugar das duas datas. Em junho de 2024, o Parlamento aprovou assinalar também, todos os anos, o 25 de Novembro de 1975.<\/p><p class=\"q-pensa\">Assinalarias todos os anos o 25 de Novembro, como o 25 de Abril?<\/p><p class=\"nota-pensa\">Decide em silêncio. Só depois abre os lados.<\/p><details class=\"lado\"><summary>A razão de quem quis assinalar<\/summary><div class=\"lado-c\"><p>Votaram a favor CDS, PSD, Iniciativa Liberal e Chega. Em 2025, Paulo Núncio (CDS) lembrou que o Parlamento decidira que, nos 50 anos, as duas datas seriam «celebradas» de forma igual; Pedro Pinto (Chega) disse que «não se podia tratar o 25 de Novembro como uma data menor»; Hugo Soares (PSD) defendeu «a dignidade de uma sessão solene».<\/p><\/div><\/details><details class=\"lado\"><summary>A objeção de quem recusou<\/summary><div class=\"lado-c\"><p>PS, BE, PCP e Livre votaram contra. A Associação 25 de Abril, presidida por Vasco Lourenço, recusou o convite para a sessão solene por ver nela uma «clara deturpação dos acontecimentos». O PCP falou de «desvalorização, menorização e ataque ao 25 de Abril»; o BE, de «operação de revisão histórica».<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Com rigor", "p": "Que resumo distingue as posições apresentadas, sem as transformar em consenso?", "o": ["Para o BE, é revisão histórica; para o Chega, não é data menor.", "Para o BE e para o Chega, ambas as datas têm hoje o mesmo valor.", "Para todos os historiadores, a comemoração deturpa a história.", "Para todo o Parlamento, as duas datas devem ter o mesmo valor."], "c": 0, "f": "A frase rigorosa dá duas posições, cada uma com o nome de quem a defende, e não escolhe entre elas. Que datas uma democracia deve comemorar é uma pergunta que fica contigo.", "fe": ["", "O BE e o Chega defenderam posições diferentes: não lhes atribuas um acordo que o texto não mostra.", "A crítica à comemoração pertence a intervenientes identificados, não a todos os historiadores.", "A votação teve votos contra: não há uma posição de todo o Parlamento a favor da equivalência."]}, {"t": "ler", "rot": "Para ligar", "titulo": "No Português e no Lente", "html": "<ul class=\"ligar\"><li><b><a href=\"https://pedrohfernandes-klk.github.io/pt/m4/licao-m4-f11/\">Módulo 4: A palavra contra o poder<\/a><\/b>Vieira fala aos peixes para os homens ouvirem; em 1974, a senha teve de ser uma canção que a rádio pudesse passar.<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/pt/m8/licao-m8-f03/\">Módulo 8: Jorge de Sena, poeta testemunha<\/a><\/b>Sena escreveu como testemunha, fora de Portugal; Sophia, que se correspondia com ele, escreveu outro testemunho, o da madrugada de 1974.<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/passo-07/\">Cidadania, Ser-se humano: A ordem chegou<\/a><\/b>Na Ribeira das Naus e na Rua do Arsenal, as ordens de abrir fogo não foram obedecidas: quem dá, transmite e cumpre uma ordem?<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/lente/investigar/passo-08/\">Como se investiga: verificação lateral<\/a><\/b>Para a hora da «Grândola», o Centro de Documentação 25 de Abril e a Renascença não dão a mesma hora: um caso real de fontes que discordam.<\/li><\/ul>"}, {"t": "ler", "rot": "Para levar", "escuro": true, "html": "<p class=\"levar\">Antes de contares um momento político, separa o facto datado da leitura que se faz dele e põe em cada leitura um nome.<\/p><p>O 25 de Abril começou com duas canções na rádio e, quando as ruas se encheram, passou de golpe a revolução. Cinquenta anos depois, ainda se discute que datas o contam. Quem conta diz de onde vem cada facto e quem defende cada leitura.<\/p><details class=\"mais\"><summary>No caderno, à escolha<\/summary><div class=\"mais-c\"><p>Trabalha em papel e diz sempre de onde vem cada facto, com a data. Cada opinião leva o nome de quem a defende. Não copies cartazes partidários nem fotografias com direitos.<\/p><p><b>Colagem «48 retângulos»: o teu retângulo num painel da turma.<\/b> Um retângulo com a medida combinada pela turma, para caber num rolo de papel de cenário dividido em retângulos, como os 48 do mural de 10 de junho de 1974. Uma palavra sobre o que é hoje a liberdade, legível do fundo da sala. Uma imagem feita por ti (desenho, pintura ou recorte de papel teu) ou uma imagem livre, com o autor indicado. Atrás, uma frase que diz de onde veio a ideia e um facto datado de 1974 ou 1975, com a fonte.<\/p><p><b>Ensaio «Duas datas»: 250 a 350 palavras em papel.<\/b> Responde à pergunta: 25 de Abril e 25 de Novembro, uma democracia deve comemorar uma data ou várias? Apresenta pelo menos duas posições, cada uma com o nome de quem a defende e a fonte. Usa pelo menos três factos datados e distingue sempre o facto da opinião. Termina com a tua posição, fundamentada, ou com a pergunta que ficou em aberto.<\/p><\/div><\/details><details class=\"mais\"><summary>Fontes (44)<\/summary><div class=\"mais-c\"><ul><li><a href=\"https://www.cd25a.uc.pt/page/958\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», abril de 1974<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/959\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», maio de 1974<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/960\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», junho de 1974<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/961\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», julho de 1974<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/963\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», setembro de 1974<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/970\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», abril de 1975<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/972\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», junho de 1975<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/973\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», julho de 1975<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/977\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», novembro de 1975<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/982\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», abril de 1976<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/984\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, «O Pulsar da Revolução», junho de 1976<\/a><\/li><li><a href=\"https://www.cd25a.uc.pt/page/769\" target=\"_blank\" rel=\"noopener\">Centro de Documentação 25 de Abril, Programa do Movimento das Forças Armadas<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/venham-mais-cinco/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Venham mais cinco»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/salgueiro-maia/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Salgueiro Maia»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/imprensa-e-revolucao/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Imprensa e revolução»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/prisoes-da-ditadura/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Prisões da ditadura»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/verao-quente-de-1975/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Verão Quente de 1975»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/25-de-novembro-50-anos-depois/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «25 de Novembro, 50 anos depois»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/os-retornados/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Os retornados»<\/a><\/li><li><a href=\"https://50anos25abril.pt/historia/portugal-na-hora-da-descolonizacao/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, «Portugal na hora da descolonização»<\/a><\/li><li><a href=\"https://50anos25abril.pt/comemoracoes-2024/\" target=\"_blank\" rel=\"noopener\">Comissão Comemorativa 50 anos 25 de Abril, comemorações de 2024<\/a><\/li><li><a href=\"https://www.museudoa
