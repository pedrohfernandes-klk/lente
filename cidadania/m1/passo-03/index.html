êm de defender a mesma posição em cada fala.</p>"}, {"t": "ler", "rot": "Conhecer", "titulo": "A obra e o problema", "html": "<h3>Uma pessoa não tem de ser parecida contigo</h3><p>A dignidade é o valor que reconhecemos a cada pessoa por ser pessoa. Não depende de ser simpática, útil, popular ou semelhante a nós. Os direitos humanos partem deste reconhecimento. Podemos criticar uma ação e continuar a reconhecer direitos a quem a praticou. A igualdade de dignidade não significa que todas as pessoas tenham a mesma história ou as mesmas condições de vida.</p><h3>Shakespeare e Shylock</h3><p>Shakespeare escreveu teatro em Inglaterra entre os séculos XVI e XVII. Em O Mercador de Veneza, Shylock é um judeu que vive num meio marcado pela hostilidade contra os judeus. No ato III, cena 1, reclama o reconhecimento de uma humanidade comum. O discurso também caminha para a vingança. A passagem obriga a discutir as duas coisas: discriminação sofrida e responsabilidade pelas ações.</p><h3>The Egg: imaginar o lugar de todos</h3><p>The Egg é um conto de Andy Weir. Uma personagem descobre uma possibilidade imaginária: todas as vidas humanas estariam ligadas à sua própria existência. O conto transforma o modo como olhamos para quem é diferente ou desconhecido. É uma proposta de ficção para pensar a empatia. Não é uma demonstração científica sobre a vida ou a morte.</p><h3>Um terceiro caso: A Vida dos Outros</h3><p>A Vida dos Outros é um filme de Florian Henckel von Donnersmarck, de 2006. Em Berlim Oriental, em 1984, um agente da polícia política escuta dia e noite a casa de um dramaturgo e de uma atriz, que não o sabem. O filme pergunta o que a vigilância faz a quem é vigiado e a quem vigia.</p><h3>Shakespeare, O Mercador de Veneza, ato III, cena 1</h3><blockquote class=\"cid-cena\">Um judeu não tem olhos? Não tem um judeu mãos, órgãos, corpo, sentidos, afetos, paixões? […] Se nos picam, não sangramos? Se nos fazem cócegas, não rimos? Se nos envenenam, não morremos? E, se nos fazem mal, não havemos de nos vingar? Se somos como vós no resto, também nisso nos pareceremos.</blockquote><p class=\"fonte\">Tradução própria de um excerto do original em domínio público. As reticências assinalam uma omissão. Procura a passagem da humanidade comum para a justificação da vingança.</p><h3>Para consultar</h3><ul class=\"fontes-cid\"><li><a href=\"https://www.folger.edu/explore/shakespeares-works/the-merchant-of-venice/read/3/1/\">Folger Shakespeare Library, O Mercador de Veneza, III, 1</a></li><li><a href=\"https://galactanet.com/oneoff/theegg_mod.html\">Andy Weir, The Egg, original em inglês</a></li><li><a href=\"https://unric.org/pt/declaracao-universal-dos-direitos-humanos/\">ONU / UNRIC, Declaração Universal dos Direitos Humanos</a></li></ul>"}, {"t": "ler", "rot": "Relacionar", "titulo": "Das palavras à situação", "html": "<p>Estas palavras ajudam a nomear o que estamos a observar.</p><dl class=\"termos\"><div class=\"termo\"><dt>Humanismo</dt><dd>Perspetiva que coloca o valor da pessoa e a sua capacidade de pensar, agir e viver com os outros no centro da reflexão.<span class=\"exemplo\">Por exemplo: Perguntar se o Estado respeita o escritor como pessoa, e não só como suspeito.</span></dd></div><div class=\"termo\"><dt>Dignidade</dt><dd>Valor de uma pessoa que não depende da sua utilidade ou popularidade.<span class=\"exemplo\">Por exemplo: Uma pessoa merece respeito mesmo quando o poder a considera suspeita.</span></dd></div><div class=\"termo\"><dt>Empatia</dt><dd>Procurar compreender a experiência ou o ponto de vista de outra pessoa.<span class=\"exemplo\">Por exemplo: Perguntar como viverias a divulgação de uma imagem tua sem autorização.</span></dd></div><div class=\"termo\"><dt>Discriminação</dt><dd>Tratamento desfavorável ligado a uma característica ou pertença.<span class=\"exemplo\">Por exemplo: Excluir alguém pela sua origem, em vez de avaliar a situação com critérios justos.</span></dd></div><div class=\"termo\"><dt>Igualdade</dt><dd>Reconhecimento dos mesmos direitos e da igual dignidade.<span class=\"exemplo\">Por exemplo: Os direitos não desaparecem quando uma pessoa é impopular.</span></dd></div></dl><div class=\"ponte\"><div><h3>Nas obras</h3><p>Shylock reclama humanidade; The Egg propõe imaginar a ligação entre vidas diferentes.</p></div><div><h3>Na cidadania</h3><p>A igualdade de direitos não pode depender de conseguirmos gostar de toda a gente.</p></div></div><p class=\"abre\">A empatia ajuda a compreender; a dignidade dá uma base que também vale quando a empatia falha.</p>"}, {"t": "emparelhar", "rot": "Direitos em cena", "p": "Seleciona um par de cada vez.", "pares": [["Escutar a casa de um casal sem eles saberem (A Vida dos Outros, 2006).", "Vida privada · artigo 12.º"], ["Ocultar a um escritor que é vigiado e afastar quem lho poderia dizer.", "Liberdade de informação · artigo 19.º"], ["Tratar uma vida como um produto subordinado às audiências.", "Igual dignidade · artigo 1.º"]], "f": "A vigilância permanente tira ao casal a decisão sobre a sua intimidade. Sem saber que é escutado, o escritor não consegue avaliar a sua situação. A dignidade da pessoa não depende do lucro ou do interesse do público.", "g": 0}, {"t": "posicoes", "reflexao": true, "rot": "Quem está do outro lado?", "cena": "", "p": "Situação inventada: um vídeo embaraçoso de um colega circula entre pessoas da escola.", "papeis": [{"rotulo": "Quem partilha", "texto": "Acha graça ao vídeo e não pensa no efeito da circulação. O facto de já existir não resolve a questão do consentimento."}, {"rotulo": "Quem aparece", "texto": "Não autorizou a publicação e teme que o vídeo passe a definir a forma como os outros o veem."}, {"rotulo": "Quem assiste", "texto": "Pode continuar a circulação, recusar partilhar ou procurar apoiar a pessoa exposta."}], "fb": "The Egg convida a imaginar o lugar do outro. Shakespeare permite perguntar por que razão alguém precisa de reclamar o reconhecimento da sua humanidade.", "g": 1}, {"t": "ler", "rot": "Na sala", "titulo": "Ler, representar, discutir", "html": "<p>As propostas seguintes fazem-se oralmente e com o corpo. O docente escolhe a sequência adequada à exploração.</p><h3>Leitura sentada</h3><p>Lê a passagem de Shylock apresentada em «Conhecer». Primeiro, identifica o que a personagem reclama; depois, procura o ponto em que aparece a justificação da vingança.</p><h3>Imagem de grupo</h3><p>Uma pessoa fica fora de uma imagem de grupo. O grupo altera um único gesto para mostrar inclusão. A turma pergunta se o gesto muda também a possibilidade real de participar.</p><h3>Debate de posições</h3><p>Distribui «reconhecer a injustiça» e «avaliar a reação». Cada grupo deve reconhecer uma razão do outro antes de apresentar a sua objeção.</p><p class=\"fonte\">As falas identificadas como texto original foram criadas para estas atividades. Não são excertos dos autores estudados.</p>"}, {"t": "ler", "rot": "Rever", "titulo": "O que levo deste passo", "html": "<ul><li>Dignidade e simpatia não são a mesma coisa.</li><li>Compreender uma reação não obriga a considerá-la justa.</li><li>Relaciona um direito com um exemplo concreto, explicando o efeito sobre a pessoa.</li></ul><h3>Do exemplo à explicação</h3><div class=\"modelo\"><div><span>O exemplo</span><p>Em A Vida dos Outros, o Estado escuta a intimidade de um casal sem eles o saberem.</p></div><div><span>O que permite perceber</span><p>A pessoa afetada não pode aceitar ou recusar essa exposição.</p></div><div><span>A ligação ao argumento</span><p>O direito à vida privada protege uma possibilidade de decisão, e não apenas um desejo de esconder algo.</p></div></div><h3>Uma pessoa perde os seus direitos por ter uma atitude de que discordamos?</h3><p>Não. Podemos avaliar e responsabilizar ações sem negar a dignidade e os direitos da pessoa.</p>"}, {"t": "ler", "rot": "Para levar", "escuro": true, "html": "<p class=\"levar\">Reconhecer não é idealizar</p><p>Uma pessoa pode merecer reconhecimento e, ao mesmo tempo, ter ações que devemos criticar. A discriminação sofrida por Shylock não torna automaticamente justa a vingança.</p><div class=\"cid-debate\"><b>Para debater</b>a empatia muda apenas o que sentimos ou também aquilo que fazemos?</div><p class=\"estudio\"><b>No estúdio</b> Ninguém entra em cena a representar uma pessoa real sem que essa pessoa seja respeitada: o retrato é um direito dela.</p>"}],chave:"epi-cidadania-m1-passo-03",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/passo-04/",seguinteRotulo:"Passo seguinte",depois:"<div class=\"c\"><p class=\"rot\">Aprendeste</p><p>Relacionar igualdade e dignidade com situações concretas, sem reduzir uma pessoa à sua utilidade ou pertença.</p><p class=\"sub\"><a href=\"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/glossario/\">Palavras explicadas</a> · <a href=\"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/oficina/\">Preparar um argumento para o ensaio</a></p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["passo-03"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
