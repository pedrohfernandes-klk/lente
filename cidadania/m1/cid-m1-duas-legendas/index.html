<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Duas legendas, o mesmo quadro · Cidadania · Ser-se humano</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

Yxr6fIlYfnXdiHWfsM6vbr68n4sjACmLk7ig8IeBEBlD28n5scKa2GwkYx3I0iW8Vw4BrkZWX+sD2zjMg96k9MK7x95TrT3Nzf11HzA4ylyjdepm16dv9UuM5EbDxAf3tt6Sr7TJkWkSKV/UUp2dWwN3NOdhrJUFjxZMtLHnHT/C22dXdBiz6EZeSorO514NqfWaGXUq1aNtN+O8o+r8sy+sI7dvUz4gYIIxyZgXqukzu1GZutalf20+eWtwdAuqTKUU8o75piDvWwJl1Z8aaDvFeViJfPukeOaskhllQ37/m4U4zyiuPlsoQAJqU4MNnOU0GoAswxm83ApZAFNKyLLumh3h/qivnHsZBz9XMn4CMfodtZdYkjOtNVHevi/GMX5KxSTJfAC0s95tlxf2YACW8lNHSZxOH8OdaZgH0vqV3xrPk6/UhHnEnkQso7EkhqtqTZRP9QUQnAhwjPGXNVEDB7LBoFGUrdH5hTJLZYoutBrTHIyw30FsWJamqr4hYfbQCD4lwoEleubZbxRumwLRhubDDesuT/OwDWImnBNkumeoSV7/KUkXQbBl20XBAZA++2uFavCWPBWsPBYPysr+iE1/uwywYOcnbKvSP8uUhNd34/DwJ3rTNyTKqr/90yNuT1CBVkzCwsvNNVWiCmLrFE3Oq5zk7R2JCJz+7vH63s+PH9yXkWpivBHu6wimgAA\" alt=\"Pintura: um casal jovem à esquerda, ele de pé com uma espingarda e um cão, ela sentada num banco; à direita e ao fundo, campos lavrados, molhos de trigo e árvores sob um céu nublado.\" loading=\"lazy\"><figcaption>Thomas Gainsborough, Mr e Mrs Andrews, cerca de 1750. National Gallery, Londres. Thomas Gainsborough. Domínio público no registo de origem (<a href=\"https://commons.wikimedia.org/wiki/File:Thomas_Gainsborough_-_Mr_and_Mrs_Andrews.jpg\">Wikimedia Commons</a>), consulta de 16/10/2026.</figcaption></figure><p>Uma equipa prepara uma pequena exposição com Mr e Mrs Andrews, de Thomas Gainsborough, pintor inglês. A pintura, de cerca de 1750, mostra o casal junto de campos da propriedade. A equipa compara duas legendas inventadas: A — «Um casal num dia tranquilo no campo»; B — «Um retrato de pessoas e da terra que possuem». As legendas são propostas de leitura, não palavras do pintor.</p>", "g": 1}, {"t": "ler", "titulo": "Antes de decidir", "html": "<p>Descrição, contexto e interpretação não são o mesmo. A descrição identifica elementos visíveis; o contexto reúne informação sobre a obra; a interpretação relaciona ambos. A National Gallery, que conserva a pintura, situa o casal na propriedade. Esta informação ajuda a avaliar as legendas, mas não permite conhecer todas as intenções do pintor ou das pessoas retratadas.</p>", "g": 2}, {"t": "escolha", "p": "Qual afirmação pode ser verificada diretamente na imagem?", "o": ["Vemos figuras humanas junto de uma paisagem com campos.", "Sabemos o que o casal sentiu durante toda a tarde.", "Conhecemos os salários de quem cultivou a propriedade."], "c": 0, "f": "As figuras e os campos são observáveis. Sentimentos e condições de trabalho exigem outras fontes.", "fe": [null, "Compara esta afirmação com a informação efetivamente disponível.", "Distingue o que o documento mostra da conclusão que lhe acrescentas."], "g": 3}, {"t": "ler", "titulo": "O que precisa de ser considerado", "html": "<p>Um visitante diz que a legenda A faz parecer que o quadro é apenas um momento íntimo. Outro diz que a B faz desaparecer a dimensão afetiva. A equipa só dispõe de espaço para uma legenda breve, mas pode ligar a uma explicação mais desenvolvida.</p>", "g": 4}, {"t": "decisao", "id": "primeira", "reflexao": true, "p": "Quanto da nossa interpretação vem da imagem e quanto vem da legenda?", "opcoes": [{"rotulo": "Dar prioridade à descrição do que se vê", "comentario": "Evitas começar por uma conclusão, mas uma descrição sem contexto também pode deixar de fora informação relevante."}, {"rotulo": "Destacar a relação entre retrato e propriedade", "comentario": "Apoias a leitura numa informação contextual. Ainda precisas de mostrar que elementos da imagem permitem discutir essa relação."}, {"rotulo": "Apresentar as duas leituras com os seus limites", "comentario": "Tornas visível a interpretação, mas o público precisa de perceber que as duas propostas não têm necessariamente o mesmo apoio documental."}], "g": 5}, {"t": "revelar", "reflexao": true, "titulo": "O efeito da primeira decisão", "efeitos": ["O visitante identifica os campos, mas continua sem saber que pertenciam à propriedade.", "O visitante pergunta se a legenda B prova que o casal não tinha afeto. A legenda não permite essa conclusão.", "Alguns visitantes comparam os indícios; outros leem as duas frases como se fossem citações históricas."], "html": "<p>A equipa encontra a página do museu e confirma a relação com a propriedade. Não encontra uma fonte que permita descrever o estado emocional do casal nesse momento. As legendas serão assinadas como textos da equipa.</p>", "g": 6}, {"t": "escolha", "p": "Que revisão respeita melhor a distinção entre fonte e interpretação?", "o": ["Identificar o contexto confirmado e apresentar a leitura da equipa como interpretação.", "Transformar uma impressão de tranquilidade num sentimento historicamente provado.", "Atribuir uma das legendas a Gainsborough sem documentação."], "c": 0, "f": "O contexto confirmado pode ser apresentado como tal. A leitura da equipa deve ser reconhecível e sustentada, sem se transformar em citação inventada.", "fe": [null, "Compara esta afirmação com a informação efetivamente disponível.", "Distingue o que o documento mostra da conclusão que lhe acrescentas."], "g": 7}, {"t": "posicoes", "reflexao": true, "p": "Abre as três perspetivas. Que informação ou preocupação acrescenta cada uma?", "papeis": [{"rotulo": "Visitante", "texto": "Quero perceber o que vejo e de onde vem a informação. Uma pergunta pode ajudar mais do que uma frase que decide por mim."}, {"rotulo": "Equipa de mediação", "texto": "A legenda é curta. Precisamos de escolher o essencial e indicar onde a interpretação pode ser aprofundada."}, {"rotulo": "Investigador", "texto": "O documento permite confirmar certas informações. O que não encontramos não deve ser preenchido com uma certeza conveniente."}], "fb": "Estas falas são inventadas para tornar o conflito discutível. Ouvir uma perspetiva não significa aceitá-la sem a relacionar com factos e razões.", "g": 8}, {"t": "ler", "titulo": "Três distinções úteis", "html": "<dl><dt><strong>Descrição</strong></dt><dd>Identificação do que é visível na imagem.</dd><dt><strong>Contexto</strong></dt><dd>Informação documentada sobre a obra e a sua situação.</dd><dt><strong>Interpretação</strong></dt><dd>Leitura sustentada que relaciona elementos e contexto.</dd></dl><p>Usa estas distinções para explicar a escolha. Apresenta uma razão, uma objeção e uma informação que ainda falta.</p>", "g": 9}, {"t": "emparelhar", "p": "Relaciona cada conceito com a sua definição, tal como foi apresentado.", "pares": [["Descrição", "Identificação do que é visível na imagem."], ["Contexto", "Informação documentada sobre a obra e a sua situação."], ["Interpretação", "Leitura sustentada que relaciona elementos e contexto."]], "f": "As definições ajudam a nomear diferenças no caso. Usa uma delas para explicar uma consequência; não basta memorizar as palavras.", "g": 10}, {"t": "decisao", "id": "revista", "reflexao": true, "p": "Depois da informação e das perspetivas, o que defendes agora?", "opcoes": [{"rotulo": "Escrever descrição breve, contexto e pergunta", "comentario": "Mostra que informação cabe e que pergunta abre. Evita uma legenda tão neutra que deixe de ajudar a observar."}, {"rotulo": "Defender a leitura da propriedade com um indício", "comentario": "Escolhe um elemento visível e uma fonte. Reconhece que esta leitura não explica tudo no quadro."}, {"rotulo": "Comparar duas leituras identificadas como propostas", "comentario": "Explica que indícios sustentam cada uma e onde o seu apoio é diferente."}], "g": 11}, {"t": "sintese", "reflexao": true, "g": 12}, {"t": "ler", "titulo": "Transferir para o projeto", "html": "<p>Escolhe uma imagem usada no projeto e compara uma descrição com uma interpretação. Diz que fonte permite acrescentar contexto e que conclusão ainda não podes defender.</p><p>Sem consultar: explica um conceito com um exemplo diferente e uma coisa que os documentos não permitem concluir. Depois regressa ao caso para confirmar ou rever.</p>", "g": 13}, {"t": "ler", "titulo": "Fontes e limites", "html": "<p>Fontes consultadas para o enquadramento e o método. O caso e as consequências são criações didáticas, sem citações atribuídas às pessoas ou instituições.</p><ul><li><a href=\"https://www.nationalgallery.org.uk/paintings/thomas-gainsborough-mr-and-mrs-andrews\">National Gallery · Mr and Mrs Andrews</a></li></ul><p>A escolha ética ou interpretativa não é pontuada. O resultado objetivo refere-se apenas a três exercícios sobre informação e conceitos. Não há uma conclusão única para todo o caso.</p>", "g": 14}],chave:"epi-cid-m1-duas-legendas",variar:false,mostrarAnterior:true,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/",percursoRotulo:"Os passos",voltarRotulo:"Voltar aos passos",seguinte:"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/",seguinteRotulo:"Voltar ao módulo",depois:"<p>Compara as decisões, identifica uma razão e aplica uma distinção ao teu projeto.</p>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["cid-m1-duas-legendas"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
