/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço a tinta
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado) e vermelho (17/10/2026: o verde saiu) */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--tinta,#000)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--tinta,#000);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

var K="epi-vozes";EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Vidas",titulo:"A arte e a vida",itens:[{"t":"ler","rot":"Abre","titulo":"A arte e a vida","html":"<p class=\"etq-m\">Vidas e ideias · Porta · 30 min</p><p>A 25 de outubro de 2022, a adidas terminou com efeito imediato a parceria com Ye (antes Kanye West), rapper e designer, e declarou-se única dona dos direitos de design dos produtos. A pessoa saiu; os desenhos ficaram. Pode separar-se a obra de quem a fez? E quando a própria vida é a obra, o que sobra para separar? Seis casos, de Lisboa em 1914 à Alemanha em 2022, para pensares com factos: uma artista sentada num museu, uma estrela de rock que despede a sua personagem, um crítico que anuncia a morte do autor, um rapper e as marcas que saem, um pintor que guardou a vida em caixas, um poeta que inventou outros poetas. A resposta fica contigo.</p><dl class=\"vz-vc\"><dt>Visionário</dt><dd>Abramović pôs o público dentro da obra: em 2010, no MoMA, mais de 850 000 pessoas foram vê-la, e o museu escreveu que a participação dos visitantes completava a obra. Barthes, em 1967, deslocou o sentido do autor para o leitor. Pessoa inventou autores completos, com biografia, estilo e opiniões próprias, como Alberto Caeiro, que lhe apareceu em 1914.</dd><dt>Controverso</dt><dd>Em outubro de 2022, depois de publicações antissemitas de Ye, o Instagram e o Twitter bloquearam-lhe as contas, e a Balenciaga e a adidas cortaram com ele. Em 2023, o Supremo Tribunal dos Estados Unidos decidiu contra a fundação de Warhol num ponto do «uso justo»: o licenciamento, em 2016, de um retrato de Prince que ele fez a partir de uma fotografia de Lynn Goldsmith. E <i>Mensagem</i> (1934), de Pessoa, ganhou um prémio criado pelo Secretariado de Propaganda Nacional do Estado Novo.</dd></dl>"},{"t":"ler","rot":"Olhar","titulo":"A pessoa ao balcão","html":"<figure class=\"fig-rev inteira\"><span class=\"fr-moldura\"><img src=\"https://pedrohfernandes-klk.github.io/lente/img/fontes/pessoa-1929-copo.jpg\" alt=\"Fotografia sépia de um homem de chapéu, óculos, laço e fato escuro, de pé ao balcão, a beber de um copo; atrás, prateleiras de garrafas e barris com rótulos.\" loading=\"lazy\" decoding=\"async\"></span><figcaption><span class=\"fr-leg\">Fernando Pessoa em 1929, o ano em que Álvaro de Campos, um dos poetas que ele inventou, escreveu a Ofélia Queiroz, a única namorada que se lhe conhece, e ela respondeu a Campos. Na fotografia está a pessoa; nas cartas, um dos seus outros.</span> <span class=\"fr-cred\">autor não identificado (fotografia de 1929). Domínio público. <a href=\"https://commons.wikimedia.org/wiki/File:Pessoacopo.jpg\" rel=\"noopener\">commons.wikimedia.org</a></span></figcaption></figure>"},{"t":"ler","rot":"Nova Iorque, 2010","titulo":"Sentar-se diante de alguém","html":"<div class=\"conceito\"><p>Marina Abramović nasceu em Belgrado, então Jugoslávia, a 30 de novembro de 1946. Estudou na Academia de Belas-Artes da cidade e cedo se voltou para a performance: o meio dela é o próprio corpo. Em 1974, em <i>Rhythm 0</i>, pôs numa mesa 72 objetos e deixou que o público, durante seis horas, os usasse sobre ela como quisesse; alguns eram perigosos, e a performance tornou-se violenta. Entre 1975 e 1988 trabalhou com o artista alemão Ulay, seu companheiro nesses anos; em 1988 partiram de pontas opostas da Muralha da China para se encontrarem a meio e se despedirem. Em 1997 concebeu a instalação <i>Spirit House</i> para o antigo matadouro municipal das Caldas da Rainha; a obra voltou a Portugal em 2019, nas Carpintarias de São Lázaro, em Lisboa.</p><p>De 14 de março a 31 de maio de 2010, no MoMA, em Nova Iorque, em <i>The Artist Is Present</i>, sentou-se em silêncio a uma mesa do átrio durante todo o horário do museu: mais de 700 horas. O comunicado do museu diz que a participação dos visitantes «completa a obra» (tradução nossa). Foram mais de 850 000 pessoas, um recorde de público. Ela resume assim: «Para mim, criar arte é o mesmo que viver» (citada no perfil do Praemium Imperiale, Japan Art Association, 2025; tradução nossa). Em 2026, para assinalar os seus 80 anos, foi a primeira mulher artista viva com uma grande exposição nas Gallerie dell'Accademia, em Veneza, ao lado de obras do Renascimento.</p></div><p class=\"insight\">Quando a obra é uma pessoa presente, quem olha deixa de estar de fora e passa a completá-la.</p>"},{"t":"ler","rot":"Londres, 1973","titulo":"A personagem que morreu em palco","html":"<div class=\"conceito\"><p>David Robert Jones nasceu em Brixton, Londres, a 8 de janeiro de 1947; por volta de 1966 já se chamava David Bowie. Em 1972 lançou o álbum <i>The Rise and Fall of Ziggy Stardust and the Spiders from Mars</i>. Ziggy é uma estrela de rock vinda de outro planeta, inventada por Bowie, e foi com essa persona que Bowie e a banda, os Spiders from Mars, passaram a dar concertos. A 6 de julho de 1972, Bowie apresentou «Starman» no programa <i>Top of the Pops</i>; Dylan Jones, então diretor da <i>GQ</i> britânica, citado no sítio oficial do músico, diz que essa atuação gravou a persona de Ziggy na consciência do país.</p><p>A 3 de julho de 1973, no Hammersmith Odeon, em Londres, Bowie anunciou em palco: «não só é este o último concerto da digressão, como é o último concerto que alguma vez faremos» (tradução nossa). O público e a própria banda saíram surpreendidos. Quem se despedia eram Ziggy e os Spiders from Mars: Bowie voltou à estrada em menos de um ano. Ziggy ainda apareceu uma última vez, em outubro de 1973, no programa <i>The 1980 Floor Show</i>, gravado no Marquee.</p><p>Bowie também guardava a própria história: o Victoria and Albert Museum, em Londres, adquiriu cerca de 90 000 objetos do seu espólio, entre eles os sapatos desenhados para Ziggy em 1972, e a curadora Harriet Reed chama-lhe «um arquivista ativo» da sua vida e obra (tradução nossa). Em Lisboa, tocou no Estádio de Alvalade a 14 de setembro de 1990, para cerca de 20 000 pessoas. A 8 de janeiro de 2016, dia em que fez 69 anos, saiu o álbum <i>★</i> (<i>Blackstar</i>); dois dias depois, a 10 de janeiro, morreu, após dezoito meses de doença oncológica.</p></div><p class=\"insight\">Uma persona pode morrer em palco sem que morra quem a inventou: a obra tem uma vida que não coincide com a do autor.</p>"},{"t":"ler","rot":"Uma caixa, 1967","titulo":"A morte do autor","html":"<div class=\"conceito\"><p>Em 1967, o número duplo 5+6 da revista <i>Aspen</i> era uma caixa branca com 28 elementos numerados: textos, discos, uma partitura de John Cage, as peças de cartão de uma maqueta. E um ensaio do crítico e semiólogo francês Roland Barthes (1915-1980), «The Death of the Author». Saiu primeiro em inglês; a versão francesa, «La mort de l'auteur», só apareceu em 1968.</p><p>O ensaio abre com uma frase de uma novela de Balzac, <i>Sarrasine</i>, e pergunta quem fala ali: a personagem, o homem Balzac, o autor Balzac? Barthes responde que é impossível saber. E acaba assim: «o nascimento do leitor tem de ser pago com a morte do Autor» (tradução nossa, a partir da tradução inglesa de Richard Howard). O sentido de um texto deixa de estar guardado na vida de quem o escreveu e passa para quem o lê. Em 1977, Barthes passou a ocupar a cadeira de semiologia literária do Collège de France.</p><p>A 22 de fevereiro de 1969, Michel Foucault (1926-1984) deu na Société française de philosophie a conferência «Qu'est-ce qu'un auteur?», com Jacques Lacan e Lucien Goldmann na sala. Propôs olhar para «o espaço […] deixado vazio pelo desaparecimento do autor» (tradução nossa): se o autor desaparece, o que ocupa o lugar dele? A coletânea de 1984 onde o ensaio de Barthes foi recolhido foi traduzida como <i>O rumor da língua</i> (Edições 70, 1987), e a conferência de Foucault como <i>O que é um autor?</i> (Vega, 1992).</p></div><p class=\"insight\">Barthes tirou o autor do centro do texto; Foucault perguntou quem ocupa o lugar que ficou vazio.</p>"},{"t":"ler","rot":"Herzogenaurach, 2022","titulo":"Quando as marcas saem","html":"<div class=\"conceito\"><p>Ye, nascido Kanye Omari West em Atlanta a 8 de junho de 1977, é rapper, produtor e designer de moda; mudou legalmente o nome em outubro de 2021. Estreou-se em álbum em 2004, com <i>The College Dropout</i>, e ganhou até hoje 24 prémios Grammy. Em 2016, a adidas anunciou com ele uma parceria de longo prazo, que descreveu como a mais importante entre alguém que não é atleta e uma marca de desporto. Em 2020, a Gap, onde trabalhou em adolescente, anunciou com ele a linha YEEZY Gap; em setembro de 2022, anunciou o fim da parceria.</p><p>A 3 de outubro de 2022, no desfile da sua coleção em Paris, Ye vestiu uma t-shirt com um slogan que o Southern Poverty Law Center associa a um grupo neonazi. A 8 e a 9 de outubro, respetivamente, o Instagram e o Twitter (hoje X) bloquearam-lhe as contas por publicações antissemitas, que não reproduzimos; a Anti-Defamation League chamou a uma delas «profundamente preocupante, perigosa e antissemita, ponto final» (tradução nossa). A 21 de outubro, a Kering declarou que a Balenciaga já não tinha qualquer relação com o artista nem planos de projetos futuros com ele. A 25 de outubro, num comunicado datado de Herzogenaurach, na Alemanha, a adidas terminou a parceria com efeito imediato: «A adidas não tolera o antissemitismo nem qualquer outra forma de discurso de ódio» (tradução nossa). Parou a produção e os pagamentos, previu um impacto negativo de até 250 milhões de euros no resultado de 2022 e declarou-se única dona dos direitos de design dos produtos. No mesmo dia, a Gap retirou-os das lojas.</p><p>Vieram depois elogios a Hitler numa entrevista, no fim de 2022, e t-shirts com a suástica à venda no sítio yeezy.com, em fevereiro de 2025. A 26 de janeiro de 2026, numa carta de página inteira no <i>Wall Street Journal</i>, pediu desculpa às comunidades judaica e negra e atribuiu o comportamento a uma lesão cerebral de um acidente de 2002 e a uma perturbação bipolar: é a explicação dele. Em abril de 2026, o Home Office britânico proibiu-lhe a entrada no Reino Unido, por a sua presença «não ser conducente ao bem público» (tradução nossa), e o festival Wireless, de que era cabeça de cartaz, foi cancelado. O diretor-geral do festival, Melvin Benn, tinha apelado ao perdão; o primeiro-ministro Keir Starmer disse que nunca devia ter sido convidado.</p><p>As marcas separaram-se do homem, mas a adidas ficou com os direitos dos desenhos. Separaram a obra da pessoa, ou ficaram com a obra e largaram a pessoa? E tu: ouves, usas, partilhas?</p></div><p class=\"insight\">Cortar com uma pessoa faz-se num dia; a obra feita com ela continua a existir, e alguém fica com ela.</p>"},{"t":"ler","rot":"Pittsburgh, 1994","titulo":"Uma vida em seiscentas caixas","html":"<div class=\"conceito\"><p>Andrew Warhola nasceu em Pittsburgh a 6 de agosto de 1928, num apartamento de duas divisões, filho de imigrantes de uma região que hoje é a Eslováquia. Em 1949 licenciou-se em Design Pictórico e mudou-se para Nova Iorque, onde foi, nos anos 1950, um dos ilustradores mais bem-sucedidos do seu tempo, com clientes como a Tiffany &amp; Co. e o <i>New York Times</i>. Em 1962, a série das latas de sopa Campbell's fez dele uma celebridade; no mesmo ano começou os retratos de Marilyn Monroe, Elvis Presley e Elizabeth Taylor. Em 1963 começou a fazer filmes, entre eles os <i>Screen Tests</i>, retratos filmados de quatro minutos. Em 1968 foi baleado no estúdio; depois de recuperar, cofundou a revista <i>Interview</i>.</p><p>Em 1974 começou as <i>Time Capsules</i>: caixas de cartão que enchia com o correio, fotografias, roupa e objetos do dia a dia. São mais de 600. O museu de Pittsburgh diz que a obra dele dos anos 70 e 80 «esbateu as fronteiras entre artista, <i>socialite</i> e celebridade» (tradução nossa). Morreu em Nova Iorque a 22 de fevereiro de 1987. Nasceu depois a Andy Warhol Foundation for the Visual Arts, e em 1994 abriu em Pittsburgh o Andy Warhol Museum.</p><p>A discussão sobre a obra continuou sem ele. Em 2016, a fundação licenciou à Condé Nast <i>Orange Prince</i>, um retrato de Prince que Warhol fez a partir de uma fotografia de Lynn Goldsmith, de 1981. A 18 de maio de 2023, o Supremo Tribunal dos Estados Unidos decidiu que, nesse licenciamento, o primeiro fator do «uso justo» (o propósito e o caráter do uso) não favorecia a fundação; era a única questão posta ao tribunal. A obra continuava a discutir-se 36 anos depois da morte do autor.</p></div><p class=\"insight\">Quem guarda tudo deixa a outros a decisão sobre o que, no meio de uma vida, é obra.</p>"},{"t":"ler","rot":"Lisboa, 1914","titulo":"O dia em que apareceu outro","html":"<div class=\"conceito\"><p>Fernando Pessoa nasceu em Lisboa a 13 de junho de 1888 e viveu sobretudo em Durban, na atual África do Sul, entre 1896 e 1905. Já lá inventava autores: em 1903 publicou um poema em inglês assinado Karl P. Effield, «supostamente de Boston»; em 1904 apareceu C. R. Anon, o primeiro autor fictício com obra extensa.</p><p>Numa carta de 13 de janeiro de 1935 a Adolfo Casais Monteiro, um dos diretores da revista <i>Presença</i>, contou o dia 8 de março de 1914: escreveu de pé, junto a uma cómoda alta, «trinta e tantos poemas a fio» de <i>O Guardador de Rebanhos</i> e deu ao autor o nome de Alberto Caeiro. «Desculpe-me o absurdo da frase: aparecera em mim o meu mestre» (em <i>Correspondência 1923-1935</i>, edição de Manuela Parreira da Silva, Assírio &amp; Alvim, 1999). Logo a seguir escreveu os seis poemas de «Chuva Oblíqua», assinados por ele próprio. Na mesma carta deu aos heterónimos vidas próprias: Ricardo Reis nasceu em 1887 no Porto e é médico; Caeiro nasceu em Lisboa em 1889 e morreu em 1915; Álvaro de Campos nasceu em Tavira a 15 de outubro de 1890 e é engenheiro naval.</p><p>A obra entrou na vida: a 25 de setembro de 1929, Álvaro de Campos escreveu uma carta a Ofélia Queiroz, a única namorada de Pessoa de que se tem conhecimento, e no dia seguinte Ofélia respondeu a Campos. Em vida, Pessoa publicou um só livro de poesia em português, <i>Mensagem</i>, a 1 de dezembro de 1934; o livro ganhou o Prémio Antero de Quental (segunda categoria), criado pelo Secretariado de Propaganda Nacional do Estado Novo, e na carta de 1935 Pessoa explica que o livro estava «nas condições (nacionalismo) de concorrer». Morreu em Lisboa a 30 de novembro de 1935. Guardava os papéis numa arca; entre 1942 e 1946, a editora Ática publicou a poesia em cinco volumes, com muitos inéditos tirados dela.</p></div><p class=\"insight\">Pessoa não separou a obra da vida: multiplicou-a, e deu a cada parte um nome, uma data e uma cidade.</p>"},{"t":"ordenar","rot":"A ordem dos cortes","p":"Põe por ordem, do mais antigo ao mais recente, o que aconteceu em 2022 entre Ye, as marcas e as plataformas.","passos":["A Gap anuncia o fim da parceria YEEZY Gap","No desfile da sua coleção em Paris, Ye veste uma t-shirt com um slogan que o Southern Poverty Law Center associa a um grupo neonazi","O Instagram e o Twitter bloqueiam-lhe as contas por publicações antissemitas","A Kering declara que a Balenciaga já não tem relação com ele","A adidas termina a parceria com efeito imediato, e a Gap retira os produtos das lojas"],"f":"Setembro: a Gap anuncia o fim da parceria. 3 de outubro: o desfile em Paris. 8 e 9 de outubro: as contas bloqueadas. 21 de outubro: a Kering. 25 de outubro: a adidas, e no mesmo dia a Gap retira os produtos. Repara que a Gap anunciou o fim antes das publicações de outubro: os cortes não vieram todos ao mesmo tempo, e as datas obrigam a ler cada um à parte.","g":0},{"t":"escolha","rot":"Quem fica com os desenhos?","p":"A 25 de outubro de 2022, a adidas terminou a parceria com Ye e declarou-se única dona dos direitos de design dos produtos. O que podes concluir daí?","o":["Que uma obra pertence sempre a quem a desenhou, mesmo depois de uma rutura.","Que os desenhos feitos com uma marca podem ficar com a marca, mesmo quando ela corta com quem os assinou.","Que a adidas mandou destruir os desenhos para apagar a ligação a Ye.","Que foi um tribunal a obrigar a adidas a separar a obra da pessoa."],"c":1,"fe":["O comunicado diz o contrário: quem se declarou única dona dos direitos de design foi a adidas, não quem desenhou.",null,"O comunicado fala em parar a produção e os pagamentos, não em destruir nada; e declarar-se dona dos direitos é guardar os desenhos, não apagá-los.","Não houve tribunal: foi a própria marca a decidir, num comunicado datado de Herzogenaurach. O tribunal que discutiu os direitos de uma obra foi outro, nos Estados Unidos, a propósito de um retrato de Prince feito por Warhol."],"f":"A pessoa saiu e os desenhos ficaram com a marca: a adidas declarou-se única dona dos direitos de design. Separou a obra da pessoa, ou ficou com a obra e largou a pessoa? É uma pergunta, não uma conclusão.","g":1},{"t":"escolha","rot":"A prova do museu","p":"Que facto prova melhor que, em _The Artist Is Present_ (MoMA, 2010), o público fazia parte da obra?","o":["A performance durou mais de 700 horas, todo o horário do museu.","Mais de 850 000 pessoas foram vê-la, um recorde de público.","O comunicado do MoMA diz que a participação dos visitantes «completa a obra».","Em 1974, em _Rhythm 0_, Abramović deixou o público usar 72 objetos sobre ela."],"c":2,"fe":["As 700 horas provam a duração e o esforço da artista, não o papel de quem estava do outro lado.","O número prova que muita gente foi ao museu; ir ver não é o mesmo que completar a obra.",null,"É verdade, mas é outra obra, 36 anos antes; não prova nada sobre a performance de 2010."],"f":"A prova está nas palavras do próprio museu: a participação dos visitantes «completa a obra». Sem essa participação, a obra fica por acabar.","g":2},{"t":"vf","rot":"Cartas a Ofélia","p":"Os heterónimos de Pessoa ficaram sempre dentro dos poemas: nunca entraram na vida dele.","v":false,"fe":"Em setembro de 1929, Álvaro de Campos escreveu uma carta a Ofélia Queiroz, e Ofélia respondeu a Campos no dia seguinte: um heterónimo entrou na vida amorosa do poeta.","f":"Falso. Pessoa deu aos heterónimos datas e cidades de nascimento e profissões, e Campos chegou a trocar cartas com Ofélia, em 1929. A obra saiu dos poemas e entrou na vida.","g":3},{"t":"escolha","rot":"Duas personagens com vida","p":"Pessoa deu a Caeiro um ano de nascimento e outro de morte; Bowie deu a Ziggy um último concerto, a 3 de julho de 1973. O que têm os dois gestos em comum?","o":["Os dois quiseram esconder do público quem era o verdadeiro autor.","Os dois inventaram a personagem já no fim da carreira, para se despedirem.","Os dois deixaram de criar quando a personagem acabou.","Os dois trataram uma personagem inventada como alguém com vida própria, com princípio e fim."],"c":3,"fe":["Bowie anunciou a despedida em palco, à vista de todos, e Pessoa contou a génese dos heterónimos numa carta assinada por ele, em 1935. Não há esconderijo: há outros nomes, assumidos.","Ziggy nasceu em 1972, e Bowie lançou _★_ em 2016, mais de quarenta anos depois; Caeiro apareceu em 1914, mais de vinte anos antes da morte de Pessoa.","Bowie voltou à estrada em menos de um ano; Pessoa publicou _Mensagem_ em 1934, quase vinte anos depois de 1915, o ano que deu à morte de Caeiro.",null],"f":"Caeiro nasce em 1889 e morre em 1915; Ziggy despede-se a 3 de julho de 1973. Nos dois casos, a personagem tem uma vida que começa e acaba, e o autor continua a criar depois dela.","g":4},{"t":"escolha","rot":"Barthes diante de Ye","p":"Em 1967, Barthes escreveu que «o nascimento do leitor tem de ser pago com a morte do Autor». Que conclusão tiras dessa ideia para o caso de Ye?","o":["Que se deve deixar de ouvir quem diz coisas condenáveis: é o que Barthes defende.","Que a ideia só vale para livros e não serve para canções nem para roupa.","Que conhecer a vida do autor é a melhor forma de perceber a obra.","Que a pergunta muda: em vez de «quem é ele?», passa a ser «o que faço eu com a obra?»."],"c":3,"fe":["Barthes não fala de comportamentos nem de boicotes: fala de quem dá sentido a um texto. Pedir-lhe uma sentença sobre Ye é pedir-lhe uma resposta que ele não dá.","A pergunta de Barthes é quem dá sentido a uma obra, e quem ouve uma canção ou veste uma peça também lhe dá sentido. A própria caixa de _Aspen_ juntava ao ensaio discos e uma partitura.","É o contrário: o ensaio abre com uma frase de _Sarrasine_ e conclui que é impossível saber se fala a personagem, o homem Balzac ou o autor Balzac. A vida de quem escreve deixa de ser a chave.",null],"f":"Barthes tira o autor do centro e põe lá quem lê. Aplicada a Ye, a ideia não absolve nem condena: muda a pergunta para o que fazes tu com a obra. Em 1969, Foucault acrescentou outra: o que ocupa o lugar que o autor deixa vazio?","g":5},{"t":"emparelhar","rot":"Cada pergunta, a sua prova","p":"Liga cada pergunta ao facto que melhor serve de prova.","pares":[["O público pode completar uma obra?","O MoMA escreve, em 2010, que a participação dos visitantes «completa a obra»"],["Uma persona pode morrer sem que morra o autor?","Bowie anuncia o último concerto de Ziggy a 3 de julho de 1973 e volta à estrada em menos de um ano"],["Uma marca pode ficar com a obra e largar a pessoa?","A adidas termina a parceria e declara-se única dona dos direitos de design"],["Quem decide o que é obra numa vida guardada?","Mais de 600 caixas de cartão com correio, fotografias e roupa"],["Onde acaba a obra e começa a vida?","Álvaro de Campos escreve a Ofélia Queiroz em 1929, e Ofélia responde-lhe"]],"f":"As palavras do museu, a despedida e o regresso de Bowie, o comunicado da adidas, as caixas de Warhol e as cartas de 1929: cada pergunta tem um facto com data a sustentá-la. Sem prova, uma resposta fica opinião; com prova, já se pode discutir.","g":6},{"t":"escolha","rot":"Duas vidas guardadas","p":"Warhol encheu mais de 600 caixas com a vida de todos os dias; a curadora do V&A chama a Bowie «um arquivista ativo» da sua vida e obra. O que podes inferir destes dois arquivos?","o":["Que os dois só quiseram deixar ao público as obras acabadas.","Que, depois da morte, a obra de um artista deixa de se discutir.","Que, quando um artista guarda a vida inteira, outros vão decidir o que nela é obra.","Que os dois arquivos foram montados por outras pessoas, depois da morte dos artistas."],"c":2,"fe":["As caixas de Warhol guardam correio, fotografias e roupa, e o V&A tem os sapatos de Ziggy: o que se guardou foi a vida, não só a obra acabada.","Em 2023, 36 anos depois da morte de Warhol, o Supremo Tribunal dos Estados Unidos ainda decidia sobre o licenciamento de um retrato de Prince feito por ele.",null,"Warhol começou as caixas em 1974, em vida, e a curadora chama a Bowie arquivista da sua própria vida e obra: foram eles que guardaram."],"f":"O V&A adquiriu cerca de 90 000 objetos de Bowie; as caixas de Warhol são mais de 600. Quando a vida inteira fica guardada, a fronteira entre obra e vida passa para quem abre as caixas: museus, curadores e quem os visita.","g":7},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Antes de decidires se separas a obra da pessoa, pergunta quem fala na obra, quem lhe dá sentido e quem fica com ela.</p><div class=\"caderno\"><b>No caderno: escolhe um dos dois</b><p>Em papel, à mão, só com factos que tenham data e fonte.</p><div class=\"vz-prod\"><b>Fanzine em papel: «Separar ou não?», oito páginas dobradas a partir de um único A4</b><ul><li>Uma página por caso, com um facto datado e a fonte escrita por baixo.</li><li>Seis factos certos, cada um com a sua data.</li><li>Nenhuma frase de ódio reproduzida: conta-se o que aconteceu, não se copia o que foi dito.</li><li>Na última página, a tua resposta à pergunta numa frase clara, com uma razão.</li></ul></div><div class=\"vz-prod\"><b>Podcast curto: Três minutos a duas vozes: separar ou não a obra da pessoa</b><ul><li>Uma voz defende separar a obra da pessoa, a outra defende o contrário, cada uma com dois factos dos casos.</li><li>Quatro factos verificáveis, ditos com a data.</li><li>Respeito pela posição contrária: ninguém interrompe nem ridiculariza a outra voz.</li><li>Guião escrito à mão antes de gravar, e um fecho que devolve a pergunta a quem ouve.</li></ul></div></div><p class=\"fontes-p\"><b>Fontes:</b> <a href=\"https://www.moma.org/documents/moma_press-release_387201.pdf\" target=\"_blank\" rel=\"noopener\">MoMA, comunicado de imprensa de _The Artist Is Present_ (2010)</a>; <a href=\"https://www.praemiumimperiale.org/en/laureate/abramovic/\" target=\"_blank\" rel=\"noopener\">Praemium Imperiale, Marina Abramović</a>; <a href=\"https://bocabienal.org/biennials/biennial19/spirit-house\" target=\"_blank\" rel=\"noopener\">BoCA, _Spirit House_ (2019)</a>; <a href=\"https://www.gallerieaccademia.it/en/exhibition/transforming-energy-marina-abramovic/\" target=\"_blank\" rel=\"noopener\">Gallerie dell'Accademia, _Transforming Energy_ (2026)</a>; <a href=\"https://www.davidbowie.com/about\" target=\"_blank\" rel=\"noopener\">David Bowie, sítio oficial</a>; <a href=\"https://www.npr.org/sections/therecord/2016/01/11/462660569/review-david-bowies-blackstar-is-adventurous-to-the-end\" target=\"_blank\" rel=\"noopener\">NPR, 11 de janeiro de 2016, sobre _★_</a>; <a href=\"https://www.vam.ac.uk/exhibitions/david-bowie-centre\" target=\"_blank\" rel=\"noopener\">Victoria and Albert Museum, David Bowie Centre</a>; <a href=\"https://www.news4jax.com/entertainment/2025/09/10/david-bowie-archive-opens-in-london-chronicling-five-decades-of-icons-restless-creativity/\" target=\"_blank\" rel=\"noopener\">Associated Press (News4JAX), 10 de setembro de 2025, sobre o arquivo de Bowie</a>; <a href=\"https://www.rtp.pt/rtpmemoria/gramofone/david-bowie-por-joao-carlos-callixto_49\" target=\"_blank\" rel=\"noopener\">RTP Memória, _Gramofone_</a>; <a href=\"https://www.ubu.com/aspen/aspen5and6/index.html\" target=\"_blank\" rel=\"noopener\">_Aspen_, n.º 5+6, índice (UbuWeb)</a>; <a href=\"https://www.ubu.com/aspen/aspen5and6/t fy-swastika-t-shirt/\" target=\"_blank\" rel=\"noopener\">CBS News, 11 de fevereiro de 2025</a>; <a href=\"https://ca.billboard.com/music/music-news/kanye-west-wsj-apology\" target=\"_blank\" rel=\"noopener\">Billboard Canada, 26 de janeiro de 2026</a>; <a href=\"https://www.opb.org/article/2026/04/07/wireless-festival-canceled-after-ye-is-barred-from-u-k-over-antisemitism/\" target=\"_blank\" rel=\"noopener\">NPR (OPB), abril de 2026</a>; <a href=\"https://www.grammy.com/artists/kanye-west/6900/\" target=\"_blank\" rel=\"noopener\">Recording Academy, Kanye West</a>; <a href=\"https://www.cbsnews.com/news/ye-kanye-west-name-change/\" target=\"_blank\" rel=\"noopener\">CBS News, 19 de outubro de 2021</a>; <a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, a vida de Andy Warhol</a>; <a href=\"https://press.warhol.org/press/museum-press-kit/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, dossier de imprensa</a>; <a href=\"https://www.supremecourt.gov/opinions/22pdf/21-869_87ad.pdf\" target=\"_blank\" rel=\"noopener\">Supremo Tribunal dos Estados Unidos, _Andy Warhol Foundation v. Goldsmith_ (2023)</a>; <a href=\"https://www.casafernandopessoa.pt/pt/fernando-pessoa/vida/cronologia\" target=\"_blank\" rel=\"noopener\">Casa Fernando Pessoa, cronologia</a>; <a href=\"https://www.casafernandopessoa.pt/pt/fernando-pessoa/textos/heteronimia\" target=\"_blank\" rel=\"noopener\">Casa Fernando Pessoa, carta sobre a génese dos heterónimos</a>; <a href=\"https://www.casafernandopessoa.pt/pt/cfp/A-Arca-Eterna-Fernando-Pessoa-e-a-Posteridade\" target=\"_blank\" rel=\"noopener\">Casa Fernando Pessoa, _A arca eterna_</a>.</p>"},{"t":"ler","rot":"Ler em português","titulo":"Para ler a seguir","html":"<ul class=\"vz-lista\"><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1008017~!0\" target=\"_blank\" rel=\"noopener\"><i>Correspondência</i></a><small>Fernando Pessoa (edição de Manuela Parreira da Silva), Assírio &amp; Alvim, 1999, ISBN 972-37-0505-2 e 972-37-0531-1. Dois volumes, 1905-1922 e 1923-1935; a carta a Adolfo Casais Monteiro sobre o dia 8 de março de 1914 está no segundo.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1827597~!0\" target=\"_blank\" rel=\"noopener\"><i>Teoria da heteronímia</i></a><small>Fernando Pessoa (edição de Fernando Cabral Martins e Richard Zenith), Assírio &amp; Alvim, 2012, ISBN 978-972-0-79318-8.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!2106422~!0\" target=\"_blank\" rel=\"noopener\"><i>Pessoa: uma biografia</i></a><small>Richard Zenith, tradução de Salvato Teles de Menezes e Vasco Teles de Menezes, Quetzal, 2022, ISBN 978-989-722-756-1.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!41777~!0\" target=\"_blank\" rel=\"noopener\"><i>O rumor da língua</i></a><small>Roland Barthes, tradução de António Gonçalves, Edições 70, 1987. Tradução de <i>Le bruissement de la langue</i> (1984), a coletânea onde foi recolhido «La mort de l'auteur».</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!2004768~!0\" target=\"_blank\" rel=\"noopener\"><i>O que é um autor?</i></a><small>Michel Foucault, tradução de António Fernando Cascais e E. Cordeiro, Vega, 2018, ISBN 978-972-699-303-2. 10.ª edição; a primeira é de 1992. A conferência de 22 de fevereiro de 1969.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1957246~!0\" target=\"_blank\" rel=\"noopener\"><i>Sobre Bowie</i></a><small>Rob Sheffield, tradução de Lia Pereira, Vogais, 2016, ISBN 978-972-8592-12-7.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1081702~!0\" target=\"_blank\" rel=\"noopener\"><i>Anjos, anjos, anjos</i></a><small>Andy Warhol, tradução de António Simões, Campo das Letras, 2001, ISBN 972-610-389-4.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!248034~!0\" target=\"_blank\" rel=\"noopener\"><i>Andy Warhol: Julho 1990</i></a><small>organização de José Navarro de Andrade, Cinemateca Portuguesa, 1990. Catálogo publicado pela Cinemateca Portuguesa, em Lisboa.</small></li></ul><p class=\"etq-m\">Requisita na Biblioteca Nacional ou nas Bibliotecas de Lisboa; a ligação abre o registo no catálogo.</p>"},{"t":"ler","rot":"Ver e ouvir","titulo":"Ligações","html":"<ul class=\"vz-lista\"><li><a href=\"https://www.youtube.com/watch?v=oOKWF3IHu0I\" target=\"_blank\" rel=\"noopener\">David Bowie, «Starman», no _Top of the Pops_, 1972 (canal oficial de David Bowie)</a><small>Em inglês. A atuação de 6 de julho de 1972, com Bowie como Ziggy.</small></li><li><a href=\"https://www.davidbowie.com/blog/2018/7/3/ziggy-killed-off-forty-five-years-ago-tonight\" target=\"_blank\" rel=\"noopener\">O último concerto de Ziggy, 3 de julho de 1973 (sítio oficial de David Bowie)</a><small>Em inglês. A despedida no Hammersmith Odeon, contada pelo sítio oficial.</small></li><li><a href=\"https://www.rtp.pt/rtpmemoria/gramofone/david-bowie-por-joao-carlos-callixto_49\" target=\"_blank\" rel=\"noopener\">RTP Memória, _Gramofone_: «David Bowie por João Carlos Callixto»</a><small>Bowie no Estádio de Alvalade, em 1990, e as versões portuguesas de canções suas.</small></li><li><a href=\"https://www.vam.ac.uk/exhibitions/david-bowie-centre\" target=\"_blank\" rel=\"noopener\">David Bowie Centre (Victoria and Albert Museum, Londres)</a><small>Em inglês. O arquivo de Bowie, com os sapatos de Ziggy.</small></li><li><a href=\"https://www.moma.org/documents/moma_press-release_387201.pdf\" target=\"_blank\" rel=\"noopener\">_The Artist Is Present_, comunicado de imprensa de 2010 (MoMA, Nova Iorque)</a><small>Em inglês. O museu apresenta a performance e o papel dos visitantes.</small></li><li><a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">A vida de Andy Warhol (The Andy Warhol Museum, Pittsburgh)</a><small>Em inglês. Das latas de sopa às <i>Time Capsules</i>.</small></li><li><a href=\"https://www.adidas-group.com/en/media/press-releases/adidas-terminates-partnership-with-ye-immediately\" target=\"_blank\" rel=\"noopener\">Comunicado da adidas, 25 de outubro de 2022</a><small>Em inglês. As palavras da marca, datadas de Herzogenaurach.</small></li><li><a href=\"https://www.youtube.com/watch?v=7j6rNUJH0wI\" target=\"_blank\" rel=\"noopener\">_A arca eterna: Fernando Pessoa e a posteridade_ (vídeo da Casa Fernando Pessoa)</a><small>A exposição da Casa Fernando Pessoa, em Campo de Ourique, de 27 de novembro de 2025 a 10 de janeiro de 2027.</small></li><li><a href=\"https://www.casafernandopessoa.pt/pt/fernando-pessoa/textos/heteronimia\" target=\"_blank\" rel=\"noopener\">Carta de Pessoa a Adolfo Casais Monteiro, 13 de janeiro de 1935 (Casa Fernando Pessoa)</a><small>O texto integral, com o dia 8 de março de 1914.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f02/\">Português, Módulo 7: o poeta é um fingidor</a><small>A «Autopsicografia» responde à mesma pergunta: a dor do poema não é a dor da vida, e quem lê sente outra.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f11/\">Português, Módulo 7: quantas vozes cabem num homem</a><small>Os heterónimos de Pessoa e as personas de Bowie: duas maneiras de pôr outro nome à frente da obra.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m9/licao-m9-f10/\">Português, Módulo 9: de quem é uma obra?</a><small>No <i>Memorial do Convento</i>, o convento de Mafra é obra de quem o mandou fazer ou de quem o construiu? A mesma pergunta cabe nos desenhos feitos com Ye, que ficaram com a adidas.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/narrativas/duchamp/\">Laboratório de Narrativas: Duchamp</a><small>Duchamp assinou um objeto que não fez; Warhol fez das latas de sopa Campbell's uma série. Quem escolhe também é autor?</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/cidadania/m1/passo-01/\">Cidadania: uma vida em direto</a><small>Truman vive a vida como espetáculo sem o saber; Abramović escolhe fazê-lo diante do público.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/cidadania/m2/passo-05/\">Cidadania: quem julga o que se diz?</a><small>Em 2022 foram as plataformas e as marcas a decidir sobre as palavras de Ye; quem deve julgar?</small></li></ul>"}],chave:"epi-vozes-arte-e-vida",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/lente/narrativas/#vidas-e-ideias",percursoRotulo:"Vidas e ideias",voltarRotulo:"Voltar a Vidas e ideias",seguinte:"https://pedrohfernandes-klk.github.io/lente/vozes/nietzsche/",seguinteRotulo:"Voz seguinte",evento:EPICantos,depois:"<div class=\"c\"><p class=\"rot\">Ouviste</p><p>Antes de decidires se separas a obra da pessoa, pergunta quem fala na obra, quem lhe dá sentido e quem fica com ela.</p><p class=\"sub\">Voz seguinte: <a href=\"https://pedrohfernandes-klk.github.io/lente/vozes/nietzsche/\">Nietzsche</a>.</p></div>",fim:function(){try{var S=JSON.parse(localStorage.getItem(K)||"null")||{feitas:{}};S.feitas=S.feitas||{};S.feitas["arte-e-vida"]=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(x){}}});
