<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Andy Warhol, Vidas e vozes, Lente</title><meta name="description" content="Andy Warhol em seis ângulos curtos: o ilustrador, as latas pintadas à mão, a máquina, o caso de Prince, a fama e Portugal."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--tinta:#000;--papel:#fff;--papel2:#faf8f2;--suave:#444;--fundo:#f3f2ee;--mostarda:#d9a520;--vermelho:#c8232c}@media (prefers-color-scheme:dark){:root{--tinta:#ecebe5;--papel:#121210;--papel2:#1a1a17;--suave:#b3b1aa;--fundo:#1d1d1a;--mostarda:#e0b23a;--vermelho:#e4555c}}*{box-sizing:border-box}body{margin:0;background:var(--fundo);color:var(--tinta);font:17px/1.5 Arial,Helvetica,sans-serif}

/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço verde
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado), vermelho e verde */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}
@keyframes cartaoEntra{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--certo,#1b7f3b)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--certo,#1b7f3b);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}
/* «Para levar» à máquina de escrever: a frase escreve-se letra a letra (a máquina só aqui) */
.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}
.jogo .cartao.escuro .simbolo.tracar{color:var(--papel)}
.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */
.jogo .ler .fig img{filter:grayscale(1);transition:filter 2s ease}.jogo.feita .ler .fig img,.jogo .ler .fig.cor img{filter:none}
.jogo .fim .fim-img{display:block;max-width:100%;max-height:min(26vh,220px);max-height:min(26dvh,220px);width:auto;margin:4px auto var(--d1,8px);filter:grayscale(1);animation:corVolta 2.4s ease-out .5s forwards}.jogo .fim .fim-img.cor{filter:none;animation:none}@keyframes corVolta{to{filter:grayscale(0)}}
.jogo .emblema{display:inline-block;width:64px;height:64px;border-radius:50%;border:2px solid var(--tinta);object-fit:cover;margin:6px;animation:carimbo .6s cubic-bezier(.2,1.4,.4,1) .9s both}@keyframes carimbo{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.96);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.4}}
.jogo .ler .gt{cursor:pointer;border-bottom:2px dotted var(--tinta)}.jogo .ler .gl-pop{display:inline-block;font:400 .82rem/1.3 Arial;background:var(--papel);color:var(--tinta);border:1px solid var(--tinta);padding:3px 7px;margin:0 4px;vertical-align:baseline;animation:entrar .2s ease-out}

EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Vidas",titulo:"Andy Warhol",itens:[{"t": "ler", "rot": "Abre", "titulo": "Andy Warhol", "html": "<figure class=\"vz-fig largo\"><img src=\"../../img/narrativas/vz-warhol-warhol-archie-1973.webp\" alt=\"Grande plano a preto e branco: Warhol, de óculos de aros claros e cabelo claro despenteado, encosta ao rosto um cão escuro de focinho comprido e olha de frente para a câmara.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 35%\"><figcaption>Warhol e o cão Archie, 1973. Jack Mitchell. <a href=\"https://commons.wikimedia.org/wiki/File:Andy_Warhol_by_Jack_Mitchell.jpg\" target=\"_blank\" rel=\"noopener\">CC BY-SA 4.0<\/a><\/figcaption><\/figure><p class=\"vz-gancho\">Em 1964, Warhol pôs na fachada de um pavilhão da Feira Mundial fotografias policiais dos treze homens mais procurados. Dias depois, a feira cobriu-as de tinta prateada.<\/p><p class=\"vz-perg\">Se usas a imagem de outra pessoa numa obra, o que é teu e o que é dela?<\/p><details class=\"lado\"><summary>Visionário<\/summary><div class=\"lado-c\"><p>Fotografou-se com a Polaroid durante décadas, em autorretratos que, para a fundação com o seu nome, «antecipam o fenómeno da selfie» (tradução nossa). A partir de 1974 guardou papéis e objetos do dia a dia em mais de 600 caixas, as <i>Time Capsules<\/i>; a fundação vê nesse impulso de guardar o efémero uma antecipação da vontade de registar a vida nas redes sociais.<\/p><\/div><\/details><details class=\"lado\"><summary>Controverso<\/summary><div class=\"lado-c\"><p>Na série <i>Death and Disasters<\/i> (1963-64) usou imagens de tragédias da imprensa sensacionalista. Em <i>The Philosophy of Andy Warhol<\/i> (1975), escreveu que ser bom no negócio é «a forma de arte mais fascinante» (tradução nossa); os retratos por encomenda deram-lhe obra e dinheiro. Em 2023, o Supremo Tribunal dos Estados Unidos deu razão à fotógrafa Lynn Goldsmith contra a fundação dele, num ponto do caso de um retrato de Prince.<\/p><\/div><\/details>"}, {"t": "ler", "rot": "Pittsburgh, 1928", "titulo": "Andrew Warhola, antes do nome", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-warhol-warhol-1947-carnegie.webp\" alt=\"Fotografia a preto e branco: um rapaz de óculos redondos e camisa branca, de cotovelos pousados numa mesa com livros abertos, apoia o queixo nas mãos e olha de frente para a câmara.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 45%\"><figcaption>Warhol estudante no Carnegie Institute of Technology, 1947. Autor desconhecido. <a href=\"https://commons.wikimedia.org/wiki/File:Andy-Warhol-1947.jpg\" target=\"_blank\" rel=\"noopener\">CC0, Smithsonian<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara no estudante de 1947. No texto, procura de que vivia antes das galerias.<\/p><p>Nasceu em 1928, filho de imigrantes da atual Eslováquia. Em 1949 foi para Nova Iorque ser ilustrador comercial: em poucos dias desenhava sapatos para a <i>Glamour<\/i> e, em 1952, ganhou o primeiro de muitos prémios da profissão. No fim dos anos 1950, vários galeristas recusavam os seus desenhos.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>Nasceu a 6 de agosto de 1928 em Pittsburgh, na Pensilvânia, o mais novo dos três filhos de Andrej Warhola e Julia Zavacky Warhola, imigrantes da região que hoje é a Eslováquia, instalados no bairro operário de Uptown. Em criança, uma doença do sistema nervoso deixou-o meses em casa; a mãe deu-lhe material de desenho, banda desenhada e revistas de cinema. Frequentou aulas de arte gratuitas no Carnegie Museum e foi o primeiro da família a ir para a universidade.<\/p><p>Em 1949 licenciou-se em Design Pictórico no Carnegie Institute of Technology, hoje Carnegie Mellon University. Em Nova Iorque, os sapatos de senhora para a <i>Glamour<\/i> foram o começo; o prémio de 1952 foi o primeiro de muitos. Teve como clientes a Tiffany &amp; Co., o <i>New York Times<\/i>, a Columbia Records e a NBC. No fim dos anos 1950 começou a colecionar obras de Jasper Johns e Frank Stella.<\/p><p>A 3 de junho de 1968, Valerie Solanas, uma escritora que tinha entrado no filme <i>I, a Man<\/i>, entrou no ateliê e disparou sobre ele, zangada por causa de um guião que julgava que ele lhe tinha roubado. Warhol recuperou e, no ano seguinte, cofundou a revista <i>Interview<\/i>, dedicada ao cinema, à moda e à cultura popular, que ainda hoje se publica. Morreu em Nova Iorque a 22 de fevereiro de 1987, aos 58 anos, por complicações depois de uma operação à vesícula biliar. Milhares de pessoas foram à missa na Catedral de São Patrício.<\/p><p>Antes das galerias vieram as encomendas: foi um ilustrador premiado antes de ser pintor, e nunca deixou o trabalho comercial.<\/p><p class=\"quem\">Fontes: <a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, biografia<\/a>, <a href=\"https://warholfoundation.org/warhol/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation<\/a>.<\/p><\/div><\/details>"}, {"t": "vf", "rot": "Verificar o começo", "p": "Warhol começou como pintor de galerias e só depois de famoso aceitou trabalho comercial.", "v": false, "f": "Falso. Foi ao contrário: em 1949 foi para Nova Iorque ser ilustrador comercial, ganhou prémios da profissão e, no fim dos anos 1950, vários galeristas ainda recusavam os seus desenhos. As galerias vieram depois das encomendas.", "fe": "Engana porque hoje o conhecemos como pintor famoso. Mas o texto põe primeiro os sapatos para a _Glamour_ e o prémio de ilustrador, e só depois as galerias, que começaram por o recusar."}, {"t": "ler", "rot": "Uma vida em seis datas", "titulo": "Uma vida em seis datas", "html": "<figure class=\"desenho lt\"><svg viewBox=\"0 0 342 168\" role=\"img\" aria-label=\"Linha do tempo\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M14 84H328\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><circle cx=\"14.0\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M14.0 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"14.0\" y=\"62\" text-anchor=\"start\" class=\"lt-ano\">1928<\/text><circle cx=\"76.8\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M76.8 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"76.8\" y=\"114\" text-anchor=\"middle\" class=\"lt-ano\">1949<\/text><circle cx=\"139.6\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M139.6 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"139.6\" y=\"62\" text-anchor=\"middle\" class=\"lt-ano\">1962<\/text><circle cx=\"202.4\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M202.4 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"202.4\" y=\"114\" text-anchor=\"middle\" class=\"lt-ano\">1963<\/text><circle cx=\"265.2\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M265.2 84V70\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"265.2\" y=\"62\" text-anchor=\"middle\" class=\"lt-ano\">1987<\/text><circle cx=\"328.0\" cy=\"84\" r=\"4\" fill=\"currentColor\"/><path d=\"M328.0 84V98\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><text x=\"328.0\" y=\"114\" text-anchor=\"end\" class=\"lt-ano\">2023<\/text><\/svg><\/figure><ol class=\"lt-lista\"><li><b>1928<\/b> nasce Andrew Warhola, em Pittsburgh<\/li><li><b>1949<\/b> vai para Nova Iorque ser ilustrador<\/li><li><b>1962<\/b> pinta à mão 32 latas de sopa<\/li><li><b>1963<\/b> muda o ateliê para a Factory, toda prateada<\/li><li><b>1987<\/b> morre em Nova Iorque, aos 58 anos<\/li><li><b>2023<\/b> o Supremo Tribunal decide o caso Goldsmith<\/li><\/ol>", "linha": true}, {"t": "ler", "rot": "Los Angeles, 1962", "titulo": "Trinta e duas latas, trinta e dois retratos", "html": "<p class=\"ex-antes\"><b>Antes de ler.<\/b> Procura o que Warhol fazia à mão para parecer feito à máquina.<\/p><p>Em 1962, para uma exposição em Los Angeles, Warhol pintou à mão 32 latas de sopa, uma por variedade, para parecerem feitas em série, e chamou-lhes «retratos». Depois passou a imprimir: a serigrafia.<\/p><div class=\"ju-video\" data-yt=\"jNM04-mhMgo\" data-titulo=\"A técnica da serigrafia, The Andy Warhol Museum\" data-t=\"A técnica da serigrafia\" data-m=\"The Andy Warhol Museum, em inglês\" data-dur=\"6 min\"><p class=\"ju-t\">A técnica da serigrafia<\/p><p class=\"ju-m\">The Andy Warhol Museum, em inglês<\/p><button type=\"button\">Ver o vídeo <span>(6 min)<\/span><\/button><\/div><p class=\"ju-yt\"><a href=\"https://www.youtube.com/watch?v=jNM04-mhMgo\" target=\"_blank\" rel=\"noopener\">Ver no YouTube<\/a><\/p><p class=\"ex-depois\"><b>Depois de ver.<\/b> O que faz a mão, e o que repete a malha?<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>O galerista era Irving Blum, da Ferus Gallery, que viu as pinturas de latas de sopa numa visita ao ateliê e ofereceu logo a Warhol uma exposição individual. As 32 telas chamam-se <i>Campbell's Soup Cans<\/i>. Para o museu de Pittsburgh, foram estas latas que o lançaram como celebridade. No mesmo ano começou uma série de retratos de celebridades, com Marilyn Monroe, Elvis Presley e Elizabeth Taylor; a <i>Marilyn Diptych<\/i>, comprada pela Tate em 1980, é de 1962, o ano em que a atriz morreu.<\/p><p>A serigrafia fotográfica deu-lhe um estilo: uma imagem granulada a preto, impressa vezes sem conta em séries, grelhas ou filas, sobre tela pintada de cores fortes. Em 1963 mudou o ateliê para um loft na East 47th Street, numa antiga fábrica de chapéus; chamou-lhe Factory e cobriu de prateado todas as superfícies. Em 1964, na Stable Gallery, em Nova Iorque, encheu a sala de <i>Brillo Boxes<\/i> serigrafadas, como num armazém de mercearia: houve filas para entrar, mas quase nada se vendeu. Segundo um ensaio da Al Jazeera, foi diante dessas caixas que o filósofo Arthur Danto se perguntou o que as distinguia das do supermercado; criou o termo «artworld», o mundo da arte, «uma atmosfera de teoria da arte» (tradução nossa). No Laboratório de Narrativas, <a href=\"https://pedrohfernandes-klk.github.io/lente/narrativas/duchamp/\" target=\"_blank\" rel=\"noopener\">o dossier Duchamp<\/a> liga estas caixas à <i>Fountain<\/i> (1917).<\/p><p>Entre 1963 e 1968 produziu quase 650 filmes: centenas de <i>Screen Tests<\/i>, retratos filmados de quatro minutos, e dezenas de longas-metragens. Entre os títulos estão <i>Empire<\/i> (1964), um único plano de cerca de oito horas, sem som, e <i>The Chelsea Girls<\/i> (1966), que a fundação considera um precursor da televisão de realidade.<\/p><p>Pintar à mão para parecer feito à máquina: em Warhol, a repetição é uma escolha, não um acidente.<\/p><p class=\"quem\">Fontes: <a href=\"https://warholfoundation.org/warhol/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation<\/a>, <a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum<\/a>, <a href=\"https://www.tate.org.uk/art/artworks/warhol-marilyn-diptych-t03093\" target=\"_blank\" rel=\"noopener\">Tate<\/a>, <a href=\"https://www.aljazeera.com/opinions/2013/10/30/danto-and-the-end-of-art\" target=\"_blank\" rel=\"noopener\">Al Jazeera<\/a>, <a href=\"https://plato.stanford.edu/entries/art-definition/\" target=\"_blank\" rel=\"noopener\">Stanford Encyclopedia of Philosophy<\/a>, <a href=\"https://whitney.org/research/andy-warhol-film-project\" target=\"_blank\" rel=\"noopener\">Whitney Museum<\/a>.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "A razão", "p": "Porque pintou Warhol à mão 32 latas quase iguais?", "o": ["Para imitar a uniformidade da produção em série.", "Porque ainda não havia máquinas que imprimissem imagens.", "Para mostrar que cada lata era diferente das do supermercado.", "Porque a galeria de Los Angeles só expunha pintura à mão."], "c": 0, "f": "O texto diz que as pintou à mão «para parecerem feitas em série». A repetição não foi um acidente da técnica: foi uma escolha, antes de a serigrafia lhe dar uma máquina de verdade.", "fe": ["", "A serigrafia, que usou depois, já existia para uso comercial: havia maneiras de imprimir imagens. Pintou à mão por escolha, para que as latas parecessem saídas de uma fábrica.", "Era o contrário: queria que parecessem iguais, feitas em série. De tela para tela, só mudava a variedade da sopa.", "O texto não diz que a galeria impusesse a técnica: foi Warhol quem decidiu pintar as latas como se fossem impressas."]}, {"t": "ler", "rot": "Conceito", "titulo": "O que é uma serigrafia?", "html": "<div class=\"cc\" data-cc><div class=\"cc-passo cc-caso\"><p class=\"cc-r\">O caso<\/p><p><svg viewBox=\"0 0 342 126\" role=\"img\" aria-label=\"Desenho: um quadro de malha com uma estrela aberta e um rodo por cima; ao lado, quatro impressões da mesma estrela, cada uma diferente\" xmlns=\"http://www.w3.org/2000/svg\" style=\"display:block;width:100%;height:auto;max-height:150px;margin:0 0 10px;color:var(--tinta)\"><path d=\"M22.0 38.0L28.0 32.0M22.0 44.0L34.0 32.0M22.0 50.0L40.0 32.0M22.0 56.0L46.0 32.0M22.0 62.0L52.0 32.0M22.0 68.0L58.0 32.0M22.0 74.0L64.0 32.0M22.0 80.0L70.0 32.0M22.0 86.0L76.0 32.0M22.0 92.0L82.0 32.0M22.0 98.0L88.0 32.0M24.0 102.0L94.0 32.0M30.0 102.0L100.0 32.0M36.0 102.0L106.0 32.0M42.0 102.0L112.0 32.0M48.0 102.0L118.0 32.0M54.0 102.0L124.0 32.0M60.0 102.0L126.0 36.0M66.0 102.0L126.0 42.0M72.0 102.0L126.0 48.0M78.0 102.0L126.0 54.0M84.0 102.0L126.0 60.0M90.0 102.0L126.0 66.0M96.0 102.0L126.0 72.0M102.0 102.0L126.0 78.0M108.0 102.0L126.0 84.0M114.0 102.0L126.0 90.0M120.0 102.0L126.0 96.0\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"0.7\"/><path d=\"M74.0 43.0L79.9 58.8L96.8 59.6L83.6 70.1L88.1 86.4L rect x=\"176\" y=\"70\" width=\"74\" height=\"52\" fill=\"currentColor\"/><path d=\"M213.0 81.0L216.7 90.9L227.3 91.4L219.0 97.9L221.8 108.1L213.0 102.3L204.2 108.1L207.0 97.9L198.7 91.4L209.3 90.9Z\" style=\"fill:var(--papel,#fff)\" stroke=\"currentColor\" stroke-width=\"1.2\"/><rect x=\"176\" y=\"70\" width=\"74\" height=\"52\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><path d=\"M295.0 81.0L298.7 90.9L309.3 91.4L301.0 97.9L303.8 108.1L295.0 102.3L286.2 108.1L289.0 97.9L280.7 91.4L291.3 90.9Z\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/><path d=\"M301.0 85.0L304.7 94.9L315.3 95.4L307.0 101.9L309.8 112.1L301.0 106.3L292.2 112.1L295.0 101.9L286.7 95.4L297.3 94.9Z\" fill=\"currentColor\"/><rect x=\"258\" y=\"70\" width=\"74\" height=\"52\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><\/svg>Em 1962, Warhol pintava à mão para parecer impresso. Depois passou a imprimir de verdade.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">Mais perto<\/p><p>Repara no quadro: a tinta só passa onde <mark>a malha ficou aberta<\/mark>. Cada passagem pode levar outra cor.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O nome<\/p><p class=\"cc-termo\">Serigrafia<\/p><p class=\"cc-def\">Impressão em que a tinta atravessa uma malha aberta na forma da imagem, para a repetir.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O que não é<\/p><p>Não é uma fotocópia: em cada passagem, a cor ou o lugar da imagem podem mudar.<\/p><\/div><button type=\"button\" class=\"cc-mais\" data-cc-mais>Mais perto <span aria-hidden=\"true\">→<\/span><\/button><\/div><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A fundação chama à serigrafia fotográfica de Warhol uma rutura que legitimou o método comercial na arte. O museu lembra que o processo foi inventado para uso comercial e que permitia a Warhol produzir imagens em série «como uma máquina» (tradução nossa de <i lang=\"en\">«in a machine-like fashion»<\/i>). No canal da Tate, em inglês, uma oficina mostra o processo: <a href=\"https://www.youtube.com/watch?v=O8HB2cQm_Ag\" target=\"_blank\" rel=\"noopener\">«How to Print Like Warhol»<\/a>.<\/p><p class=\"quem\">Fontes: <a href=\"https://warholfoundation.org/warhol/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation<\/a>, <a href=\"https://www.youtube.com/watch?v=jNM04-mhMgo\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, descrição do vídeo da serigrafia<\/a>, <a href=\"https://www.youtube.com/watch?v=O8HB2cQm_Ag\" target=\"_blank\" rel=\"noopener\">Tate<\/a>.<\/p><\/div><\/details>"}, {"t": "emparelhar", "rot": "Caso novo: é serigrafia?", "p": "Põe cada caso na coluna certa.", "pares": [["Vinte t-shirts com o mesmo emblema, de tinta passada por um tecido fino esticado", "É serigrafia"], ["As 32 latas de sopa de 1962", "Não é serigrafia"], ["Um cartaz tirado numa fotocopiadora", "Não é serigrafia"], ["Uma estrela impressa três vezes pelo mesmo quadro, com três cores", "É serigrafia"]], "f": "Serigrafia é tinta que atravessa uma malha aberta na forma da imagem: o tecido esticado das t-shirts e o quadro da estrela são malhas. As latas de 1962 enganam: foram pintadas à mão, para parecerem impressas. A fotocópia repete, mas sem malha nem tinta passada.", "fe": "Pergunta a cada caso: a tinta passou por uma malha aberta na forma da imagem? Se foi pincel ou fotocopiadora, não é serigrafia."}, {"t": "ler", "rot": "Nova Iorque, 1963", "titulo": "Quero ser uma máquina", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-warhol-warhol-polaroid-casa-branca-1975.webp\" alt=\"Fotografia a preto e branco numa varanda com flores: à direita, Warhol, de óculos e casaco escuro, segura junto à cara uma máquina Polaroid de onde sai uma fotografia; ao centro, Bianca Jagger, de chapéu, sorri; à esquerda, Jack Ford ri-se.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:70% 40%\"><figcaption>Warhol tira uma Polaroid, Casa Branca, 1975. Fotógrafo da Casa Branca. <a href=\"https://commons.wikimedia.org/wiki/File:Photograph_of_Andy_Warhol_Taking_a_Polaroid_Picture_while_Sitting_with_Jack_Ford_and_Bianca_Jagger_on_the_Truman_Balcony_-_NARA_-_7347182.jpg\" target=\"_blank\" rel=\"noopener\">Domínio público, NARA<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara no que Warhol tem nas mãos. No texto, separa o que ele diz do que diz a fundação.<\/p><p>Em 1963, Warhol disse à <i>ARTnews<\/i>: «quero ser uma máquina» (tradução nossa). Na Factory, os ajudantes serigrafavam dezenas de caixas e retratos, como numa linha de montagem. Mas a fundação lembra que cada tela era única, fruto de decisões de composição, formato e cor.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A fundação é a Andy Warhol Foundation for the Visual Arts, que tem o nome dele. Quem decide, então: a máquina ou quem a põe a trabalhar?<\/p><p>Na série <i>Death and Disasters<\/i> (1963-64), Warhol usou imagens de tragédias tiradas de jornais e revistas sensacionalistas; para a fundação, essas pinturas ampliavam a normalização da tragédia pelos media. À <i>ARTnews<\/i>, em 1963, disse também: «Quando vês uma imagem horrível vezes sem conta, ela deixa de fazer efeito» (tradução nossa). O mural da Feira Mundial, coberto de prateado em 1964, partia de fotografias da polícia.<\/p><p>Em 1966, ao jornal <i>The East Village Other<\/i>: «Se queres saber tudo sobre Andy Warhol, olha só para a superfície das minhas pinturas e dos meus filmes e para mim, e aí estou eu. Não há nada por trás» (tradução nossa). A fundação diz que criou um novo tipo de artista, que juntou a arte e a vida e tratou a própria persona como terreno de experiência. Fotografou-se a si próprio com a Polaroid durante décadas, gravou cerca de 4000 horas de conversas e, a partir de 1974, encheu mais de 600 caixas de cartão com papéis e objetos do dia a dia, as <i>Time Capsules<\/i>. Comparava tirar fotografias a manter um diário visual. No canal do museu, um vídeo de três minutos, em inglês, mostra como se faz uma: <a href=\"https://www.youtube.com/watch?v=iRVAo2ewG9g\" target=\"_blank\" rel=\"noopener\">«Warhol's Time Capsules (Adapted for home use)»<\/a>. A porta <a href=\"https://pedrohfernandes-klk.github.io/lente/vozes/arte-e-vida/\" target=\"_blank\" rel=\"noopener\">«A arte e a vida»<\/a>, nestas vozes, conta a vida dele nestas caixas.<\/p><p>Quem diz que não há nada por trás está a dizer-te onde olhar: para a superfície, para a repetição, para a máquina.<\/p><p class=\"quem\">Fontes: <a href=\"https://warholfoundation.org/warhol/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation<\/a>, <a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum<\/a>, <a href=\"https://www.warhol.org/exhibition/13-most-wanted-men-andy-warhol-and-the-1964-worlds-fair/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, a Feira Mundial de 1964<\/a>.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "A máquina", "p": "Warhol queria «ser uma máquina»; a fundação diz que cada tela era única. O que sustentam os factos?", "o": ["Imitava a máquina por escolha: composição, formato e cor eram decisões dele.", "As telas saíam todas iguais, porque a serigrafia repete a imagem sem mudança.", "Deixou de decidir e limitava-se a assinar o que os ajudantes faziam.", "Nunca pintou à mão: tudo o que fez saiu de uma prensa de serigrafia."], "c": 0, "f": "Se cada tela era única, alguém escolhia: a fundação diz que a composição, o formato e a cor eram decisões de Warhol, tela a tela. Querer ser uma máquina era uma maneira de trabalhar, escolhida por uma pessoa.", "fe": ["", "A serigrafia repete a imagem, mas a fundação diz que cada tela era única: a composição, o formato e a cor mudavam de tela para tela.", "Os ajudantes serigrafavam, mas as decisões de composição, formato e cor continuavam a ser de Warhol. Se as telas saem únicas, alguém decidiu.", "As 32 latas de 1962 foram pintadas à mão, precisamente para imitar a produção em série. A máquina veio depois, e por escolha."]}, {"t": "emparelhar", "rot": "Facto ou juízo", "p": "Cada frase é um facto, que se prova com um documento, ou um juízo de alguém?", "pares": [["Em 1975, Warhol usou uma Polaroid na Casa Branca.", "Facto"], ["Na Factory, os ajudantes serigrafavam caixas e retratos.", "Facto"], ["Os autorretratos de Warhol com a Polaroid antecipam a selfie.", "Juízo"], ["Warhol criou um novo tipo de artista.", "Juízo"]], "f": "A fotografia de 1975 prova a primeira frase; a fundação descreve a Factory como um facto. Mas «antecipam a selfie» e «um novo tipo de artista» são leituras da fundação com o nome dele, feitas muito depois: juízos, com autor.", "fe": "Pergunta a cada frase: podia ser fotografada ou registada num documento? Ou é a leitura de alguém sobre o que aquilo significa?"}, {"t": "ler", "rot": "Washington, 2023", "titulo": "Uma fotografia, quatro usos", "html": "<p class=\"ex-antes\"><b>Antes de ler.<\/b> No desenho, segue a fotografia de Goldsmith e repara para que serve em cada passo.<\/p><figure class=\"desenho\"><svg viewBox=\"0 0 342 100\" role=\"img\" aria-label=\"A cadeia do caso: a fotografia de Goldsmith em 1981, a ilustração para uma revista em 1984, as 16 obras de Warhol, a capa de revista em 2016 e o Supremo Tribunal em 2023\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M25 58H84M78 54L84 58L78 62\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><path d=\"M102 58H162M156 54L162 58L156 62\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><path d=\"M180 58H240M234 54L240 58L234 62\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><path d=\"M258 58H317M311 54L317 58L311 62\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.6\"/><circle cx=\"16\" cy=\"58\" r=\"5\" fill=\"currentColor\"/><text x=\"10\" y=\"40\" text-anchor=\"start\" font-family=\"Bebas Neue,Arial,sans-serif\" font-size=\"18\" fill=\"currentColor\">1981<\/text><text x=\"10\" y=\"86\" text-anchor=\"start\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12.5\" font-weight=\"400\" fill=\"currentColor\">fotografia<\/text><rect x=\"87\" y=\"52\" width=\"12\" height=\"12\" fill=\"currentColor\"/><text x=\"93\" y=\"40\" text-anchor=\"middle\" font-family=\"Bebas Neue,Arial,sans-serif\" font-size=\"18\" fill=\"currentColor\">1984<\/text><text x=\"93\" y=\"86\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"currentColor\">revista<\/text><circle cx=\"171\" cy=\"58\" r=\"5\" fill=\"currentColor\"/><text x=\"171\" y=\"86\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12.5\" font-weight=\"400\" fill=\"currentColor\">16 obras<\/text><rect x=\"243\" y=\"52\" width=\"12\" height=\"12\" fill=\"currentColor\"/><text x=\"249\" y=\"40\" text-anchor=\"middle\" font-family=\"Bebas Neue,Arial,sans-serif\" font-size=\"18\" fill=\"currentColor\">2016<\/text><text x=\"249\" y=\"86\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12.5\" font-weight=\"700\" fill=\"currentColor\">revista<\/text><circle cx=\"326\" cy=\"58\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\"/><text x=\"332\" y=\"40\" text-anchor=\"end\" font-family=\"Bebas Neue,Arial,sans-serif\" font-size=\"18\" fill=\"currentColor\">2023<\/text><text x=\"332\" y=\"86\" text-anchor=\"end\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"12.5\" font-weight=\"400\" fill=\"currentColor\">tribunal<\/text><\/svg><\/figure><p>Em 1984, a <i>Vanity Fair<\/i> publicou um retrato de Prince por Warhol, feito de uma fotografia de Lynn Goldsmith, que recebeu 400 dólares por um só uso. Dessa fotografia, Warhol fez 16 obras. Em 2023, o Supremo Tribunal julgou uma licença de 2016 para uma capa, não a criação das obras.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>Em 1981, a fotógrafa Lynn Goldsmith fotografou o músico Prince por encomenda da <i>Newsweek<\/i>. Anos depois, deu à <i>Vanity Fair<\/i> uma licença limitada, para uma só vez, para usar uma fotografia como referência de uma ilustração. A revista contratou Warhol, que fez um retrato de Prince em serigrafia roxa, publicado em novembro de 1984; Goldsmith recebeu 400 dólares e o crédito. A partir da mesma fotografia, Warhol fez 16 obras, hoje chamadas <i>Prince Series<\/i>.<\/p><p>Em 2016, depois da morte de Prince, a fundação licenciou à Condé Nast, por 10 000 dólares, a imagem <i>Orange Prince<\/i> para a capa de uma revista. Só então Goldsmith descobriu a série e acusou a fundação de violar os seus direitos; a fundação foi a tribunal. A 18 de maio de 2023, o Supremo Tribunal dos Estados Unidos decidiu, por 7 votos contra 2, que o primeiro critério do «uso justo», o propósito e o carácter do uso, não favorecia a fundação nessa licença: a fotografia e a serigrafia serviam o mesmo fim, retratar Prince numa revista, e o uso era comercial. O tribunal disse que não se pronunciava sobre a criação, a exposição ou a venda das obras da série.<\/p><p>A juíza Sonia Sotomayor escreveu pela maioria; a juíza Elena Kagan, o voto de vencido, com o presidente do tribunal, John Roberts. Fazer uma obra e licenciá-la para o mesmo fim da fotografia de partida são coisas diferentes: em 2023, o tribunal julgou só a segunda.<\/p><p class=\"quem\">Fontes: <a href=\"https://www.supremecourt.gov/opinions/22pdf/21-869_87ad.pdf\" target=\"_blank\" rel=\"noopener\">Supremo Tribunal dos Estados Unidos, Andy Warhol Foundation v. Goldsmith (2023)<\/a>.<\/p><\/div><\/details>"}, {"t": "vf", "rot": "O que se julgou", "p": "Em 2023, o Supremo Tribunal decidiu que Warhol não podia ter criado os retratos de Prince.", "v": false, "f": "Falso. O tribunal julgou só a licença de 2016 para uma capa e disse que não se pronunciava sobre a criação, a exposição ou a venda das 16 obras. Lê sempre o que um tribunal diz que não decidiu.", "fe": "Engana porque o caso tem o nome de Warhol. Mas o que se julgou foi um uso de 2016, uma licença para uma capa, e não o gesto de criar a série a partir da fotografia."}, {"t": "ler", "rot": "Conceito", "titulo": "O que é o «uso justo»?", "html": "<div class=\"cc\" data-cc><div class=\"cc-passo cc-caso\"><p class=\"cc-r\">O caso<\/p><p>A fundação licenciou para uma capa o retrato que Warhol fez da fotografia de Goldsmith.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">Mais perto<\/p><p>O tribunal julgou <mark>para que servia esse uso<\/mark>: o mesmo da fotografia, e comercial.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O nome<\/p><p class=\"cc-termo\">Uso justo<\/p><p class=\"cc-def\">Regra americana: em certos casos, conforme vários critérios, pode usar-se obra alheia sem autorização.<\/p><\/div><div class=\"cc-passo\" hidden><p class=\"cc-r\">O que não é<\/p><p>Não é uma licença, em que o dono autoriza e recebe, como Goldsmith da <i>Vanity Fair<\/i>; no uso justo, ninguém pede licença.<\/p><\/div><button type=\"button\" class=\"cc-mais\" data-cc-mais>Mais perto <span aria-hidden=\"true\">→<\/span><\/button><\/div><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>Em 2023, o tribunal analisou só o primeiro critério do uso justo, «o propósito e o carácter do uso», e só para a licença de 2016. Disse que a fotografia e a capa serviam o mesmo fim, retratar Prince numa revista, e que o uso era comercial; e que não se pronunciava sobre a criação, a exposição ou a venda das obras da série.<\/p><p class=\"quem\">Fontes: <a href=\"https://www.supremecourt.gov/opinions/22pdf/21-869_87ad.pdf\" target=\"_blank\" rel=\"noopener\">Supremo Tribunal dos Estados Unidos (2023)<\/a>.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Caso imaginário", "p": "A Rita põe num cartaz pago uma fotografia tirada por um colega. Pelo critério de 2023, que se pergunta primeiro?", "o": ["Se o cartaz tem o mesmo fim da fotografia e se dá lucro.", "Se o cartaz ficou mais bonito do que a fotografia do colega.", "Se a Rita mudou as cores e recortou a fotografia.", "Se o colega já tinha posto a fotografia nas redes sociais."], "c": 0, "f": "Pelo critério de 2023, pergunta-se primeiro para que serve o uso: se tem o mesmo fim da fotografia e se é comercial. Retocar não basta, nem a fotografia estar na internet. E a Rita pode fazer o mais simples: pedir autorização ao colega.", "fe": ["", "O tribunal não julgou a beleza: julgou para que servia o uso. Um cartaz bonito com o mesmo fim da fotografia levanta a mesma pergunta.", "Warhol transformou a fotografia numa serigrafia, e não chegou: a capa de 2016 servia o mesmo fim da fotografia. O critério é o propósito, não o retoque.", "Estar nas redes não torna a fotografia livre. O que se pergunta é para que serve o uso da imagem e se tem fim comercial."]}, {"t": "ler", "rot": "Estocolmo, 1968", "titulo": "Quinze minutos que não acabam", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-warhol-warhol-autografos-1970.webp\" alt=\"Fotografia a preto e branco, muito escura: no meio de uma multidão apertada, Warhol, de casaco de cabedal, escreve com uma caneta no braço de alguém; à volta, rostos de perfil e luzes no teto.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 45%\"><figcaption>Warhol dá autógrafos, Pasadena, 1970. Los Angeles Times. <a href=\"https://commons.wikimedia.org/wiki/File:Andy_Warhol_signing_autographs.jpg\" target=\"_blank\" rel=\"noopener\">CC BY 4.0<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Repara na multidão. No texto, procura o documento e a data de cada versão da frase.<\/p><p>Em outubro de 1967, a <i>Time<\/i> escreveu que Warhol previa que todos seriam famosos durante 15 minutos. A frase direta aparece em 1968, no catálogo de uma exposição dele em Estocolmo. Mas, em julho de 1967, um livro dava a Larry Rivers a ideia de que todos seriam famosos.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>A frase do catálogo do Moderna Museet, de 1968: «No futuro toda a gente será mundialmente famosa durante quinze minutos» (tradução nossa). O livro de julho de 1967 atribuía a Larry Rivers a ideia de que toda a gente seria famosa, segundo o Quote Investigator. Em 1979, em <i>Andy Warhol's Exposures<\/i>, Warhol propôs outra versão: «Daqui a quinze minutos toda a gente será famosa» (tradução nossa). Nos anos 1980 deu o nome <i>Andy Warhol's Fifteen Minutes<\/i> a um programa seu na MTV. No canal da Tate, em inglês, um vídeo de dois minutos liga esta fama às redes sociais: <a href=\"https://www.youtube.com/watch?v=TpDeSsWOyTM\" target=\"_blank\" rel=\"noopener\">«Andy Warhol: Celebrity, Social Media and Overexposure»<\/a>.<\/p><p>O que fica? No testamento, Warhol pediu uma fundação para o avanço das artes visuais e deixou-lhe quase todos os seus bens: nasceu em 1987 a Andy Warhol Foundation for the Visual Arts, dona dos direitos das obras que ele fez em vida. Já deu mais de 260 milhões de dólares em subsídios a mais de mil organizações artísticas e doou 52 786 obras a 322 instituições. Em 1989 cofundou, com a Dia Art Foundation e os Carnegie Museums, o Andy Warhol Museum, que abriu em Pittsburgh em 1994. Em 2022, a <i>Shot Sage Blue Marilyn<\/i> foi vendida em leilão por 195 milhões de dólares, com taxas: o preço mais alto de sempre em leilão para uma obra americana.<\/p><p>Sobre a própria campa, numa frase citada pelo museu, disse que gostaria que ficasse em branco, «sem epitáfio e sem nome» (tradução nossa), ou com a palavra «figment», ficção. A 6 de agosto de 2013, o museu pôs sobre ela uma câmara em direto e chamou ao projeto <i>Figment<\/i>.<\/p><p>Uma frase famosa precisa de documento, data e de quem a diz; até a frase sobre a fama.<\/p><p class=\"quem\">Fontes: <a href=\"https://quoteinvestigator.com/2012/04/04/famous-15-minutes/\" target=\"_blank\" rel=\"noopener\">Quote Investigator<\/a>, <a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum<\/a>, <a href=\"https://warholfoundation.org/foundation/history/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation, história<\/a>, <a href=\"https://warholfoundation.org/about/faq/\" target=\"_blank\" rel=\"noopener\">Andy Warhol Foundation, perguntas frequentes<\/a>, <a href=\"https://www.npr.org/2022/05/09/1096617152/a-warhol-marilyn-brings-a-record-auction-price-195-million\" target=\"_blank\" rel=\"noopener\">NPR<\/a>, <a href=\"https://www.warhol.org/figment-virality-and-the-real-world/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, Figment<\/a>.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "A prova", "p": "Que facto aconselha cuidado antes de dizeres que a frase dos quinze minutos é de Warhol?", "o": ["Em julho de 1967, um livro dava a Larry Rivers a ideia de que todos seriam famosos.", "Nos anos 1980, Warhol deu o nome _Andy Warhol's Fifteen Minutes_ a um programa seu.", "Em 1979, em _Andy Warhol's Exposures_, voltou à frase e propôs outra versão.", "Ao longo da vida, Warhol gravou cerca de 4000 horas de conversas."], "c": 0, "f": "Uma citação precisa de documento, data e de quem a diz. Há um discurso indireto na _Time_ (outubro de 1967), a frase direta num catálogo (1968) e, antes de ambos, um livro que dava a ideia a outra pessoa. Por isso a autoria é discutida.", "fe": ["", "Dar o nome a um programa mostra que Warhol adotou a frase, não que a disse primeiro. A dúvida nasce do livro de julho de 1967.", "A versão de 1979 mostra que Warhol voltou à frase; não diz quem a disse primeiro. A dúvida nasce do livro de 1967.", "As gravações mostram que guardava conversas, não quem disse primeiro esta frase. A dúvida nasce do livro de julho de 1967."]}, {"t": "ler", "rot": "Porto, 2000", "titulo": "A Factory em Serralves", "html": "<figure class=\"vz-fig\"><img src=\"../../img/narrativas/vz-warhol-warhol-polavision-1978.webp\" alt=\"Fotografia: um homem de cabelo branco, casaco escuro de bombazina, camisa branca e gravata às riscas segura junto à cara uma câmara de filmar com duas lâmpadas por cima; a objetiva aponta para o lado e um dos olhos fica à vista. Atrás, as paredes de um canto.\" loading=\"lazy\" decoding=\"async\" style=\"object-position:50% 38%\"><figcaption>Warhol com uma câmara Polavision, 1978. Bernard Gotfryd. <a href=\"https://commons.wikimedia.org/wiki/File:Andy_Warhol_with_Polavision_1978.jpg\" target=\"_blank\" rel=\"noopener\">Domínio público, Library of Congress<\/a><\/figcaption><\/figure><p class=\"ex-antes\"><b>Antes de ler.<\/b> Warhol aponta uma câmara, mas é ele o fotografado. No texto, procura outro retrato dele e o que prova cada fonte.<\/p><p>Não se encontrou registo de nenhuma visita de Warhol a Portugal. Mas o CAM Gulbenkian guarda um retrato dele por Pepe Diniz, de 1975. Serralves mostrou <i>Andy Warhol: A Factory<\/i> em 2000. E a <i>Visão<\/i> mostrou, em 2025, uma <i>Brillo Box<\/i> no MAC/CCB.<\/p><details class=\"mais\"><summary>Ler mais<\/summary><div class=\"mais-c\"><p>Em 1975, o fotógrafo Pepe Diniz, nascido em Tânger em 1945, fotografou Warhol em Nova Iorque. A prova, de 26 × 33,7 cm, assinada, datada «75» e com o lugar «N.Y.», foi adquirida em 1980 e está no CAM, Centro de Arte Moderna Gulbenkian, em Lisboa; na mesma coleção há retratos de Amália Rodrigues, Eunice Muñoz e Cruzeiro Seixas pelo mesmo fotógrafo. Em julho de 1990, a Cinemateca Portuguesa dedicou-lhe um ciclo, com catálogo.<\/p><p>Entre fevereiro e 30 de abril de 2000, o Museu de Serralves mostrou <i>Andy Warhol: A Factory<\/i>, organizada pelo Solomon R. Guggenheim Museum de Nova Iorque com o Kunstmuseum Wolfsburg e comissariada por Germano Celant com Vivien Greene: a Nova Iorque das obras de Warhol e de todos os que conviveram com ele na Factory, entre 1963 e 1987. Em 2022, a Casa São Roque, no Porto, mostrou 68 fotografias dos anos 1970 e 1980 doadas pela fundação, pela primeira vez em Portugal e na Europa, em diálogo com obras encomendadas aos artistas portugueses Sara Graça e Pedro Magalhães e com fotografias de Augusto Alves da Silva.<\/p><p>Hoje, o MAC/CCB, em Lisboa, inclui Warhol entre os cerca de 160 artistas da exposição permanente <i>Uma deriva atlântica<\/i>. A reportagem da <i>Visão<\/i> de 2 de março de 2025 mostrou lá uma <i>Brillo Box<\/i> (1964/68), com <i>Pater<\/i>, de Basquiat, ao fundo, e <i>Ten Foot Flowers<\/i> (1967). Warhol e Basquiat pintaram juntos mais de 150 telas a quatro mãos: ver a voz <a href=\"https://pedrohfernandes-klk.github.io/lente/vozes/basquiat/\" target=\"_blank\" rel=\"noopener\">Jean-Michel Basquiat<\/a>. Uma reportagem prova o que estava exposto naquele dia: quem quiser ir ver deve confirmar antes no museu.<\/p><p>Nenhuma visita confirmada, mas um retrato dele num museu de Lisboa e uma Factory no Porto: a obra e a imagem de Warhol viajaram sem ele.<\/p><p class=\"quem\">Fontes: <a href=\"https://gulbenkian.pt/cam/works/andy-warhol-150332/\" target=\"_blank\" rel=\"noopener\">CAM Gulbenkian<\/a>, <a href=\"https://gulbenkian.pt/cam/artists/pepe-diniz/\" target=\"_blank\" rel=\"noopener\">CAM Gulbenkian, Pepe Diniz<\/a>, <a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!248034~!0\" target=\"_blank\" rel=\"noopener\">Biblioteca Nacional, catálogo da Cinemateca<\/a>, <a href=\"https://www.serralves.pt/arquivo-evento/andy-warhol-a-factory/\" target=\"_blank\" rel=\"noopener\">Serralves<\/a>, <a href=\"https://www.rtp.pt/noticias/cultura/casa-sao-roque-no-porto-mostra-andy-warhol-em-dialogo-com-outros-artistas_n1404700\" target=\"_blank\" rel=\"noopener\">RTP<\/a>, <a href=\"https://weissman.baruch.cuny.edu/mishkin-gallery/past/warhol-people-and-things-1972-2022/\" target=\"_blank\" rel=\"noopener\">Mishkin Gallery<\/a>, <a href=\"https://www.ccb.pt/evento/uma-deriva-atlantica-as-artes-do-seculo-xx-a-partir-da-colecao-berardo\" target=\"_blank\" rel=\"noopener\">CCB<\/a>, <a href=\"https://visao.pt/atualidade/cultura/2025-03-02-e-este-o-museu-de-que-lisboa-precisava/\" target=\"_blank\" rel=\"noopener\">Visão<\/a>.<\/p><\/div><\/details>"}, {"t": "escolha", "rot": "Verificar a fonte", "p": "Queres ir ver a _Brillo Box_ ao MAC/CCB. Que fonte te diz se ainda está exposta?", "o": ["A página do MAC/CCB, ou o próprio museu, que dizem o que está exposto hoje.", "A reportagem da _Visão_ de 2025, que mostrou a obra na sala do museu.", "O arquivo de Serralves, que guarda a exposição de Warhol de 2000.", "A coleção do CAM, que guarda um retrato de Warhol desde 1980."], "c": 0, "f": "Uma reportagem prova o que estava exposto no dia em que foi feita, não o que está hoje. Para saber o presente, a fonte é o próprio museu: confirma antes de ir.", "fe": ["", "A reportagem é uma boa prova de março de 2025, mas as exposições mudam. Prova o passado, não o dia em que lá vais.", "Serralves mostrou Warhol no Porto, em 2000. O arquivo prova essa exposição, não o que está hoje exposto em Lisboa.", "O CAM guarda uma fotografia de Warhol por Pepe Diniz, não a _Brillo Box_: é outra obra, noutro museu."]}, {"t": "ler", "rot": "Decide", "titulo": "De quem é o retrato?", "html": "<p>Em 2023, o Supremo Tribunal dos Estados Unidos decidiu, por 7 votos contra 2, que o primeiro critério do uso justo não favorecia a fundação de Warhol na licença de 2016. A juíza Sotomayor escreveu pela maioria; a juíza Kagan, o voto de vencido.<\/p><p class=\"q-pensa\">Pela capa de 2016, a fundação devia pagar a Goldsmith uma parte do que recebeu: sim ou não?<\/p><p class=\"nota-pensa\">Decide em silêncio. Só depois abre os lados.<\/p><details class=\"lado\"><summary>Sim: a razão da maioria<\/summary><div class=\"lado-c\"><p>A fotografia e a capa serviam o mesmo fim, retratar Prince numa revista, e o uso era comercial. Pagar a Goldsmith uma parte do lucro não empobrece o mundo. Aos receios do voto de vencido, a maioria respondeu: «estas afirmações não vão envelhecer bem» (tradução nossa de <i lang=\"en\">«These claims will not age well»<\/i>).<\/p><p class=\"quem\">A juíza Sonia Sotomayor, pela maioria.<\/p><\/div><\/details><details class=\"lado\"><summary>Não: a objeção do voto de vencido<\/summary><div class=\"lado-c\"><p>Para Kagan, a decisão vai «sufocar a criatividade de todo o tipo» (tradução nossa de <i lang=\"en\">«stifle creativity of every sort»<\/i>).<\/p><p>Uma razão possível (nossa, não do tribunal): Warhol fez muitas obras com imagens de outros, como o mural de 1964, e a serigrafia roxa já era outra imagem.<\/p><p class=\"quem\">A juíza Elena Kagan, com o presidente do tribunal, John Roberts.<\/p><\/div><\/details><details class=\"lado\"><summary>O que o tribunal não decidiu<\/summary><div class=\"lado-c\"><p>Disse que não se pronunciava sobre a criação, a exposição ou a venda das 16 obras: julgou só a licença de 2016.<\/p><p class=\"quem\">O tribunal, na decisão de 2023.<\/p><\/div><\/details><p class=\"fecho-o\">E se a fotografia de partida fosse tua?<\/p>"}, {"t": "emparelhar", "rot": "Quem diz o quê", "p": "Liga cada frase a quem a diz, ou ao que ficou por decidir.", "pares": [["«Estas afirmações não vão envelhecer bem.»", "A maioria"], ["A fotografia e a capa serviam o mesmo fim.", "A maioria"], ["Vai «sufocar a criatividade de todo o tipo».", "O voto de vencido"], ["Se Warhol podia criar e vender as 16 obras.", "Ficou por decidir"]], "f": "A maioria compara os fins: a fotografia e a capa serviam para o mesmo, e responde aos receios com «não vão envelhecer bem». O voto de vencido teme pela criatividade. E a criação das obras ficou de fora do que se julgou.", "fe": "Abre outra vez os lados: a maioria fala do fim do uso e responde aos receios; o voto de vencido fala da criatividade; o que ficou por decidir está no terceiro lado."}, {"t": "ler", "rot": "Para ligar", "titulo": "No Português e no Lente", "html": "<ul class=\"ligar\"><li><b><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f06/\">Português, Módulo 7: Da fábrica à «Tabacaria»<\/a><\/b>Em 1914, Álvaro de Campos quer «Ser completo como uma máquina!»; em 1963, Warhol quer «ser uma máquina» (tradução nossa). A mesma vontade, quase cinquenta anos depois, com outra temperatura.<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f02/\">Português, Módulo 7: O poeta é um fingidor<\/a><\/b>Em 1966, Warhol disse que bastava olhar para a superfície: «Não há nada por trás» (tradução nossa). Uma máscara que diz que não esconde nada, a conversar com o fingidor da «Autopsicografia».<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/pt/m9/licao-m9-f10/\">Português, Módulo 9: De quem é uma obra?<\/a><\/b>Os ajudantes da Factory e a fotografia de Goldsmith levam a pergunta do <i>Memorial do Convento<\/i>, quem faz a obra?, para a imagem de hoje.<\/li><li><b><a href=\"https://pedrohfernandes-klk.github.io/lente/narrativas/duchamp/\">Laboratório: Duchamp<\/a><\/b>As <i>Brillo Boxes<\/i> (1964) fazem a pergunta da <i>Fountain<\/i> (1917) com caixas de supermercado.<\/li><\/ul>"}, {"t": "ler", "rot": "Para levar", "escuro": true, "html": "<p class=\"levar\">Antes de dizeres que uma frase ou uma imagem é de alguém, procura o documento mais antigo, a data e quem a assina.<\/p><p>Warhol pintou à mão para parecer feito à máquina, fez obras com imagens de outros e deixou uma frase de autoria discutida. Em cada caso, a mesma pergunta: de quem é, e como se prova?<\/p><details class=\"mais\"><summary>No caderno, à escolha<\/summary><div class=\"mais-c\"><p>Trabalha em papel e diz sempre de onde vem cada facto. Não copies nem imprimas obras de Warhol: os direitos são da fundação. As imagens que usares são tuas.<\/p><p><b>Fanzine «A minha Factory»<\/b>, um A4 dobrado em oito páginas. Uma imagem tua, fotografia ou desenho teu e nunca uma obra de Warhol, repetida pelo menos seis vezes em grelha e alterada à mão de cada vez; junto de cada repetição, uma legenda curta diz o que mudou. Três factos sobre Warhol, cada um com a data e a fonte. Uma página final responde, em três frases, à pergunta: a máquina de Warhol era mesmo uma máquina?<\/p><p><b>Podcast «Quinze minutos»<\/b>, três minutos a duas vozes. Uma voz defende que a frase dos quinze minutos é de Warhol; a outra desconfia. Pelo menos três datas certas, com as fontes ditas em voz alta (<i>Time<\/i>, 1967; Estocolmo, 1968; <i>Andy Warhol's Exposures<\/i>, 1979). Cada voz diz uma prova e uma dúvida. A última frase é uma pergunta a quem ouve sobre a fama hoje, e o guião é entregue em papel.<\/p><\/div><\/details><details class=\"mais\"><summary>Fontes (27)<\/summary><div class=\"mais-c\"><ul><li><a href=\"https://www.warhol.org/andy-warhols-life/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, biografia<\/a><\/li><li><a href=\"https://www.warhol.org/exhibition/13-most-wanted-men-andy-warhol-and-the-1964-worlds-fair/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, 13 Most Wanted Men e a Feira Mundial de 1964<\/a><\/li><li><a href=\"https://www.warhol.org/figment-virality-and-the-real-world/\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, Figment (2013)<\/a><\/li><li><a href=\"https://www.youtube.com/watch?v=jNM04-mhMgo\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, «Andy Warhol&#x27;s Silkscreen Technique» (YouTube)<\/a><\/li><li><a href=\"https://www.youtube.com/watch?v=iRVAo2ewG9g\" target=\"_blank\" rel=\"noopener\">The Andy Warhol Museum, «Warhol&#x27;s Time Capsules (Adapted for home use)» (YouTube)<\/a><\/li><li><a href=\"https
