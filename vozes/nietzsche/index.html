/* casca «ecrã de aplicação» e Gestalt (11/10/2026, quatro perguntas e sete rondas de widget): um só cartão branco sobre papel,
   que enche o espaço entre o topo e a barra de ações e rola por dentro só quando é comprido; rótulo pequeno com a forma da fase
   (○ ler, □ responder, △ levar); três distâncias (8, 20, 40 px); Georgia para ler (textos, perguntas, correções), Arial para
   tocar e para os rótulos; a pergunta é o maior texto; opções de linha fina, a escolhida engrossa; acerto com um traço a tinta
   que se desenha, erro riscado a vermelho, nada abana; cores só preto, branco, mostarda (o conquistado) e vermelho (17/10/2026: o verde saiu) */
.jogo{display:flex;flex-direction:column;flex:1 0 auto;margin:var(--d1,8px) 0 var(--d1,8px);min-height:0}
.jogo .cartao{background:var(--papel);padding:var(--d2,20px);flex:0 0 auto;display:flex;flex-direction:column;position:relative;isolation:isolate;animation:cartaoEntra .2s ease-out both}

.jogo .rot{display:flex;align-items:center;gap:7px;font:700 .7rem/1.2 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin:0 0 var(--d2,20px)}
.jogo .rot .forma{width:12px;height:12px;flex:none;overflow:visible}.jogo .rot .forma *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}.jogo .rot.feito .forma *{fill:currentColor}
.jogo .tit{font:700 1.15rem/1.25 var(--serif,Georgia,serif);margin:0 0 var(--d1,8px)}
/* 16/10/2026: um traço curto desenha-se debaixo do título de cada cartão de leitura (nada com «reduzir movimento») */
.jogo .ler .tit{padding-bottom:5px;background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0 2px;animation:titTraco .8s cubic-bezier(.2,.7,.2,1) .3s forwards}@keyframes titTraco{to{background-size:2.6em 2px}}@media (prefers-reduced-motion:reduce){.jogo .ler .tit{animation:none;background-size:2.6em 2px}} /* 15/10/2026, acessibilidade: o título do cartão é um h2 (a página tem o h1 da casca), com o mesmo aspeto */
.jogo .tit.cartaz{font:400 2.2rem/1 var(--cartaz,"Arial Black",Arial);letter-spacing:.02em;margin:0 0 var(--d2,20px);padding-right:56px}
.jogo .cit{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.05em}
.jogo .ler{font-family:var(--serif,Georgia,serif);font-size:1.1rem;line-height:1.6}.jogo .ler p{margin:0 0 var(--d1,8px)}.jogo .ler .v{white-space:pre-wrap;margin:0 0 var(--d1,8px)}.jogo .ler .v .n{display:inline-block;width:2.1em;color:var(--suave);font:400 .72em Arial;text-align:right;padding-right:.6em}
.jogo .ler ol{margin:0;padding-left:1.3rem}.jogo .ler ul{margin:0 0 var(--d1,8px);padding-left:1.3rem;list-style:disc outside}.jogo .ler ul li{margin:0 0 4px}.jogo .ler li{margin:0 0 var(--d1,8px)}.jogo .ler .gl{font:400 .9rem/1.45 Arial;border-top:1px solid var(--tinta);margin-top:var(--d2,20px);padding-top:var(--d1,8px)}.jogo .ler .fonte{font:400 .82rem Arial;color:var(--suave);margin:var(--d1,8px) 0 0}
.jogo .ler .abre{font-size:1.25rem;line-height:1.45}.jogo .ler .levar{font-size:1.45rem;line-height:1.3;font-style:italic;margin:6px 0 10px}.jogo .ler .pergU{font-style:italic;color:var(--suave)}
.jogo .ver-fig{margin:0 0 12px;cursor:zoom-in}.jogo .ver-fig img{display:block;width:100%;height:auto;max-height:min(26vh,210px);max-height:min(26dvh,210px);object-fit:cover;object-position:50% 45%;border:1px solid var(--tinta);filter:grayscale(1)}.jogo .ver-fig.grande{cursor:zoom-out}.jogo .ver-fig.grande img{max-height:none;object-fit:contain}.jogo .ver-fig:focus-visible{outline:3px solid var(--vermelho,#c1272d);outline-offset:2px}.jogo .ler .fig{margin:0 0 var(--d2,20px)}.jogo .ler .fig img{display:block;max-width:100%;max-height:min(40vh,360px);max-height:min(40dvh,360px);width:auto;border:0;cursor:zoom-in}.jogo .ler .fig figcaption{font:400 .78rem/1.35 Arial;color:var(--suave);margin-top:6px}
.jogo .ler h3{font:700 .8rem Arial;letter-spacing:.1em;margin:var(--d2,20px) 0 var(--d1,8px);text-transform:uppercase}
/* 11/10/2026 (docente: «falta de cuidados de design»): o cartão acaba onde acaba o texto (o papel aparece por baixo) e o título da
   primeira caixa fica a 8 px do rótulo (proximidade), em vez de 20 + 20 */
.jogo .ler>.caixa:first-child>h3:first-child,.jogo .ler>h3:first-child{margin-top:0}.jogo .cartao>.rot:has(+.ler>.caixa:first-child>h3:first-child),.jogo .cartao>.rot:has(+.ler>h3:first-child){margin-bottom:var(--d1,8px)}
/* «A calçada do verso»: uma pedra por sílaba, brancas e pretas; «Quem sou eu?»: pistas que se abrem */
.jogo .verso-q{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.2rem;line-height:1.35;margin:0 0 var(--d2,20px)}.jogo .verso-q small{font:400 .78rem Arial;color:var(--suave);font-style:normal;display:block}
.jogo .calcada-v{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 var(--d1,8px)}.jogo .pedra{position:relative;min-width:44px;height:54px;padding:4px 8px;border:1px solid var(--tinta);background:var(--papel);color:var(--tinta);font:700 .95rem Arial;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px 7px 4px 8px;animation:pedraCai .35s ease-out both;animation-delay:calc(var(--k,0)*50ms);cursor:pointer}.jogo .pedra.preta{background:var(--tinta);color:var(--papel)}.jogo .pedra.elisao{min-width:64px}.jogo .pedra .num{position:absolute;right:4px;top:1px;font:700 .62rem Arial;opacity:.85}.jogo .pedra[aria-pressed="true"]{border-width:3px;padding:2px 6px;box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}.jogo .pedra.conta{box-shadow:inset 0 -5px 0 var(--mostarda,#d9a520)}.jogo .pedra.bom{box-shadow:0 0 0 3px var(--tinta,#000)}.jogo .pedra.mau{box-shadow:0 0 0 3px var(--errado,#c8232c)}.jogo .pedra.falta{box-shadow:0 0 0 3px var(--tinta,#000);border-style:dashed}.jogo .pedra.fora{opacity:.3}.jogo .pedra:disabled{cursor:default}@keyframes pedraCai{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.jogo .pistas{margin:0 0 var(--d2,20px);padding-left:1.3rem;font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.1rem}.jogo .pistas li{margin:0 0 6px;animation:entrar .3s ease-out both}.jogo .atrib{display:flex;gap:6px;margin:0 0 var(--d1,8px)}.jogo .atrib .simbolo{width:44px;height:44px}.jogo .atrib .simbolo *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.jogo .ler .fig .moldura{display:block;overflow:hidden;width:fit-content;max-width:100%}.jogo .ler .fig .moldura img{border:0;display:block;animation:kenburns 16s ease-out forwards;transform-origin:50% 40%}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.04)}}
.jogo .cartao.escuro{background:var(--tinta);color:var(--papel)}.jogo .cartao.escuro .rot{color:var(--papel);opacity:.75}

.jogo .cartao.escuro .levar{font:1.7rem/1.3 var(--maq,"Special Elite","Courier New",monospace);margin:14px 0 10px}.jogo .levar .ch{opacity:0;animation:tecla .01s steps(1) forwards;animation-delay:calc(var(--i,0)*45ms)}@keyframes tecla{to{opacity:1}}.jogo .levar .cursor{display:inline-block;width:.5em;border-bottom:3px solid currentColor;margin-left:3px;vertical-align:baseline;animation:pisca 1s steps(1) infinite}@keyframes pisca{50%{opacity:0}}

.jogo .cita{font-family:var(--serif,Georgia,serif);font-style:italic;font-size:1.02rem;line-height:1.45;margin:0 0 var(--d2,20px);padding:0 0 var(--d1,8px);border-bottom:1px solid var(--tinta);animation:entrar .3s ease-out both}
/* imagens a preto e branco; a cor volta quando a lição fica feita */

var K="epi-vozes";EPIJogo.montar({casca:CASCA,el:document.getElementById("baralho"),marca:"Vidas",titulo:"Nietzsche",itens:[{"t":"ler","rot":"Abre","titulo":"Nietzsche","html":"<p class=\"etq-m\">Vidas e vozes · Pensar · 25 min</p><p>Em 1882, num livro, um homem acende uma lanterna em plena manhã, corre para o mercado e grita que procura Deus. Riem-se dele. Por fim, parte a lanterna e diz: «Venho cedo demais» (tradução nossa). Friedrich Nietzsche (1844-1900) escreveu essa cena. Deixou de ensinar aos 34 anos, pensou a andar, horas por dia, em Sils-Maria, e sofreu em Turim, aos 44, um colapso de que nunca recuperou. A vida dele acabou em 1900; a dos seus livros, entre bons e maus leitores, continua.</p><dl class=\"vz-vc\"><dt>Visionário</dt><dd>Em <i>A Gaia Ciência</i> (1882), uma personagem anuncia que Deus morreu e que esse acontecimento «ainda está a caminho» (tradução nossa): uma tese sobre a cultura europeia. Em França, dos anos 1960 aos anos 1980, «Deus morreu», o perspetivismo e a ideia de poder como motor das ações marcaram a filosofia. Em vida, só teve um breve vislumbre da sua importância, em 1888, com as lições de Georg Brandes em Copenhaga.</dd><dt>Controverso</dt><dd>Atacou o cristianismo com violência, escreveu <i>Para a Genealogia da Moral</i> (1887) de forma a ofender os crentes cristãos e desconfiava da democracia, do Estado e das maiorias. Depois da sua morte, a irmã publicou com os cadernos dele <i>A Vontade de Poder</i> (1901 e 1906) e, nos anos 1930, nazis e fascistas italianos usaram passagens escolhidas a dedo.</dd></dl>"},{"t":"ler","rot":"Basileia, 1869","titulo":"Docente aos 24 anos, errante aos 35","html":"<div class=\"conceito\"><p>Friedrich Nietzsche nasceu a 15 de outubro de 1844 em Röcken, uma aldeia perto de Leipzig, na Alemanha, e recebeu o nome do rei da Prússia, Frederico Guilherme IV, que fazia anos nesse dia. O pai, pastor luterano da aldeia, morreu em 1849, quando o filho tinha quase cinco anos. Em novembro de 1868 conheceu o compositor Richard Wagner: uma amizade quase de família, e por vezes tempestuosa.</p><p>Em maio de 1869, com 24 anos, começou a ensinar Filologia Clássica na Universidade de Basileia, na Suíça. Em 1870 foi auxiliar de hospital na Guerra Franco-Prussiana. Enxaquecas, problemas de visão e vómitos levaram-no a deixar a universidade em junho de 1879. De 1880 a 1889 viveu como apátrida e sem casa fixa: Nice no inverno, Sils-Maria no verão, Turim, Génova, Veneza, Roma, nunca mais de alguns meses no mesmo sítio.</p><p>Em 1888, o crítico Georg Brandes deu lições sobre a sua obra na Universidade de Copenhaga: um breve vislumbre da importância que começava a ganhar. A 3 de janeiro de 1889, em Turim, Nietzsche sofreu um colapso de que nunca recuperou; a causa continua incerta. Viveu depois com a mãe, em Naumburg. Morta a mãe, a irmã levou-o em 1897 para a Villa Silberblick, em Weimar, e tratou dele até à morte, a 25 de agosto de 1900.</p></div><p class=\"insight\">As obras principais nasceram na década sem casa fixa, entre 1880 e 1889, longe da universidade que o tinha feito docente aos 24 anos.</p>"},{"t":"ler","rot":"Sils-Maria, 1881","titulo":"Pensar a andar","html":"<div class=\"conceito\"><p>Em janeiro de 1872, aos 27 anos, publicou o primeiro livro, <i>O Nascimento da Tragédia</i>. Wagner encheu-o de elogios, mas uma crítica violenta de outro filólogo prejudicou a receção do livro. Em 1878, <i>Humano, Demasiado Humano</i> marcou a viragem e a rutura com Wagner. É um livro de aforismos, textos curtos e fechados, e a partir daí escreveu muitos livros assim, e não em tratados.</p><p>Em Sils-Maria passou sete verões, em 1881 e de 1883 a 1888, num quarto modesto. Caminhava cinco a sete horas por dia e levava cadernos nos passeios. No primeiro verão, em 1881, chegou-lhe o pensamento do eterno retorno, a que chamou a «conceção de base» de <i>Assim Falava Zaratustra</i> (tradução nossa). Desses anos saíram <i>A Gaia Ciência</i> (1882), o <i>Zaratustra</i> (1883-1885) e <i>Para a Genealogia da Moral</i> (1887).</p><p>Em 1888, o último ano de trabalho, escreveu cinco livros. Em <i>Crepúsculo dos Ídolos</i> estão duas frases que hoje circulam sozinhas: «Sem música, a vida seria um erro.» e «O que não me mata torna-me mais forte.» («Sprüche und Pfeile», n.º 33 e n.º 8; tradução nossa). No livro, a segunda vem depois de um título: «Da escola de guerra da vida». Nietzsche compunha música desde a adolescência. <i>Ecce Homo</i>, também escrito em 1888, só foi publicado pela irmã em 1908.</p></div><p class=\"insight\">Escrever em aforismos dá frases que viajam sozinhas; ler bem é devolvê-las ao livro de onde saíram.</p>"},{"t":"ler","rot":"Um mercado, 1882","titulo":"O homem da lanterna","html":"<div class=\"conceito\"><p>A cena do homem da lanterna é o aforismo 125 de <i>A Gaia Ciência</i>, «O homem louco». Aos que se riem dele, o homem diz que Deus morreu e que fomos nós que o matámos; no fim, acrescenta que ainda não chegou o seu tempo. Quem fala é uma personagem, dentro de uma parábola. Para ler o aforismo, pergunta o que quer dizer, dentro da história, que o acontecimento ainda não chegou aos ouvidos das pessoas.</p><p>O mesmo livro guarda outras duas ideias. O <i>amor fati</i>, o amor ao destino, abre o livro IV (aforismo 276) com o desejo de «um dia ser apenas alguém que diz sim» (tradução nossa). O eterno retorno, «o peso mais pesado» (aforismo 341, tradução nossa), pede que imagines a tua vida a repetir-se em todos os pormenores: consegues afirmá-la tal como é? Em <i>Ecce Homo</i>, o <i>amor fati</i> tornou-se a sua fórmula: não querer nada diferente, nem para a frente nem para trás.</p><p>O perspetivismo diz que não há conhecer sem um ponto de vista: quantos mais olhares se juntam sobre uma coisa, mais completo é o conceito dela. A vontade de poder divide os estudiosos: a <i>Stanford Encyclopedia of Philosophy</i> avisa que não é óbvio o que quer dizer. Depois da Segunda Guerra, Walter Kaufmann leu esse poder como domínio de si e excelência cultural, e não como domínio dos outros; a mesma enciclopédia nota que essa leitura pode suavizar o desafio de Nietzsche.</p></div><p class=\"insight\">Os aforismos não fecham respostas: põem-te diante de uma experiência de pensamento e deixam-te a decisão.</p>"},{"t":"ler","rot":"Weimar, 1934","titulo":"A irmã, o arquivo e os leitores-saqueadores","html":"<div class=\"conceito\"><p>Elisabeth, a irmã mais nova (1846-1935), viveu de 1886 a 1893 no Paraguai, com o marido, a tentar fundar uma colónia alemã antissemita, a «Nueva Germania». Em 1894 fundou o Nietzsche-Archiv, que levou para Weimar. Com os cadernos do irmão, publicou em 1901 e 1906 uma seleção com o título <i>A Vontade de Poder</i>. A <i>Stanford Encyclopedia of Philosophy</i> diz que essa seleção não assentava nos planos que Nietzsche deixou e foi marcada pelo antissemitismo de Elisabeth, que afligia muito o próprio Nietzsche.</p><p>Adolf Hitler visitou o arquivo em 1932, 1933 e 1934; a Klassik Stiftung Weimar, hoje dona do arquivo, diz que não se sabe se leu Nietzsche a sério. Nos anos 1930, nazis e fascistas italianos adotaram aspetos de Nietzsche, em parte por incentivo de Elisabeth, juntando passagens escolhidas a dedo.</p><p>Os factos não apontam todos no mesmo sentido. Nietzsche demarcou-se publicamente do antissemitismo e desprezava o nacionalismo alemão; mas desconfiava da democracia, do Estado e das maiorias, e em <i>Para a Genealogia da Moral</i> usa clichés antissemitas ofensivos, virados com ironia contra os cristãos antissemitas. A brochura da exposição <i>Nietzsche in National Socialism</i> (Weimar, 2024) cita, ao lado de frases de ideólogos nazis, um aforismo de <i>Opiniões e Sentenças Várias</i> (1879, n.º 137): «Os piores leitores são os que procedem como soldados a saquear: tiram umas coisas de que se podem servir, sujam e baralham o resto e dizem mal do todo.» (tradução nossa).</p><p><b>Pensa tu:</b> um autor responde pelo uso que outros fazem dos seus textos, mesmo depois de morto?</p></div><p class=\"insight\">Um autor não escolhe os seus leitores, mas escolhe as suas palavras: a pergunta é quanto pesa cada uma.</p>"},{"t":"ler","rot":"Berlim, 1967","titulo":"Devolver os cadernos ao autor","html":"<div class=\"conceito\"><p>Durante anos, a associação aos nazis afastou Nietzsche de muitos leitores. Em 1950, Walter Kaufmann publicou <i>Nietzsche: Philosopher, Psychologist, Antichrist</i> e, em 1965, Arthur Danto publicou <i>Nietzsche as Philosopher</i>: os dois abriram caminho, no mundo de língua inglesa, a uma leitura séria. A partir de 1967, Giorgio Colli e Mazzino Montinari dirigiram a edição crítica das obras completas, a <i>Kritische Gesamtausgabe</i> (Berlim, W. de Gruyter), hoje a referência para os cadernos. A edição está em linha na Nietzsche Source, que tem interface em português, ao lado do fac-símile de todo o arquivo. Os manuscritos estão desde 1950 no Goethe- und Schiller-Archiv, em Weimar.</p><p>A lista de quem foi marcado por ele atravessa as artes e as ciências humanas: Albert Camus, Sigmund Freud, a bailarina Isadora Duncan, os compositores Gustav Mahler e Richard Strauss, os escritores Rilke e Thomas Mann, os filósofos Michel Foucault, Gilles Deleuze e Jacques Derrida.</p><p>A casa de Sils-Maria abriu como museu a 25 de agosto de 1960, sessenta anos depois da morte, e desde meados dos anos 1980 expõe arte contemporânea, porque Nietzsche inspirou artistas como poucos pensadores. O Nietzsche-Archiv reabriu em Weimar em 1991, como centro de investigação e museu. Em 2025, o espólio literário de Nietzsche entrou no registo «Memória do Mundo» da UNESCO.</p></div><p class=\"insight\">Um legado não é só fama: é o trabalho lento de guardar, editar e voltar a ler os papéis de alguém.</p>"},{"t":"ler","rot":"Lisboa, 1913","titulo":"Zaratustra fala português","html":"<div class=\"conceito\"><p>Em 1913, a Guimarães Editores publicou em Lisboa <i>Como Falava Zaratustra</i>, tradução de Araújo Pereira (1871-1941), na coleção «Sociológica». É a tradução portuguesa mais antiga que encontrámos no catálogo da Biblioteca Nacional. Mais tarde vieram <i>A Genealogia da Moral</i>, por Carlos José de Meneses (1946), <i>Ecce Homo</i>, por José Marinho (1952), e <i>Assim Falava Zaratustra</i>, por Alfredo Margarido (1964), que em 2019 ia na 17.ª edição. Entre 1997 e 2000, a Relógio d'Água publicou sete volumes de obras escolhidas; desde 2022, a Edições 70 traz traduções novas, como <i>Assim Falou Zaratustra</i>, de António Sousa Ribeiro (2022). Repara no verbo do título: «falava», no pretérito imperfeito, ou «falou», no perfeito.</p><p>Fernando Pessoa tinha na sua biblioteca <i>De Kant à Nietzsche</i>, de Jules de Gaultier (1910), com a sua assinatura, sublinhados e anotações à mão; a Casa Fernando Pessoa digitalizou o exemplar. A receção de Nietzsche em Portugal foi estudada por Américo Enes Monteiro, numa tese da Universidade do Porto (1997) sobre os anos de 1892 a 1939. A relação entre Pessoa e Nietzsche é o assunto de <i>Fernando Pessoa e Nietzsche: o pensamento da pluralidade</i>, de Nuno Ribeiro (2011), e de <i>Nietzsche e Pessoa: ensaios</i> (2016). Em 2001, a Biblioteca Nacional organizou a mostra <i>Depois de Nietzsche</i>; em 2011, Lisboa recebeu o Colóquio Internacional Nietzsche, Pessoa e Freud.</p></div><p class=\"insight\">Cada tradução é uma leitura: entre «falava» e «falou», o mesmo Zaratustra muda de tempo.</p>"},{"t":"escolha","rot":"A prova","p":"Que facto mostra melhor que _A Vontade de Poder_ não é um livro que Nietzsche tenha acabado?","o":["A irmã publicou em 1901 e 1906 uma seleção dos cadernos que não assentava nos planos que ele deixou.","O livro é feito de textos curtos, e não de capítulos longos.","Hitler visitou o Nietzsche-Archiv em 1932, 1933 e 1934.","Os manuscritos estão desde 1950 no Goethe- und Schiller-Archiv."],"c":0,"fe":[null,"Nietzsche publicou livros acabados em aforismos, como _Humano, Demasiado Humano_ (1878). A forma não prova nada; prova quem montou o livro e quando: Elisabeth, depois da morte do irmão.","As visitas mostram o uso político do arquivo, não a origem do livro. A prova vem antes: as edições de 1901 e 1906, montadas pela irmã a partir dos cadernos.","Saber onde os papéis estão hoje não diz quem os ordenou. O que conta é a seleção de Elisabeth, que a enciclopédia de Stanford diz não seguir os planos de Nietzsche."],"f":"A _Stanford Encyclopedia of Philosophy_ diz que a seleção de Elisabeth não assentava nos planos de Nietzsche e foi marcada pelo antissemitismo dela, que o afligia muito. Um livro com o nome do autor na capa pode ter sido montado por outra pessoa.","g":0},{"t":"escolha","rot":"A fama","p":"Nietzsche nunca duvidou de que os seus livros teriam um efeito duradouro, mas o reconhecimento chegou tarde. Que facto o mostra melhor?","o":["Deixou a Universidade de Basileia em 1879, por doença.","Escreveu cinco livros em 1888.","As lições de Georg Brandes sobre a sua obra chegaram em 1888, meses antes do colapso de que nunca recuperou.","Nasceu no dia de anos do rei da Prússia."],"c":2,"fe":["A saída de Basileia fala da saúde, não do reconhecimento. Procura o que aconteceu à fama: Brandes em 1888, o colapso a 3 de janeiro de 1889 e a influência no século XX.","Escrever muito não é ser lido. Procura um facto sobre os leitores: quem dava lições sobre a obra dele, e quando.",null,"É uma coincidência de calendário: não diz nada sobre quando a obra foi reconhecida. O que chegou tarde foi a fama: um breve vislumbre em 1888 e a influência mundial só depois da morte, em 1900."],"f":"Nietzsche não viveu a influência mundial que os seus livros tiveram. As lições de Brandes em Copenhaga, em 1888, deram-lhe só um vislumbre; a 3 de janeiro de 1889, em Turim, o trabalho parou.","g":1},{"t":"emparelhar","rot":"Os lugares","p":"Liga cada lugar ao que lá aconteceu.","pares":[["Basileia","Docente de Filologia Clássica, de 1869 a 1879"],["Sils-Maria","O pensamento do eterno retorno, no verão de 1881"],["Turim","O colapso de 3 de janeiro de 1889"],["Weimar","O arquivo da irmã e as visitas de Hitler, de 1932 a 1934"],["Lisboa","_Como Falava Zaratustra_, a tradução de 1913"]],"f":"Uma universidade, uma casa de verão, uma cidade onde tudo parou, um arquivo e uma editora: a vida de Nietzsche e a vida dos seus livros passam por lugares diferentes, e Weimar pertence às duas.","g":2},{"t":"ordenar","rot":"A ordem","p":"Põe por ordem, do mais antigo ao mais recente.","passos":["Sai _O Nascimento da Tragédia_","_Humano, Demasiado Humano_ marca a rutura com Wagner","Chega-lhe, em Sils-Maria, o pensamento do eterno retorno","Escreve _Ecce Homo_","A irmã publica _Ecce Homo_","Colli e Montinari começam a edição crítica"],"f":"1872, 1878, 1881, 1888, 1908, 1967. Entre a escrita de _Ecce Homo_ e a publicação passaram vinte anos, e o autor já tinha morrido; a edição crítica chegou quase sessenta anos depois dessa publicação.","g":3},{"t":"escolha","rot":"Dizer sim","p":"O _amor fati_ (aforismo 276) e o eterno retorno (aforismo 341) estão ambos em _A Gaia Ciência_. O que os liga?","o":["Os dois mandam obedecer a um destino escrito por outros.","Os dois pedem que se diga sim à vida tal como ela é, sem querer nada diferente.","Os dois explicam como ganhar poder sobre os outros.","Os dois dizem que Deus morreu."],"c":1,"fe":["O _amor fati_ é um desejo, «um dia ser apenas alguém que diz sim», e não uma ordem vinda de fora. Quem diz sim é a própria pessoa.",null,"Isso lembra uma leitura da vontade de poder, a que Kaufmann contestou. O eterno retorno pergunta outra coisa: se consegues afirmar a tua vida a repetir-se em todos os pormenores.","Essa frase é do homem da lanterna, no aforismo 125. O _amor fati_ e o eterno retorno falam da maneira de viver a própria vida."],"f":"O aforismo 276 deseja «ser apenas alguém que diz sim»; o 341 imagina a vida a repetir-se e pergunta se a conseguimos afirmar. Em _Ecce Homo_, Nietzsche fez do _amor fati_ a sua fórmula: não querer nada diferente, nem para a frente nem para trás.","g":4},{"t":"escolha","rot":"Os piores leitores","p":"Porque terá a brochura da exposição de 2024, em Weimar, posto o aforismo dos «piores leitores» ao lado de frases de ideólogos nazis?","o":["Para provar que Nietzsche foi nazi.","Para provar que Nietzsche não tem nada a ver com o uso que fizeram dele.","Porque Hitler citava esse aforismo nos discursos.","Para mostrar, com palavras do próprio Nietzsche, um modo de ler que tira o que serve e baralha o resto."],"c":3,"fe":["A mesma fundação lembra que Nietzsche se demarcou publicamente do antissemitismo e desprezava o nacionalismo alemão. Pôr as frases lado a lado mostra como foi lido, não fecha o que ele foi.","A fundação também regista que ele desconfiava da democracia, do Estado e das maiorias, e a enciclopédia de Stanford fala de clichés ofensivos na _Genealogia da Moral_. A brochura não fecha a questão.","Nada o diz: a fundação escreve que nem se sabe se Hitler leu Nietzsche a sério. O aforismo descreve leitores que saqueiam, e é isso que fica à vista.",null],"f":"Os «piores leitores» procedem como soldados a saquear: tiram o que lhes serve, sujam e baralham o resto. Ao lado das frases dos ideólogos, o aforismo dá nome ao que a enciclopédia de Stanford descreve: passagens escolhidas a dedo. Se o autor responde por isso, é a pergunta que fica.","g":5},{"t":"vf","rot":"A estante de Pessoa","p":"Com o que sabes da estante de Pessoa, podes afirmar que ele leu os livros do próprio Nietzsche.","v":false,"fe":"O que se sabe é menos: Pessoa tinha e anotou à mão _De Kant à Nietzsche_, de Jules de Gaultier (1910). Ter um livro sobre Nietzsche não prova que leu os livros de Nietzsche.","f":"Falso: a prova chega até à estante. A Casa Fernando Pessoa guarda o livro de Gaultier com a assinatura, os sublinhados e as notas de Pessoa; o resto pede os estudos, como _Nietzsche e Pessoa: ensaios_ (2016).","g":6},{"t":"escolha","rot":"Falava ou falou","p":"_Assim Falava Zaratustra_ (Alfredo Margarido, 1964) e _Assim Falou Zaratustra_ (António Sousa Ribeiro, 2022): o que muda no título?","o":["O autor: são livros de pessoas diferentes.","A personagem: num fala Zaratustra, no outro o homem da lanterna.","O tempo do verbo: «falava», no imperfeito, deixa a fala a decorrer; «falou», no perfeito, dá-a por acabada.","Nada: é a mesma tradução, reeditada."],"c":2,"fe":["O autor é o mesmo, Nietzsche. Mudam os tradutores, Margarido e Sousa Ribeiro, e com eles o tempo do verbo.","Zaratustra está nos dois títulos. O homem da lanterna é de outro livro, _A Gaia Ciência_ (1882).",null,"São duas traduções, de editoras diferentes: Guimarães e Edições 70. Em 1913 houve ainda outra, _Como Falava Zaratustra_, de Araújo Pereira."],"f":"Três títulos em português desde 1913: _Como Falava_, _Assim Falava_, _Assim Falou_. O imperfeito deixa a fala a durar; o perfeito fecha-a. Traduzir é decidir, a começar pelo tempo de um verbo.","g":7},{"t":"ler","rot":"Para levar","escuro":true,"html":"<p class=\"levar\">Antes de citar uma frase de Nietzsche, pergunta quem a diz, em que livro e quem a escolheu por ti.</p><div class=\"caderno\"><b>No caderno: escolhe um dos dois</b><p>Trabalha em papel e diz sempre de onde vem cada facto.</p><div class=\"vz-prod\"><b>Fanzine em papel: «Venho cedo demais»: um A4 dobrado em oito páginas, cinco lugares</b><ul><li>Uma página por lugar (Basileia, Sils-Maria, Turim, Weimar, Lisboa), cada uma com a data e um facto que se possa provar.</li><li>Uma citação curta, até duas frases, com a obra, o número do aforismo e quem a traduziu.</li><li>Uma página que separa o que Nietzsche escreveu do que outros fizeram com os seus textos, com nomes e datas.</li><li>Na contracapa, as fontes de onde vêm os factos.</li></ul></div><div class=\"vz-prod\"><b>Ensaio curto em papel: Um autor responde pelos seus leitores?</b><ul><li>Uma tese clara logo na primeira frase, numa página A4 escrita à mão.</li><li>Dois factos a favor e dois contra, cada um com a data e a fonte; o caso de Elisabeth e de <i>A Vontade de Poder</i> entra.</li><li>A posição contrária dita com justiça antes de lhe responderes.</li><li>Uma conclusão que volta à pergunta e usa, no máximo, uma frase dos «piores leitores», bem referida.</li></ul></div></div><p class=\"fontes-p\"><b>Fontes:</b> <a href=\"https://plato.stanford.edu/entries/nietzsche-life-works/\" target=\"_blank\" rel=\"noopener\">_Stanford Encyclopedia of Philosophy_, «Nietzsche's Life and Works»</a>; <a href=\"https://plato.stanford.edu/entries/nietzsche/\" target=\"_blank\" rel=\"noopener\">_Stanford Encyclopedia of Philosophy_, «Friedrich Nietzsche»</a>; <a href=\"https://publikationen.klassik-stiftung.de/servlets/MCRFileNodeServlet/ksw_derivate_00001053/KSW_Broschuere_2024_Nietzsche-NS_e.pdf\" target=\"_blank\" rel=\"noopener\">Klassik Stiftung Weimar, _Nietzsche in National Socialism_, brochura da exposição de 2024</a>; <a href=\"https://www.klassik-stiftung.de/nietzsche-archiv/\" target=\"_blank\" rel=\"noopener\">Klassik Stiftung Weimar, Nietzsche-Archiv</a>; <a href=\"https://nietzschehaus.ch/friedrich-nietzsche-in-sils-maria/thema-1/\" target=\"_blank\" rel=\"noopener\">Nietzsche-Haus, Friedrich Nietzsche em Sils-Maria</a>; <a href=\"https://nietzschehaus.ch/das-nietzsche-haus-i/geschichte-des-hauses/\" target=\"_blank\" rel=\"noopener\">Nietzsche-Haus, história da casa</a>; <a href=\"https://www.nietzschesource.org/\" target=\"_blank\" rel=\"noopener\">Nietzsche Source</a>; <a href=\"https://projekt-gutenberg.org/authors/friedrich-wilhelm-nietzsche/books/die-froehliche-wissenschaft/chapter/6\" target=\"_blank\" rel=\"noopener\">Projekt Gutenberg, _Die fröhliche Wissenschaft_ (aforismo 125)</a>; <a href=\"https://projekt-gutenberg.org/authors/friedrich-wilhelm-nietzsche/books/menschliches-allzumenschliches-ii/chapter/4\" target=\"_blank\" rel=\"noopener\">Projekt Gutenberg, _Menschliches, Allzumenschliches II_ (aforismo 137)</a>; <a href=\"https://www.gutenberg.org/cache/epub/7203/pg7203.txt\" target=\"_blank\" rel=\"noopener\">Project Gutenberg, _Götzen-Dämmerung_</a>; <a href=\"https://www.gutenberg.org/cache/epub/7202/pg7202.txt\" target=\"_blank\" rel=\"noopener\">Project Gutenberg, _Ecce homo_</a>; <a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!303270~!0\" target=\"_blank\" rel=\"noopener\">Biblioteca Nacional de Portugal, _Como Falava Zaratustra_ (1913)</a>; <a href=\"https://bibliotecaparticular.casafernandopessoa.pt/1-52\" target=\"_blank\" rel=\"noopener\">Casa Fernando Pessoa, Biblioteca Particular</a>.</p>"},{"t":"ler","rot":"Ler em português","titulo":"Para ler a seguir","html":"<ul class=\"vz-lista\"><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!2222671~!0\" target=\"_blank\" rel=\"noopener\"><i>Assim Falou Zaratustra</i></a><small>Friedrich Nietzsche, tradução de António Sousa Ribeiro, Edições 70, 2025, ISBN 978-972-44-2930-4. Introdução de Victor Gonçalves. Na BNP, cota S.A. 191737 V.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!2026190~!0\" target=\"_blank\" rel=\"noopener\"><i>Assim Falava Zaratustra</i></a><small>Friedrich Nietzsche, tradução de Alfredo Margarido, Guimarães, 2019, ISBN 978-972-665-656-2. 17.ª edição da tradução de 1964. Na BNP, cota S.A. 58348 P.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!996070~!0\" target=\"_blank\" rel=\"noopener\"><i>A Gaia Ciência</i></a><small>Friedrich Nietzsche, tradução de Maria Helena Rodrigues de Carvalho, Maria Leopoldina de Almeida e Maria Encarnação Casquinho, Relógio d'Água, 1998, ISBN 972-708-380-3. Prefácio de António Marques. O homem da lanterna é o aforismo 125. Na BNP, cota S.A. 38458 P.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!2161243~!0\" target=\"_blank\" rel=\"noopener\"><i>O Nascimento da Tragédia</i></a><small>Friedrich Nietzsche <li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1928729~!0\" target=\"_blank\" rel=\"noopener\"><i>Nietzsche e Pessoa: ensaios</i></a><small>Bartholomew Ryan, Marta Faustino e Antonio Cardiello (ed.), Tinta-da-China, 2016, ISBN 978-989-671-298-3. Para ler com Pessoa e o Português. Na BNP, cota S.A. 161809 V.</small></li><li><a href=\"https://catalogo.bnportugal.gov.pt/ipac20/ipac.jsp?profile=bn&amp;uri=full=3100024~!1786900~!0\" target=\"_blank\" rel=\"noopener\"><i>Fernando Pessoa e Nietzsche: o pensamento da pluralidade</i></a><small>Nuno Ribeiro, Verbo, 2011, ISBN 978-972-22-3035-3. Na BNP, cotas S.A. 54986 P. e S.A. 149545 V.</small></li></ul><p class=\"etq-m\">Requisita na Biblioteca Nacional ou nas Bibliotecas de Lisboa; a ligação abre o registo no catálogo.</p>"},{"t":"ler","rot":"Ver e ouvir","titulo":"Ligações","html":"<ul class=\"vz-lista\"><li><a href=\"https://www.youtube.com/watch?v=xt0Fy4mlkOM\" target=\"_blank\" rel=\"noopener\">Friedrich Nietzsches Schreibkugel (Klassik Stiftung Weimar)</a><small>A bola de escrever de Nietzsche, antepassada da máquina de escrever, guardada no Nietzsche-Archiv. Canal oficial da fundação dona do arquivo; título em alemão.</small></li><li><a href=\"https://ausstellung.nietzschehaus.ch/\" target=\"_blank\" rel=\"noopener\">Exposição em linha do Nietzsche-Haus, Sils-Maria</a><small>A casa onde passou sete verões, hoje museu: os objetos expostos, com explicações.</small></li><li><a href=\"https://bibliotecaparticular.casafernandopessoa.pt/1-52\" target=\"_blank\" rel=\"noopener\">_De Kant à Nietzsche_, o exemplar de Fernando Pessoa (Casa Fernando Pessoa)</a><small>O livro de Jules de Gaultier com a assinatura, os sublinhados e as notas de Pessoa, digitalizado.</small></li><li><a href=\"https://www.nietzschesource.org/\" target=\"_blank\" rel=\"noopener\">Nietzsche Source</a><small>A edição crítica de Colli e Montinari em versão digital, com o fac-símile do arquivo; tem interface em português.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f01/\">Português, Módulo 7: Quantos somos?</a><small>A heteronímia de Pessoa ao lado do perspetivismo: quantos olhares cabem numa pessoa? Um dos estudos portugueses chama-se, precisamente, <i>o pensamento da pluralidade</i>.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f04/\">Português, Módulo 7: Pensar é estar doente dos olhos</a><small>Caeiro desconfia do pensamento que se afasta das coisas; Nietzsche desconfia da metafísica que imagina o mundo à medida da razão. Duas desconfianças, dois tons.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/pt/m7/licao-m7-f08/\">Português, Módulo 7: Deus quer, o homem sonha, a obra nasce</a><small>Em <i>Mensagem</i>, a obra nasce de Deus e do sonho do homem; em <i>A Gaia Ciência</i>, o homem da lanterna pergunta se não teremos de nos tornar deuses. Quem é o autor da obra?</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/biblioteca/campos-tabacaria/\">Biblioteca: «Tabacaria»</a><small>O «não sou nada» de Campos ao lado do <i>amor fati</i> de Nietzsche: duas maneiras de olhar para a própria vida.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/investigar/passo-08/\">Como se investiga, passo 8: verificação lateral</a><small><i>A Vontade de Poder</i> tem o nome de Nietzsche na capa e foi montada pela irmã: verifica quem editou, quando e com que intenção.</small></li><li><a href=\"https://pedrohfernandes-klk.github.io/lente/sidequests/poder/\">Sidequests: como se lê o poder</a><small>«Vontade de poder» lida como domínio de si (Kaufmann) ou como domínio dos outros: o mesmo título, dois poderes.</small></li></ul>"}],chave:"epi-vozes-nietzsche",variar:false,mostrarAnterior:false,gestalt:true,percurso:"https://pedrohfernandes-klk.github.io/lente/vozes/",percursoRotulo:"Vidas e vozes",voltarRotulo:"Voltar a Vidas e vozes",seguinte:"https://pedrohfernan
